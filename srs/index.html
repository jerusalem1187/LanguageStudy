<script id="srs-app">
(() => {

// 日期、文本与数据校验。
const COLUMNS = ['id','lang','lesson','front','back','example','example_zh','note','tags'];
const LANGS = ['es','ru'];
const GRADES = [0,3,4,5];
const GRADE_NAMES = ['Again','Hard','Good','Easy'];
const CACHE_KEY = 'language-srs:v1:' + location.pathname;
const cloneValue = value => JSON.parse(JSON.stringify(value));

const localDay = (date = new Date()) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
function addDays(day, count) {
  const [y,m,d] = day.split('-').map(Number);
  const date = new Date(y,m-1,d,12);
  date.setDate(date.getDate()+count);
  return localDay(date);
}
function validDay(value) {
  return typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && value >= '1900-01-01' && value <= '9999-12-31' && addDays(value,0) === value;
}
const validISO = value => typeof value === 'string' && /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?(?:Z|[+-]\d\d:\d\d)$/.test(value) && validDay(value.slice(0,10)) && Number.isFinite(Date.parse(value));

const own = (obj,key) => Object.prototype.hasOwnProperty.call(obj,key);
const isLetter = row => row.lang === 'ru' && row.tags.split(';').includes('letter');
const recognitionOnly = row => row.tags.split(';').some(tag => tag === 'letter' || tag === 'phrase');
function validateRows(value) {
  if (!Array.isArray(value) || value.length > 50000) throw new Error('卡片应为数组，最多 50000 条词条。');
  const seen = new Set();
  return value.map((row,i) => {
    if (!row || typeof row !== 'object' || COLUMNS.some(key => typeof row[key] !== 'string')) throw new Error(`第 ${i+1} 条卡片缺少文本字段。`);
    const result = Object.fromEntries(COLUMNS.map(key => [key,row[key].normalize('NFC').trim()]));
    if (!validId(result.id) || !LANGS.includes(result.lang) || !new RegExp('^'+result.lang+'-\\d+$').test(result.lesson)) throw new Error(`第 ${i+1} 条的 id、lang 或 lesson 无效。`);
    if (seen.has(result.id)) throw new Error(`id 重复：${result.id}`);
    if (['front','back','example','example_zh'].some(key => !result[key])) throw new Error(`${result.id} 的词条、释义和例句不能为空。`);
    if (COLUMNS.some(key => result[key].length > 20000)) throw new Error(`${result.id} 的字段过长。`);
    seen.add(result.id);

  });
}
function pruneLog(log, now = new Date()) {
  const cutoff = addDays(localDay(now),-59);
  return log.filter(item => localDay(new Date(item.t)) >= cutoff).sort((a,b) => Date.parse(a.t)-Date.parse(b.t));
}
function validateState(value, now = new Date()) {
  if (!value || value.version !== 1 || !validISO(value.updatedAt) || !value.cards || typeof value.cards !== 'object' || Array.isArray(value.cards) || !Array.isArray(value.log)) throw new Error('进度格式无效，须为 version: 1 的状态 JSON。');
  const settings = value.settings?.newPerDay;
  if (!settings || LANGS.some(lang => !Number.isInteger(settings[lang]) || settings[lang] < 0 || settings[lang] > 999)) throw new Error('每日新卡数须为 0–999 的整数。');
  const log = value.log.map(item => {
    if (!item || !validISO(item.t) || !validCardId(item.card) || !GRADES.includes(item.grade)) throw new Error('复习日志含有无效记录。');
    return {t:new Date(item.t).toISOString(),card:item.card,grade:item.grade};
  });
  const firstLog = new Map();
  for (const item of log) {
    const day = localDay(new Date(item.t));
    if (!firstLog.has(item.card) || day < firstLog.get(item.card)) firstLog.set(item.card,day);
  }
  const cards = Object.create(null);
  for (const [id,record] of Object.entries(value.cards)) {
    if (!validCardId(id) || !record || !validDay(record.due) || !validDay(record.last) || !Number.isInteger(record.ivl) || record.ivl < 0 || record.ivl > 3000000 || !Number.isFinite(record.ease) || record.ease < 1.3 || !Number.isInteger(record.reps) || record.reps < 0 || !Number.isInteger(record.lapses) || record.lapses < 0) throw new Error(`卡片进度无效：${id}`);
    const first = record.first ?? firstLog.get(id) ?? record.last;
    if (!validDay(first) || first > record.last) throw new Error(`首次复习日期无效：${id}`);
    cards[id] = {due:record.due,ivl:record.ivl,ease:record.ease,reps:record.reps,lapses:record.lapses,last:record.last,first};
  }

function validCardId(value) {
  return typeof value === 'string' && /:[rp]$/.test(value) && validId(value.slice(0,-2));
}
function parseCSV(text) {
  text = text.replace(/^\uFEFF/,'');
  const rows = [];
  let row = [], field = '', quoted = false, closed = false;
  for (let i=0;i<text.length;i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') { quoted = false; closed = true; }
      else field += c;
    } else if (c === '"') {
      if (field || closed) throw new Error('CSV 引号位置无效。');
      quoted = true;
    } else if (c === ',') { row.push(field); field = ''; closed = false; }
    else if (c === '\r' || c === '\n') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(field);
      if (row.some(value => value !== '')) rows.push(row);
      row = []; field = ''; closed = false;
    } else {
      if (closed) throw new Error('CSV 闭引号后只能接逗号或换行。');
      field += c;
    }
  }
  if (quoted) throw new Error('CSV 有未闭合的引号。');
  row.push(field);
  if (row.some(value => value !== '')) rows.push(row);
  if (!rows.length || rows[0].join(',') !== COLUMNS.join(',')) throw new Error('CSV 表头须为：'+COLUMNS.join(','));
  if (rows.length === 1) throw new Error('CSV 没有卡片。');
  return validateRows(rows.slice(1).map((values,i) => {
    if (values.length !== COLUMNS.length) throw new Error(`CSV 第 ${i+2} 条记录应有 9 列，实际有 ${values.length} 列。`);

}
function mergeRows(current, incoming) {
  const map = new Map(current.map(row => [row.id,row]));

    if (map.has(row.id) && map.get(row.id).lang !== row.lang) throw new Error(`${row.id} 不能更换语言；请用新的 id。`);
    map.set(row.id,row);
  }
  return validateRows([...map.values()]);
}

// SM-2、队列与拼写。
function schedule(previous, grade, day) {
  if (!GRADES.includes(grade)) throw new Error('无效评分。');
  const old = previous || {ivl:0,ease:2.5,reps:0,lapses:0,first:day};
  const ease = Math.max(1.3,Math.round((old.ease + .1 - (5-grade)*(.08+(5-grade)*.02))*100)/100);
  const reps = grade === 0 ? 0 : old.reps+1;
  let ivl = grade === 0 ? 0 : reps === 1 ? (grade === 5 ? 4 : 1) : reps === 2 ? 6 : Math.max(1,Math.round(old.ivl*old.ease));
  ivl = Math.min(ivl,3000000);
  const due = addDays(day,ivl);
  if (!validDay(due)) throw new Error('间隔超出可保存的日期范围。');
  return {due,ivl,ease,reps,lapses:old.lapses+(grade === 0 ? 1 : 0),last:day,first:old.first || old.last || day};
}
function expandCards(rows) {
  return rows.flatMap(row => (recognitionOnly(row) ? ['r'] : ['r','p']).map(direction => ({id:row.id+':'+direction,direction,row})));
}
function cardOrder(a,b) {
  return a.row.lesson.localeCompare(b.row.lesson,undefined,{numeric:true}) || a.row.id.localeCompare(b.row.id,undefined,{numeric:true}) || (a.direction === b.direction ? 0 : a.direction === 'r' ? -1 : 1);
}
function buildQueue(rows, state, lang, day) {
  const all = expandCards(rows).filter(card => lang === 'all' || card.row.lang === lang);
  const due = all.filter(card => own(state.cards,card.id) && state.cards[card.id].due <= day).sort((a,b) => state.cards[a.id].due.localeCompare(state.cards[b.id].due) || cardOrder(a,b));
  const fresh = [];
  for (const language of LANGS) {
    const introduced = all.filter(card => card.row.lang === language && state.cards[card.id]?.first === day).length;
    const allowance = Math.max(0,state.settings.newPerDay[language]-introduced);
    const eligible = all.filter(card => card.row.lang === language && !own(state.cards,card.id) && (card.direction === 'r' || (state.cards[card.row.id+':r']?.first || day) < day)).sort(cardOrder);
    fresh.push(...eligible.slice(0,allowance));
  }

function spellingResult(input, target, lang) {
  const normal = text => {
    const nfc = text.trim().normalize('NFC');
    return lang === 'ru' ? nfc.replace(/\u0301/g,'') : nfc;
  };
  const actual = normal(input), expected = normal(target);

  if (plain(actual) === plain(expected)) return {grade:3,kind:'symbols',message:'拼写对了，符号错了'};

function mergeProgress(current,incoming,now = new Date()) {

  for (const [id,record] of Object.entries(incoming.cards)) {
    const old = own(merged.cards,id) ? merged.cards[id] : null;
    const useIncoming = !old || record.last > old.last || (record.last === old.last && lastTime(incoming,id) > lastTime(current,id));
    const chosen = cloneValue(useIncoming ? record : old);
    if (old) chosen.first = [old.first || old.last,record.first || record.last].sort()[0];

  });

function spanishARExplanation() {
  return `<div class="lesson-text"><p>配合《现代西班牙语》第 2 课，按本周目标选择读写部分；教材课次仅作指引，下面是原创讲解与例句。先读表，再抄写变位与例句，分几天完成 10 题。</p>
  <h4>-ar 规则动词：去掉 -ar，再加人称词尾</h4><p>hablar（说）→ habl-；estudiar（学习）、trabajar（工作）及本课 20 个 -ar 动词采用同一套现在时词尾。主语可省略，但初学写句子可先保留。这里只练书面词形。</p>
  <div class="table-wrap"><table><caption>hablar、tener、ir 现在时：全部人称</caption><thead><tr><th>主语</th><th>-ar 词尾</th><th>hablar（说）</th><th>tener（有）</th><th>ir（去）</th></tr></thead><tbody>
  <tr><td>yo</td><td>-o</td><td>hablo</td><td>tengo</td><td>voy</td></tr>
  <tr><td>tú</td><td>-as</td><td>hablas</td><td>tienes</td><td>vas</td></tr>
  <tr><td>él / ella / usted</td><td>-a</td><td>habla</td><td>tiene</td><td>va</td></tr>
  <tr><td>nosotros / nosotras</td><td>-amos</td><td>hablamos</td><td>tenemos</td><td>vamos</td></tr>
  <tr><td>vosotros / vosotras</td><td>-áis</td><td>habláis</td><td>tenéis</td><td>vais</td></tr>
  <tr><td>ellos / ellas / ustedes</td><td>-an</td><td>hablan</td><td>tienen</td><td>van</td></tr>
  </tbody></table></div><p>tener 和 ir 不按 -ar 规则变位，要整列记。usted 用第三人称单数，ustedes 用第三人称复数；西班牙的 vosotros / vosotras 使用第二人称复数。</p>
  <p lang="es">Yo estudio español. / Nosotros tenemos dos libros. / Vosotras vais a la escuela.</p><p>我学习西班牙语。／我们有两本书。／你们去学校。去某地常用 ir a + 地点。</p>
  <h4>名词和冠词一起记</h4><div class="table-wrap"><table><caption>定冠词与不定冠词</caption><thead><tr><th>性与数</th><th>定冠词：已知或特指</th><th>不定冠词：一个／一些</th></tr></thead><tbody>
  <tr><td>阳性单数</td><td>el libro</td><td>un libro</td></tr><tr><td>阴性单数</td><td>la casa</td><td>una casa</td></tr>
  <tr><td>阳性复数</td><td>los libros</td><td>unos libros</td></tr><tr><td>阴性复数</td><td>las casas</td><td>unas casas</td></tr>
  </tbody></table></div><ul>
  <li>-o 结尾通常为阳性：el libro（书）；-a 结尾通常为阴性：la casa（房子）。这是线索，不能替代词条性别。</li>
  <li>-ción、-dad、-tad 通常为阴性：la canción（歌曲）、la ciudad（城市）、la universidad（大学）、la libertad（自由）。</li>
  <li>许多源于希腊语的 -ma 名词为阳性，如 el problema（问题）；不能把所有 -ma 词都判成阳性。</li>
  <li>单独记例外：el día（天，阳性）、la mano（手，阴性）、el problema（问题，阳性）。</li>
  <li>职业或人物词看具体形式：el profesor / la profesora（教师）；el artista / la artista（艺术家）、el policía / la policía（警察）靠冠词区分人物性别。单说职业或身份时：Soy médico. / Soy estudiante.（我是医生／学生。）通常不用冠词。</li></ul>
  <h4>复数和重音符号一起检查</h4><ul>
  <li>元音结尾通常加 -s：el libro → los libros；la mano → las manos。</li>
  <li>辅音结尾通常加 -es：el país → los países；la ciudad → las ciudades。</li>
  <li>-z → -ces：el lápiz → los lápices（铅笔）；不能写成 lápizes。</li>
  <li>词尾改变后重新看重音规则：la canción → las canciones，复数不标 ó；el país → los países，í 仍保留。el lunes → los lunes 等非末音节重读的 -s 结尾星期词，词形不变；el sábado → los sábados。</li></ul>
  <h4>否定与疑问：只改必要的书面部分</h4><p>否定用 no + 动词：<span lang="es">No trabajo en la oficina.</span>（我不在办公室工作。）语调疑问句可以保持陈述句语序，书写时两端加 ¿…?：<span lang="es">Tú estudias español. → ¿Tú estudias español?</span>（你学习西班牙语。→你学习西班牙语吗？）本阶段不做语调训练。肯定回答 sí 带 í：<span lang="es">Sí, estudio español.</span>（是的，我学习西班牙语。）</p>
  <h4>缩合、小词和本周词汇</h4><p>de + el → del；a + el → al：<span lang="es">El libro del estudiante está aquí. / Voy al parque.</span>（学生的书在这里。／我去公园。）de la、a la 等不缩合；重读代词 él 也不缩合。指具体的人时，动词后的对象常带 a：<span lang="es">Quiero ayudar a la madre.</span>（我想帮助母亲。）</p>
  <p>家庭成员承接旧词 la familia、la madre、el padre；地点承接 la ciudad、la escuela、la universidad，并新增 15 个地点。星期、语言名小写；el lunes 表示某个星期一，los lunes 表示每逢星期一。数字 11–31 见词表，特别记 dieciséis、veintidós、veintitrés、veintiséis；独立的 veintiuno 在名词前用 veintiún libros / veintiuna casas，treinta y uno 同理。</p>
  <p>mañana（明天）不带冠词；ayer（昨天）本周只识记时间词组，不拿它造现在时的过去事件句。siempre（总是）、nunca（从不）、a veces（有时）先放动词前：<span lang="es">Siempre estudio. / Nunca trabajo en casa. / A veces voy al parque.</span>（我总是学习。／我从不在家工作。／我有时去公园。）</p>
  <h4>写 5 句自我介绍：中文提纲</h4><p>本课专名：Ana（安娜）、China（中国）、España（西班牙）、Pekín（北京）。语言名 el chino（中文）、el inglés（英语）连冠词记；在 hablar 后通常省冠词。vivo 来自旧词 vivir，本周先按固定词形写“我住”，完整变位留到第 3 周。</p>
  <ol><li>名字：<span lang="es">Soy Ana.</span>（我是安娜。）将姓名换成自己的名字。</li>
  <li>来自哪里：<span lang="es">Soy de China.</span>（我来自中国。）</li>
  <li>职业或学生身份：<span lang="es">Soy estudiante.</span>（我是学生。）可换成本课适合自己的职业词形。</li>
  <li>住在哪里：<span lang="es">Vivo en Pekín.</span>（我住在北京。）</li>
  <li>会什么语言：<span lang="es">Hablo chino y también inglés.</span>（我会说中文，也会说英语。）这里是书面自述，不安排口语任务。</li></ol>
  <p>只按真实情况写，示例不代表你的个人信息；新增自己的地名时先核对拼写。第二天盖住西语，只看中文提纲默写这 5 句。</p></div>`;
}

function spanishERIRExplanation() {
  return `<div class="lesson-text"><p>配合《现代西班牙语》第 3 课，练规则动词与性数一致；词表、短文和写作都围绕日常读写。前两周的规则继续使用。</p>
  <h4>-er / -ir：词干不变，替换词尾</h4><div class="table-wrap"><table><caption>comer（吃）、vivir（住）现在时：全部人称</caption><thead><tr><th>主语</th><th>-er 词尾</th><th>comer</th><th>-ir 词尾</th><th>vivir</th></tr></thead><tbody>
  <tr><td>yo</td><td>-o</td><td>como</td><td>-o</td><td>vivo</td></tr>
  <tr><td>tú</td><td>-es</td><td>comes</td><td>-es</td><td>vives</td></tr>
  <tr><td>él / ella / usted</td><td>-e</td><td>come</td><td>-e</td><td>vive</td></tr>
  <tr><td>nosotros / nosotras</td><td>-emos</td><td>comemos</td><td>-imos</td><td>vivimos</td></tr>
  <tr><td>vosotros / vosotras</td><td>-éis</td><td>coméis</td><td>-ís</td><td>vivís</td></tr>
  <tr><td>ellos / ellas / ustedes</td><td>-en</td><td>comen</td><td>-en</td><td>viven</td></tr>
  </tbody></table></div><p>两类在 nosotros、vosotros 的词尾不同。旧词 leer、escribir 在现在时也按规则变：leo / lees / lee / leemos / leéis / leen；escribo / escribes / escribe / escribimos / escribís / escriben。本课 beber、aprender 等 15 个动词按现在时规则分类，不表示它们所有时态都规则。</p>
  <p lang="es">Nosotros comemos arroz. / Vosotras vivís en China. / Ellos escriben en español.</p><p>我们吃米饭。／你们住在中国。／他们用西班牙语写东西。</p>
  <p><strong>假朋友：</strong>asistir a 表示出席或参加，不是英语 assist 的“帮助”；帮助用旧词 ayudar。<span lang="es">Asisto a la clase.</span>（我去上这节课。）deber + 不定式表示应该：<span lang="es">Debo estudiar.</span>（我应该学习。）</p>
  <h4>形容词跟名词配合</h4><div class="table-wrap"><table><caption>性数变化与常用位置</caption><thead><tr><th>类型</th><th>阳性单／复数</th><th>阴性单／复数</th></tr></thead><tbody>
  <tr><td>-o → -a / -os / -as</td><td>el libro nuevo / los libros nuevos</td><td>la casa nueva / las casas nuevas</td></tr>
  <tr><td>-e 结尾：只变数</td><td>el libro interesante / los libros interesantes</td><td>la clase interesante / las clases interesantes</td></tr>
  <tr><td>本课常见辅音结尾：只变数</td><td>el niño feliz / los niños felices</td><td>la niña feliz / las niñas felices</td></tr>
  </tbody></table></div><p>复习 fácil → fáciles、difícil → difíciles、importante → importantes、largo → larga / largos / largas；本课补充疲倦、忙碌、价格、颜色等词。辅音结尾不能一概而论，例如旧词 español 的阴性是 española；本课 feliz、fácil、difícil、azul 这组阴阳同形。</p>
  <p>初学先把描述性形容词放名词后：<span lang="es">la casa blanca</span>（白色房子）。它也可以跟在 ser / estar 后：<span lang="es">La casa es blanca. / La madre está cansada.</span>（房子是白色的。／母亲累了。）位置有其他用法，以后再扩展。</p>
  <p>bueno 在阳性单数名词前缩成 buen：<span lang="es">un buen libro</span>（一本好书）；在后面仍用 bueno：<span lang="es">un libro bueno</span>。阴性和复数不这样缩：<span lang="es">una buena casa / unos buenos libros</span>（一所好房子／一些好书）。</p>
  <h4>物主形容词：看“被拥有的东西”的性数</h4><div class="table-wrap"><table><caption>放在名词前，不再加定冠词</caption><thead><tr><th>拥有者</th><th>一个东西</th><th>多个东西</th></tr></thead><tbody>
  <tr><td>我</td><td>mi</td><td>mis</td></tr><tr><td>你</td><td>tu</td><td>tus</td></tr><tr><td>他／她／您；他们／她们／各位</td><td>su</td><td>sus</td></tr>
  <tr><td>我们</td><td>nuestro / nuestra</td><td>nuestros / nuestras</td></tr><tr><td>你们（vosotros / vosotras）</td><td>vuestro / vuestra</td><td>vuestros / vuestras</td></tr>
  </tbody></table></div><p lang="es">Mi casa es pequeña. / Mis libros son nuevos. / Nuestra casa es blanca. / Vuestros libros están aquí.</p><p>我的房子很小。／我的书是新的。／我们的房子是白色的。／你们的书在这里。mi、tu 没有重音；tú（你）有重音。su / sus 的拥有者单复数要看语境，sus libros 可以是“他的一些书”，不能只凭 sus 判成“他们的”。</p>
  <h4>hay：有、存在</h4><p lang="es">Hay una mesa en la cocina. / Hay dos sillas en la habitación.</p><p>厨房里有一张桌子。／房间里有两把椅子。hay 来自 haber，表示存在时不分单复数；后面常接不定冠词、数字或无冠词名词。tener 表示拥有：<span lang="es">Tengo un libro.</span>（我有一本书。）已知东西的位置用 estar：<span lang="es">El libro está en la mesa.</span>（书在桌子上。）</p>
  <h4>时间：几点与在几点</h4><p lang="es">¿Qué hora es? / Es la una. / Son las dos y media. / Son las tres en punto.</p><p>几点了？／一点。／两点半。／三点整。报时只有一点用 Es la una，其他点数用 Son las…；问句 hora 是旧词 la hora（小时、时刻），这里用单数。几点做事则用 a la / a las：<span lang="es">Como a la una. / Estudio a las dos y media.</span>（我一点吃饭。／我两点半学习。）</p>
  <p>la mañana 是早上；por la mañana / por la tarde / por la noche 表示在早上／下午／晚上，por 在这些时间短语里一起记。mañana 不带冠词则是“明天”：<span lang="es">Mañana estudio por la mañana.</span>（我明天上午学习。）cada día 是每天，cada mañana 是每天早上；antes de la clase 是上课前，después 是之后。</p>
  <p>12 个月份通常小写且不加冠词：<span lang="es">en enero / en octubre</span>（在一月／十月）。月份卡采用 el mes de enero 等完整名词短语，便于连同名词性别识记，不表示直接说月份时也必须加 el。la semana 有七天，el año 有十二个月；el mes 的复数是 los meses。</p>
  <h4>频率副词的位置</h4><p lang="es">Siempre leo en casa. / A veces estudio en la biblioteca. / Nunca compro café. / No compro café nunca.</p><p>我总在家阅读。／我有时在图书馆学习。／我从不买咖啡。／我从不买咖啡。siempre、a veces 可放句首或主语与动词之间；nunca 在动词前不加 no，在动词后通常需要前置 no。不要照英语机械放在所有动词后。</p>
  <h4>写 5 句“我每天做什么”：中文提纲</h4><ol>
  <li>早饭吃喝什么：<span lang="es">Cada mañana desayuno pan y bebo café.</span>（我每天早上吃面包、喝咖啡。）</li>
  <li>几点上课或学习：<span lang="es">A las nueve asisto a la clase.</span>（我九点去上这节课。）</li>

  <tr><td>yo</td><td>pienso</td><td>duermo</td><td>pido</td></tr><tr><td>tú</td><td>piensas</td><td>duermes</td><td>pides</td></tr>
  <tr><td>él / ella / usted</td><td>piensa</td><td>duerme</td><td>pide</td></tr><tr><td>nosotros / nosotras</td><td>pensamos</td><td>dormimos</td><td>pedimos</td></tr>
  <tr><td>vosotros / vosotras</td><td>pensáis</td><td>dormís</td><td>pedís</td></tr><tr><td>ellos / ellas / ustedes</td><td>piensan</td><td>duermen</td><td>piden</td></tr>
  </tbody></table></div><ul>
  <li>e→ie：pensar → pienso（想）、entender → entiendo（理解）、empezar → empiezo（开始）、cerrar → cierro（关闭）；querer 也属这类。</li>
  <li>o→ue：poder → puedo（能够）、dormir → duermo（睡觉）、volver → vuelvo（返回）、almorzar → almuerzo（吃午饭）。</li>
  <li>e→i：pedir → pido（请求；点餐）、servir → sirvo（端上；提供）。decir 兼有特殊 yo digo，不能只替换元音。</li></ul>
  <p>这些变化出现在词干重读的人称，不扩展到所有时态；每张动词卡的 note 都列出六个人称。本课共 20 个动词，poder 只计一次，querer 是对旧卡的完整变位复习。</p>
  <p lang="es">Empiezo a estudiar. / Nosotros empezamos a estudiar. / Ellos vuelven a casa. / Vosotros servís el desayuno.</p><p>我开始学习。／我们开始学习。／他们回家。／你们端上早餐。empezar a + 不定式；volver a casa 表示回家。pedir 请求东西，preguntar 问问题：<span lang="es">Pido un café. / Pregunto al profesor.</span>（我点一杯咖啡。／我向教师提问。）</p>
  <h4>saber 与 conocer</h4><p>saber 用于知道信息、事实，或会做某事：<span lang="es">Sé la hora. / Sé leer en español.</span>（我知道时间。／我会用西班牙语阅读。）conocer 用于认识人、熟悉地点等：<span lang="es">Conozco a la profesora. / Conozco la ciudad.</span>（我认识这位女教师。／我熟悉这座城市。）具体的人作对象时留意 a。不要用 conocer + 不定式表达“会做”。</p>
  <h4>读前复习清单</h4><ul>
  <li>冠词：能从中文写出 el / la / los / las、un / una / unos / unas 与名词的配合；检查 al、del。</li>
  <li>性数：检查名词复数与形容词、物主词：<span lang="es">las casas blancas / nuestros libros nuevos</span>（白色房子们／我们的新书）。el día、la mano、el problema 单独回忆。</li>
  <li>三类规则动词：不看表写 hablar、comer、vivir 的六个人称；检查 habláis、coméis、vivís 的重音。</li>
  <li>否定和存在：no + 动词；hay 不随后面的名词变单复数。报时区分 Es la una 与 Son las dos。</li></ul>
  <h4>阅读策略：20 个同源词与国际词线索</h4><p>先找人称、动词和时间，再用英语相近词形猜主题，最后结合中文核对。下面 20 个新词已入本课词表；用 el documento、normal、la comunicación 补足清单，避免再给已有的 el problema、importante 建同源词卡。</p>
  <div class="table-wrap"><table><caption>西语—英语—中文</caption><thead><tr><th>西语（名词带冠词）</th><th>英语线索</th><th>中文</th></tr></thead><tbody>${ES04_COGNATES.map(row=>'<tr>'+row.map(cell=>'<td>'+esc(cell)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>
  <ul><li>-tion 常对应 -ción：nation → la nación，information → la información，communication → la comunicación；这些名词为阴性，单数保留 ó。</li>
  <li>-ous 常对应 -oso：famous → famoso；-ble 对应 -ble：possible → posible，西语这里不双写 s。</li>
  <li>-ent 常对应 -ente：different → diferente；辅音组合有时简化，留意西语不同的字母数。</li>
  <li>有的拼写相同或接近：animal、hotel、natural、general、popular、normal；有的要调整词尾：document → el documento、moment → el momento、music → la música、system → el sistema。special → especial 多一个词首 e。</li>
  <li>英语 -ty 常对应 -dad，复习 city → la ciudad、university → la universidad。规律是线索，不是逐字转换公式；借词和同源词的历史来源可能不同，意义范围也不完全一样。复习假朋友 asistir（出席），不要猜成“帮助”。</li></ul>
  <h4>默写与 10-11 月度检查点 1</h4><p>平日：盖住西语原稿，只看中文，默写第 1 周抄写的句子、第 2 周自我介绍和第 3 周日常 5 句；再对照，分别标出词形、冠词、性数和重音错误。</p>
  <details><summary>10-11 月度检查点 1：按 framework/metrics-and-review.md 自测</summary><ol>
  <li>阅读复述用下方本课短文，先合上中文，不查词典读一遍，用中文写出人物、时间与活动，再对照逐句翻译，读懂比例评 1–5。本次按任务约定用本课篇幅；若已读过，记录为熟悉文本复测，与框架建议的约 300 词陌生文本区分。</li>
  <li>限时写作 15 分钟，不查词典，目标 100 词；用已学现在时写本月的学习与日常，可围绕自己、家人、一天的活动展开。之后用词典和语法书修改，记录错误数，并在 spanish/errors.md 留下错误；本页不自动批改作文。</li>
  <li>记录 SRS 总卡数、已掌握数（间隔至少 21 天）与正确率，注明页面统计为最近 30 天；记录 log/time.csv 的本月小时和累计小时。</li>
  <li>兴趣评 1–5，写下下个月是否想继续；保留原稿、修改稿和复述，替代当周周志。</li></ol></details></div>`;
}
function spanishReflexiveExplanation() {
  return `<div class="lesson-text"><p>配合《现代西班牙语》第 5 课。本周三件事：反身动词、gustar 的语序、ir a + 不定式。西语从本周起每天 25 分钟，分成 SRS 10 分钟和阅读 15 分钟；每周另做一次 30 分钟，前 15 分钟看语法点，后 15 分钟写 5 句。</p>
  <h4>反身代词与反身动词</h4><p>反身动词的不定式以 -se 结尾：<span lang="es">levantarse</span>（起床）。用的时候把 -se 换成与主语对应的反身代词，动词本身照原来的规则变位。</p>
  <div class="table-wrap" tabindex="0" aria-label="可横向滚动的反身动词变位表"><table><caption>反身动词直陈式现在时：全部人称</caption><thead><tr><th>主语</th><th>反身代词</th><th>levantarse（起床）</th><th>ducharse（洗澡）</th><th>acostarse（睡觉，o→ue）</th></tr></thead><tbody>${ES05_REFLEXIVE.map(row=>'<tr>'+row.map(cell=>'<td>'+esc(cell)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>
  <p>代词有两个位置，意思一样：放在变位动词前，或接在不定式后连写。<span lang="es">Me voy a levantar. / Voy a levantarme.</span>（我要起床了。）两种都对，先各写几遍，再固定用一种。</p>
  <h4>本课十个反身动词按词干变化分组</h4><ul>
  <li>词干不变：llamarse（名叫）、lavarse（洗）、quedarse（留下）、ducharse（洗澡）、peinarse（梳头）。</li>
  <li>e→ie：despertarse → me despierto（醒来）；sentarse → me siento（坐下）。</li>
  <li>o→ue：acostarse → me acuesto（上床睡觉）。</li>
  <li>e→i：vestirse → me visto（穿衣服）。</li></ul>
  <p>词干变化只出现在 yo、tú、él、ellos 四组，nosotros 和 vosotros 保持原词干：<span lang="es">nos acostamos、os vestís</span>。</p>
  <p>说到自己身体的部位和身上的衣物时用定冠词，不用物主形容词：<span lang="es">Me lavo las manos. / Me lavo los dientes.</span>（我洗手。／我刷牙。）不说 mis manos。另外 <span lang="es">despertarse</span> 是醒来，<span lang="es">levantarse</span> 是起身离开床，两件事分开说。</p>
  <h4>gustar：主语是被喜欢的那样东西</h4><p>西语的说法不是“我喜欢电影”，而是“电影使我喜欢”。所以动词只跟着后面那样东西变单复数，喜欢的人用间接宾语代词 me、te、le、nos、os、les。</p>
  <div class="table-wrap"><table><caption>gustar 的两种形式</caption><thead><tr><th>人（间接宾语代词）</th><th>后面是单数</th><th>后面是复数</th></tr></thead><tbody>${ES05_GUSTAR.map(row=>'<tr>'+row.map(cell=>'<td>'+esc(cell)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>
  <p>动词只有 gusta 和 gustan 两个形式在用，不写 gusto、gustamos。要强调或点明是谁，在句首加 a + 人：<span lang="es">A mí me gusta el té. / A Juan le gusta el fútbol.</span>（我喜欢茶。／胡安喜欢足球。）加了 a Juan，le 仍然要留着，不能省。</p>
  <p>encantar 用法完全一样，语气更强，不再加 muy：<span lang="es">Me encanta el baile.</span>（我非常喜欢跳舞。）后面接不定式时用单数：<span lang="es">Me gusta leer. / Nos gusta nadar.</span>（我喜欢读书。／我们喜欢游泳。）</p>
  <h4>ir a、tener que、hay que + 不定式</h4><ul>
  <li>ir a + 不定式表示打算或马上要做：<span lang="es">Voy a estudiar. / Vamos a comer.</span>（我打算学习。／我们要去吃饭。）六个形式是 voy a、vas a、va a、vamos a、vais a、van a。</li>
  <li>tener que + 不定式表示某个人必须做：<span lang="es">Tengo que trabajar. / Tenéis que leer.</span>（我必须工作。／你们必须读。）</li>
  <li>hay que + 不定式不指明是谁，表示泛指的应该：<span lang="es">Hay que descansar.</span>（该休息了。）只有这一个形式，不随人称变化。</li></ul>
  <h4>时间副词</h4><p>temprano（早）、tarde（晚）、luego（然后）、pronto（很快）、casi（几乎），加上第 3 周学过的 antes（之前）、después（之后）。名词 la tarde 是下午，副词 tarde 是“晚地”，靠有没有冠词分辨：<span lang="es">Por la tarde estudio. / Llego tarde.</span>（下午我学习。／我到晚了。）</p>
  <h4>本周写作提纲</h4><p>写 5 句：① 我几点醒、几点起床；② 早上按什么顺序做事，用 luego、después 连起来；③ 我喜欢什么，gusta 和 gustan 各写一句；④ 我不太喜欢什么；⑤ 这个周末我打算做什么，用 ir a + 不定式。写完检查三处：反身代词有没有跟人称对上、gustar 有没有跟后面的单复数对上、重音符号有没有漏。</p></div>`;
}
function spanishObjectPronounExplanation() {
  return `<div class="lesson-text"><p>配合《现代西班牙语》第 6 课。本周三件事：宾语代词、指示词三级、现在进行时。每天 25 分钟仍是 SRS 10 分钟加阅读 15 分钟，每周一次 30 分钟用来看语法点和写 5 句。</p>
  <h4>直接宾语代词与间接宾语代词</h4><p>直接宾语是动作直接作用的对象（买什么、看什么），间接宾语是收受的一方（给谁、对谁说）。两套代词只有第三人称不同。</p>
  <div class="table-wrap" tabindex="0" aria-label="可横向滚动的宾语代词表"><table><caption>两套宾语代词</caption><thead><tr><th>对应人称</th><th>直接宾语</th><th>间接宾语</th></tr></thead><tbody>${ES06_PRONOUNS.map(row=>'<tr>'+row.map(cell=>'<td>'+esc(cell)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>
  <p>第三人称的直接宾语代词要跟着被替换的名词配合性数：el libro → lo，la carta → la，los libros → los，las cartas → las。</p>
  <p lang="es">Compro el libro. → Lo compro. / Quiero las gafas. → Las quiero. / Escribo la carta. → La escribo.</p><p>我买这本书。→我买它。／我要这副眼镜。→我要它。／我写这封信。→我写它。</p>
  <h4>代词放在哪里</h4><ul>
  <li>变位动词前，分开写：<span lang="es">Lo compro. / No lo compro.</span>（我买它。／我不买它。）有 no 时，no 在代词前。</li>
  <li>接在不定式后连写：<span lang="es">Quiero verlo.</span>（我想看它。）也可以写成 <span lang="es">Lo quiero ver.</span>，两种都对。</li>
  <li>接在副动词后连写，这时要按重音规则补符号：<span lang="es">Estoy leyéndolo.</span>（我正在读它。）也可以写成 <span lang="es">Lo estoy leyendo.</span>。leyendo 本来重读在 -yen-，加了 -lo 音节变多，就要标 leyéndolo。</li></ul>
  <p>间接和直接两个代词一起用时，间接在前：<span lang="es">Me lo da.</span>（他把它给我。）如果间接是 le 或 les，遇到 lo、la、los、las 要改写成 se：<span lang="es">Se lo doy a mi hermano.</span>（我把它给我兄弟。）这条本周只要认得，先不要求主动写。</p>
  <h4>指示词三级</h4><p>西语按距离分三级，各有性数形式，另外有一个不变的中性形式，用来指还没说出名字的东西或整件事。</p>
  <div class="table-wrap" tabindex="0" aria-label="可横向滚动的指示词表"><table><caption>指示词的性数与中性形式</caption><thead><tr><th>距离</th><th>阳性单数</th><th>阴性单数</th><th>阳性复数</th><th>阴性复数</th><th>中性</th></tr></thead><tbody>${ES06_DEMONSTRATIVES.map(row=>'<tr>'+row.map(cell=>'<td>'+esc(cell)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>
  <p lang="es">Este reloj es caro. / Esa bolsa es fea. / Aquellas montañas son altas. / Esto es un regalo.</p><p>这块表很贵。／那个包很丑。／那边那些山很高。／这是一份礼物。中性的 esto、eso、aquello 不带重音符号，也不跟名词配合，只单独用。另外 esta（这个，阴性）和 está（estar 的变位）只差一个符号，写的时候要分清。</p>
  <h4>现在进行时：estar + 副动词</h4><p>表示此刻正在进行。estar 按人称变位，副动词只有一个形式，不变。</p><ul>
  <li>-ar 动词：去掉 -ar 加 -ando。hablar → hablando，comprar → comprando。</li>
  <li>-er 和 -ir 动词：去掉词尾加 -iendo。comer → comiendo，escribir → escribiendo。</li>
  <li>词干以元音结尾时 -iendo 写成 -yendo：leer → leyendo，oír → oyendo（oír 在第 7 周学）。</li>
  <li>-ir 词干变化动词在副动词里也变：dormir → durmiendo（o→u），pedir → pidiendo（e→i），servir → sirviendo（e→i）。</li></ul>
  <p lang="es">Estoy leyendo el periódico. / Mi hermana está durmiendo. / Estamos buscando un cuaderno.</p><p>我正在读报纸。／我姐妹正在睡觉。／我们正在找一个本子。西语的现在时本身就能表示日常和当下，进行时只在强调“此刻正在”时用，不要每句都写。</p>
  <h4>连词与副词</h4><p>que（引导从句）、porque（因为）、pero（但是）、y（和）、o（或者）、mientras（当……的时候）、aunque（虽然）、además（而且）。también 用于肯定，tampoco 用于否定：<span lang="es">Yo también leo. / Yo tampoco leo.</span>（我也读。／我也不读。）动词前有 no 时，后面用 nada、nunca 是标准写法：<span lang="es">No compro nada.</span>（我什么也不买。）</p>
  <h4>本周写作提纲</h4><p>写 5 句描述眼前的东西和正在做的事：① 用 este / esta 说一样离你近的东西；② 用 ese 或 aquel 说一样离得远的；③ 用直接宾语代词改写一句（先写完整句，再改成代词句）；④ 用 estar + 副动词说你此刻在做什么；⑤ 说同屋或家人此刻在做什么。检查三处：代词的性数、代词的位置、副动词的拼写。</p></div>`;
}
function spanishPreteriteExplanation() {
  return `<div class="lesson-text"><p>配合《现代西班牙语》第 7 课，以及英文语法练习册的 preterite 章节（可挑其中的规则动词练习做 20–30 题）。本周只学简单过去时的规则动词。每天 25 分钟是 SRS 10 分钟加阅读 15 分钟，每周一次 30 分钟看语法点并写 5 句。</p>
  <h4>规则动词的简单过去时词尾</h4><p>-er 和 -ir 两类的过去时词尾完全相同，所以实际只有两套要记。</p>
  <div class="table-wrap" tabindex="0" aria-label="可横向滚动的简单过去时变位表"><table><caption>简单过去时：全部人称</caption><thead><tr><th>主语</th><th>词尾（-ar / -er、-ir）</th><th>hablar（说）</th><th>comer（吃）</th><th>vivir（住）</th></tr></thead><tbody>${ES07_PRETERITE.map(row=>'<tr>'+row.map(cell=>'<td>'+esc(cell)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>
  <h4>重音符号是词形的一部分</h4><p>yo 和第三人称单数的词尾重读，必须标符号：hablé、habló、comí、comió、viví、vivió。漏掉符号就变成别的词形：<span lang="es">hablo</span>（我说，现在时）和 <span lang="es">habló</span>（他说了，过去时）只差一个符号，意思完全不同。</p>
  <h4>nosotros 的两处同形</h4><p>-ar 和 -ir 动词的 nosotros 过去时和现在时写法一样：hablamos、vivimos 既可以是“我们说 / 我们住”，也可以是“我们说了 / 我们住过”。靠时间标记和上下文分辨：<span lang="es">Hoy hablamos español. / Ayer hablamos con el profesor.</span>（今天我们说西班牙语。／昨天我们和老师谈过。）-er 动词没有这个问题：现在时 comemos，过去时 comimos。</p>
  <h4>yo 形式的拼写调整</h4><p>三类 -ar 动词的 yo 形式要改字母，才能保持原来的读音。改的是写法，不是读音，也不是不规则变化。</p><ul>
  <li>-car → -qué：buscar → busqué，tocar → toqué，practicar → practiqué，explicar → expliqué。</li>
  <li>-gar → -gué：llegar → llegué，pagar → pagué，entregar → entregué，apagar → apagué。</li>
  <li>-zar → -cé：empezar → empecé，comenzar → comencé，cruzar → crucé，almorzar → almorcé。</li></ul>
  <p>只有 yo 一个人称要改，其余人称照常：buscaste、buscó、buscamos、buscasteis、buscaron。</p>
  <h4>leer、creer、oír 的第三人称</h4><p>词干以元音结尾时，第三人称的 -ió、-ieron 写成 -yó、-yeron：leer → leyó / leyeron，creer → creyó / creyeron，oír → oyó / oyeron。其余人称保留 í 的符号：leí、leíste、leímos、leísteis。</p>
  <h4>过去时间标记</h4><p>ayer（昨天）、anoche（昨晚）、anteayer（前天）、la semana pasada（上周）、el mes pasado（上个月）、el año pasado（去年）、el lunes pasado（上周一）、el fin de semana pasado（上个周末）、hace dos días（两天前）、hace un año（一年前）、aquel día（那一天）。hace + 时间段表示“……之前”，hace 在这里不随人称或数变化。</p>
  <h4>用法：与现在时对照</h4><p>简单过去时说的是已经完成、有明确起止或有明确时间的事，通常配一个过去时间标记。</p>
  <p lang="es">Estudio español cada día. / Ayer estudié dos horas.</p><p>我每天学西班牙语。（现在时，讲习惯）／昨天我学了两小时。（过去时，一次完成的事）</p>
  <p lang="es">Mi hermana escribe cartas. / La semana pasada escribió una carta.</p><p>我姐妹写信。（习惯）／上周她写了一封信。（一次完成的事）过去还有一个用来讲背景和习惯的时态，本周先不学，只把“做过一次、已经完成”写对。</p>
  <h4>本周写作提纲</h4><p>写 5 句昨天做了什么：① 几点起床、几点出门；② 上午做了什么；③ 中午吃了什么；④ 下午或晚上遇到的一件事；⑤ 几点回家、几点睡。每句都放一个时间标记。写完检查三处：yo 和第三人称的重音符号、-car / -gar / -zar 的 yo 形式、nosotros 句是否需要靠时间标记才说得清。</p></div>`;

  <p>hay 的过去时是 <span lang="es">hubo</span>，后面接单数或复数都不变：<span lang="es">Hubo una fiesta. / Hubo dos reuniones.</span>（有过一场聚会。／有过两场会议。）不要和 tener 的 tuvo 混用。</p>

  <li>e→i：pedir → pidió / pidieron；servir → sirvió / sirvieron；preferir → prefirió / prefirieron；sentir → sintió / sintieron；seguir → siguió / siguieron；repetir → repitió / repitieron。</li>

function spanishExplanation() {
  return `<div class="lesson-text">
  <p>本课只练阅读、辨认词形和键盘输入。词表不要求一天学完；先看规则，再按每日额度复习。</p>
  <h4>27 个字母</h4><p lang="es">a b c d e f g h i j k l m n ñ o p q r s t u v w x y z</p><p>比英语多一个 ñ；ch 和 ll 是两个字母的组合，不单列为字母。</p>
  <h4>重音符号是拼写的一部分</h4><ul>
  <li>通常，元音或单个 n、s 结尾的多音节词默认重读倒数第二音节；其他辅音（包括 y）结尾默认重读末音节。不符合默认位置的要标：está、también；fácil、lápiz。辅音群结尾有补充规则，遇到时另查。</li>
  <li>倒数第三音节及更前的重读一律标：teléfono、médico、rápido。-mente 副词保留原形容词的符号：rápido → rápidamente。</li>
  <li>重读的 í、ú 与相邻的 a、e、o 分属两个音节时，要标符号：día、país。día 的 í 不能按通常结尾规则省掉。</li>
  <li>单音节词通常不标，区分意义时例外：sí（是）/ si（如果）、él（他）/ el（冠词）、tú（你）/ tu（你的）、mí（我，介词后）/ mi（我的）、más（更）/ mas（但是）、sé（我知道）/ se（代词）、dé（dar 的变位）/ de（介词）、té（茶）/ te（代词）。</li>
  <li>疑问和感叹用法带符号：qué、quién、dónde、cuándo、cómo、cuánto、cuál。间接疑问也保留；作关系词等其他用法时不一定带符号。</li></ul>
  <h4>容易混写的字母组</h4><p>b / v 一般不靠读音区分；h 通常不发音；ll / y 在多数地区同音；g 在 e / i 前与 j 对应同一类读音。c（e / i 前）、s、z 在拉美及西班牙部分地区可能同音，在西班牙多数地区仍有区别。当前按词形记忆这些组，不做发音练习。也留意 qu / c / k。</p>
  <h4>标点和大小写</h4><p lang="es">¿Cómo estás? ¡Hola!</p><p>问句和感叹句开头写 ¿、¡，结尾写 ?、!。句首和专名大写；星期、月份、语言名、国籍形容词通常小写：lunes、enero、español。大写字母也保留符号，如 ÉL。</p>
  <h4>键盘输入</h4><p>macOS 的 ABC / U.S. 布局：Option + E，再按元音，输入 á é í ó ú；Option + N，再按 N，输入 ñ；Option + Shift + / 输入 ¿；Option + 1 输入 ¡。也可添加西班牙语键盘。iPhone 添加西班牙语键盘，长按元音或 n 选择带符号形式；倒置标点可从符号键盘长按对应标点选择。</p>
  <h4>读词表前</h4><p>名词连同冠词记，拼写题也要输入冠词。形容词词条采用阳性单数或阴阳同形形式；例句里的阴性、复数随名词变化。例句中的 quiero / quieres 来自 querer，tienes 来自 tener，estudiantes、libros、personas 是词表名词的复数。</p>
  <p>ser 常用于身份和特征，estar 常用于状态和一般位置；这只是起点，不用“永久 / 暂时”概括全部用法。西班牙的 vosotros / vosotras 用第二人称复数；usted 和 ustedes 分别用第三人称单、复数。</p>
  <div class="table-wrap"><table><caption>ser / estar 现在时（全部人称）</caption><thead><tr><th>主语</th><th>ser</th><th>estar</th></tr></thead><tbody>
  <tr><td>yo</td><td>soy</td><td>estoy</td></tr><tr><td>tú</td><td>eres</td><td>estás</td></tr><tr><td>él / ella / usted</td><td>es</td><td>está</td></tr><tr><td>nosotros / nosotras</td><td>somos</td><td>estamos</td></tr><tr><td>vosotros / vosotras</td><td>sois</td><td>estáis</td></tr><tr><td>ellos / ellas / ustedes</td><td>son</td><td>están</td></tr></tbody></table></div></div>`;
}
function russianExplanation() {
  const letters = rows.filter(row => row.lesson === 'ru-01' && isLetter(row));
  return `<div class="lesson-text"><p>先辨认 33 个字母，再看国际词的拼写。拉丁转写只帮助建立大致对应，不做发音练习，也不播放音频。</p>
  <ul><li><strong>形音都同：</strong>А К М О Т。这里指与拉丁字母的大致形音对应，不表示所有语境下发音完全一样。</li><li><strong>形同音不同：</strong>В Е Н Р С У Х。尤其留意 В → v、Н → n、Р → r、С → s。</li><li><strong>新形：</strong>其余 21 个，包括 Ё、Ь、Ъ。</li></ul>
  <p>转写约定：ye / yo / yu / ya 用于辨认 е / ё / ю / я；kh 也写作 x。Й 的 y 表示短促滑音，Ы 的 y 只是转写约定，两者不同。这里只列近似提示，实际读音随位置而变。</p>
  <div class="table-wrap" tabindex="0" aria-label="可横向滚动的俄语字母表"><table class="alphabet"><caption>33 个字母（字母顺序）</caption><thead><tr><th>大写</th><th>小写</th><th>斜体</th><th>大致读音／转写</th><th>分组</th></tr></thead><tbody>${letters.map(row => {
    const [upper,lower] = row.front.split(/\s+/); const [sound,group] = row.back.split('；');
    return `<tr><td class="letter" lang="ru">${esc(upper)}</td><td class="letter" lang="ru">${esc(lower || upper)}</td><td class="italic" lang="ru">${esc(lower || upper)}</td><td>${esc(sound)}</td><td>${esc(group || '新形')}</td></tr>`;
  }).join('')}</tbody></table></div>
  <h4>印刷体和斜体</h4><p>留意同一字母的斜体：<span lang="ru">т → <i class="italic">т</i>、д → <i class="italic">д</i>、г → <i class="italic">г</i>、и → <i class="italic">и</i>、п → <i class="italic">п</i>、в → <i class="italic">в</i></span>。т 常像拉丁 m，д 常像 g，и 常像 u，п 常像 n；г、в 也可能有较大变化。这里用系统衬线字体的斜体，实际字形依字体而异，不能代表所有手写体。</p>
  <h4>ь、ъ 与重音标记</h4><p>ь（软音符号）和 ъ（硬音符号）本身不发音，但不能漏写。ь 可以提示软化、分隔或语法信息；ъ 常见于前缀与 е、ё、ю、я 之间，起分隔作用。ё 的两点、й 顶部的短音符都是词形的一部分。</p>
  <p>词卡在重读元音后加组合重音符，如 телефо́н、му́зыка。普通俄语文本通常省略这个标记；本页拼写比较忽略 U+0301，但仍区分 е / ё、и / й。单音节国际词也统一标重音。字母示例里的 ё 本身提示重读。</p>
  <h4>键盘输入</h4><p>macOS 添加“俄语”（ЙЦУКЕН）或“俄语－语音”布局；iPhone 在键盘设置中添加俄语。先熟悉 33 个字母的位置。键盘输出的字符不会因为题目使用斜体而改变。</p>
  <h4>国际词</h4><p>本课准备了 18 个国际词，按词表标注记性别。例句统一用 Э́то…（这是……），不要求先学变格。前几周可先做下方页内练习；若暂不引入俄语 SRS 新卡，可在设置把 ru 每日新卡数设为 0，到期卡仍会出现。</p></div>`;
}

function russianTypingExplanation() {
  return `<div class="lesson-text"><p>每天 10 分钟：看一行键位约 2 分钟，打 20 个词约 6 分钟，再做 1–2 题。三天过完三行，之后重复；不要求一天做完 10 题。</p>
  <h4>ЙЦУКЕН：按美式实体键找俄语字母</h4><p>表中“俄语 ← 美式键”表示切换输入源后按哪个键；不按 Shift 时输出小写，按 Shift 得大写。三行表列 32 个字母，ё 单列在表后。</p>
  <div class="table-wrap" tabindex="0" aria-label="ЙЦУКЕН 三行键位"><table><thead><tr><th>行</th><th>俄语字母 ← 美式键</th></tr></thead><tbody>
  <tr><th>上排</th><td lang="ru">й ← Q · ц ← W · у ← E · к ← R · е ← T · н ← Y · г ← U · ш ← I · щ ← O · з ← P · х ← [ · ъ ← ]</td></tr>
  <tr><th>中排</th><td lang="ru">ф ← A · ы ← S · в ← D · а ← F · п ← G · р ← H · о ← J · л ← K · д ← L · ж ← ; · э ← '</td></tr>
  <tr><th>下排</th><td lang="ru">я ← Z · ч ← X · с ← C · м ← V · и ← B · т ← N · ь ← M · б ← , · ю ← .</td></tr>
  </tbody></table></div><p><strong>四个位置单独记：</strong>й 在 Q，ь 在 M，ъ 在右方括号 ]；macOS“俄语”的 ё 在美式反斜杠键 &#92;，常见 PC ЙЦУКЕН／macOS“俄语－PC”的 ё 在数字 1 左侧的反引号键。不要把这两种布局的 ё 键位混用。</p>
  <h4>macOS“俄语－语音”：按拉丁字母位置对应</h4><p>这是另一套布局：例如 R → р、F → ф；它不把输入的整段拉丁字母自动转成俄语。只选一套练习，避免每天换。</p>
  <div class="table-wrap" tabindex="0" aria-label="俄语语音布局三行键位"><table><thead><tr><th>美式行</th><th>美式键 → 俄语</th></tr></thead><tbody>
  <tr><th>上排</th><td lang="ru">Q → я · W → ш · E → е · R → р · T → т · Y → ы · U → у · I → и · O → о · P → п · [ → ю · ] → ж · &#92; → э</td></tr>
  <tr><th>中排</th><td lang="ru">A → а · S → с · D → д · F → ф · G → г · H → ч · J → й · K → к · L → л</td></tr>
  <tr><th>下排</th><td lang="ru">Z → з · X → х · C → ц · V → в · B → б · N → н · M → м</td></tr>
  </tbody></table></div><p>其余：反引号键 → щ，减号 - → ь，等号 = → ъ；<strong>Option + E → ё</strong>（Option + Shift + E → Ё），й 在 J。这里是 macOS 自带“俄语－语音”的美式键位；其他系统的 phonetic 布局可能不同，按实际输入源的键盘查看器确认。</p>
  <h4>字母表顺序：查词典用</h4><p lang="ru" class="ru-text">А Б В Г Д Е Ё Ж З И Й К Л М Н О П Р С Т У Ф Х Ц Ч Ш Щ Ъ Ы Ь Э Ю Я</p><p>33 个：Е 后是 Ё，И 后是 Й；末段是 Щ → Ъ → Ы → Ь → Э → Ю → Я。键盘顺序不是字母表顺序。词典按字母排序比较词；有些词典把 ё 合在 е 的位置检索。</p>
  <h4>两张词卡容易看错</h4><p lang="ru">журна́л = 杂志；магази́н = 商店。</p><p>英语 magazine 的“杂志”应写 журна́л；магази́н 是假朋友。词卡以 U+0301 标重音，日常打字与页内练习可省略它；ё、й 和 ь、ъ 仍要写全。</p></div>`;
}
function russianSpellingExplanation() {
  return `<div class="lesson-text"><p>每天 10 分钟：复习一条规则约 2 分钟，读、抄 1–2 句约 5 分钟，再做 1–2 题。全周完成规则、10 题和 5 句抄写。</p>
  <h4>三条拼写规则</h4><ul>
  <li><strong>七字母：</strong>г к х ж ч ш щ 后写 и，不写 ы：кни́га → кни́ги（书，复数）。先记“г 后用 и”。</li>
  <li><strong>八字母：</strong>г к х ж ч ш щ ц 后通常写 у / а，不写 ю / я：пишу́（我写），不能写 пишю；слы́шат（他们听见）用 а。这是常见词和词尾的规则，外来词、专名可能有例外。</li>
  <li><strong>五字母：</strong>ж ч ш щ ц 后的词尾，非重读时写 е，不写 о：хоро́шее（好的，中性），ш 后的 е 不重读；但 большо́е（大的，中性）这里重读，写 о。<strong>这条依赖重音</strong>，不能把所有词根中的 о 一律改成 е。</li></ul>
  <h4>ь 的三种用法</h4><ul><li>标记前面辅音的软化：мать（母亲）。</li><li>分隔：семья́（家庭），ь 不能漏。</li><li>语法标记：ж ш ч щ 结尾的阴性名词带 ь，如 ночь（夜晚）；阳性不带，如 нож（刀）。第二人称单数常见词尾 -ешь / -ишь 也保留 ь，如 пи́шешь（你写）。</li></ul>
  <h4>ъ、ё 与字形</h4><p>ъ 常见于辅音结尾的前缀与 е ё ю я 之间，作分隔：подъе́зд（楼门入口）；外来词 объе́кт（对象）中也保留。ё 常在印刷品中写作 е：ещё → еще（还；再）；看到 е 要留意原词是否含 ё。本课卡片保留标准词形，别把 ё、й 上的符号当作可省略的重音。</p>
  <h4>大小写与标点</h4><p>句首和专名大写；语言、国籍形容词、月份、星期通常小写：ру́сский、янва́рь、понеде́льник。书信中对单个人敬称可写 Вы。俄语引号用 «…»；主句和从句的边界通常加逗号，如 Я зна́ю, что э́то дом.（我知道这是一所房子。）即使英语对应位置不写逗号，俄语也要检查。</p>
  <p>规则例词用于观察拼写，不要求本周全部背诵。下方六句短文只用 ru-01、ru-02 和本课词；现在时的“是”常不写，Э́то дом. 就是“这是房子”。抄写时可保留教材重音，自己打字可不标 U+0301。</p></div>`;
}
function russianIntroductionExplanation() {
  return `<div class="lesson-text"><p>每天 10 分钟：先默写几词约 3 分钟，再读一个句型并替换自己的信息约 5 分钟，最后做 1–2 题。10 题分几天做完。</p>
  <h4>先复习</h4><p>不看提示默写或打出 33 个字母，再对照 ru-01；从 ru-01 至 ru-03 的非字母词随机选 20 个，看中文默写，答对至少 16 个（80%）。重音 U+0301 可省略，ё、й、ь、ъ 和字母本身不能省。复述 кни́ги、пишу́、хоро́шее 的规则。</p>
  <h4>自我介绍：先按整句记</h4><div class="table-wrap"><table><thead><tr><th>句型</th><th>中文与替换提示</th></tr></thead><tbody>
  <tr><td lang="ru">Меня́ зову́т …</td><td>我叫……；把省略号换成姓名。</td></tr>
  <tr><td lang="ru">Я из Кита́я.</td><td>我来自中国。Кита́я 来自 Кита́й，这里的格以后学。</td></tr>
  <tr><td lang="ru">Я студе́нт. / Я рабо́таю.</td><td>我是学生（男性）／我工作。女学生写 Я студе́нтка；选择符合自己情况的一句。</td></tr>
  <tr><td lang="ru">Я живу́ в Пеки́не.</td><td>我住在北京。в + 前置格第 7 周学，这里整句记；Пеки́не 来自 Пеки́н。</td></tr>
  <tr><td lang="ru">Я говорю́ по-кита́йски и по-англи́йски.</td><td>我会说中文和英语。两个 по- 后都有连字符；这里只写句子，不做口语练习。</td></tr>
  <tr><td lang="ru">Я изуча́ю ру́сский язы́к.</td><td>我学习俄语。ру́сский 小写，写两个 с。</td></tr>
  </tbody></table></div><p>这些句型加 phrase 标签，只生成识别卡。写作时从中选 5 句，换成真实信息；动词变位和格的完整表留到相应周次。</p>
  <h4>数字 1–10</h4><p lang="ru">1 оди́н · 2 два · 3 три · 4 четы́ре · 5 пять · 6 шесть · 7 семь · 8 во́семь · 9 де́вять · 10 де́сять</p><p>保留 5–10 词尾的 ь。先记独立数字，数词与名词的搭配以后学。词表中的形容词用阳性单数；不定式的 note 标第一／第二变位，жить 虽以 -ить 结尾仍是第一变位。</p>
  <details><summary>10-11 月度检查点 1：周末自测</summary><p>按 framework/metrics-and-review.md，替代当周周志；限时写作单独用 15 分钟，不挤进平日的 10 分钟。</p><ol>
  <li>读一段没读过的当前级别教材或双语文本（约 100 词），不查词典，用中文记要点，再对照译文，读懂比例评 1–5。</li>
  <li>15 分钟内不查词典写本月一件事，俄语探索期目标 50 词；之后自行修改并把错误记入 russian/errors.md。</li>
  <li>记录 SRS 总卡数、已掌握数和正确率，并注明统计日期范围；记录 time.csv 的本月及累计小时。</li>
  <li>兴趣评 1–5，写下下个月是否想继续。字母默写与本周 5 句自我介绍也一起留作对照。</li></ol></details></div>`;
}

function russianNounGenderExplanation() {
  return `<div class="lesson-text"><p>配合《东方大学俄语（新版）》第 1 课。本周从“看词尾”开始，但词尾只是高概率线索；看到 -ь 或人的称呼时，仍要以词典和词卡里的性别为准。每天 30 分钟分成 SRS 10 分钟和课文阅读 20 分钟，周末另做一次 60 分钟系统块。</p>
  <h4>三性判断表</h4><div class="table-wrap"><table><caption>名词主格单数：先看词尾，再查例外</caption><thead><tr><th>线索</th><th>通常的性</th><th>本课例子</th></tr></thead><tbody>
  <tr><td>辅音结尾</td><td>阳性</td><td lang="ru">слова́рь、день、рубль</td></tr>
  <tr><td>-а / -я 结尾</td><td>阴性</td><td lang="ru">ла́мпа、карти́на、сестра́</td></tr>
  <tr><td>-о / -е 结尾</td><td>中性</td><td lang="ru">кре́сло、зда́ние、окно́</td></tr>
  <tr><td>-ь 结尾</td><td>要查词典</td><td lang="ru">阳性：слова́рь、день、рубль；阴性：ночь、две́рь、мать、тетра́дь</td></tr>
  <tr><td>-мя 结尾</td><td>中性</td><td lang="ru">вре́мя、и́мя</td></tr>
  </tbody></table></div><p>以人为所指时还有词义例外：<span lang="ru">па́па</span> 以 -а 结尾却是阳性。复习物主代词或形容词时，性别必须跟名词一致；本周先会判断和主格形式，其他格留到后面。</p>
  <h4>复数主格</h4><ul>
  <li>多数阳性和阴性词按词尾加 <span lang="ru">-ы / -и</span>：<span lang="ru">шка́ф → шка́фы</span>、<span lang="ru">ла́мпа → ла́мпы</span>。г、к、х、ж、ч、ш、щ 后按七字母规则写 <span lang="ru">-и</span>：<span lang="ru">ру́чка → ру́чки</span>、<span lang="ru">врач → врачи́</span>。</li>
  <li>中性 <span lang="ru">-о / -е</span> 常用 <span lang="ru">-а / -я</span>：<span lang="ru">сло́во → слова́</span>、<span lang="ru">зда́ние → зда́ния</span>。</li>
  <li><span lang="ru">-ь</span> 结尾常变成 <span lang="ru">-и</span>：<span lang="ru">тетра́дь → тетра́ди</span>、<span lang="ru">слова́рь → слова́ри</span>。</li>
  <li>本周只先记五个不规则复数：<span lang="ru">друг → друзья́</span>、<span lang="ru">брат → бра́тья</span>、<span lang="ru">дом → дома́</span>、<span lang="ru">го́род → города́</span>、<span lang="ru">сту́л → сту́лья</span>。重音也要跟着词形记。</li></ul>
  <h4>Э́то、Кто э́то?、Что э́то?</h4><p><span lang="ru">Э́то + 主格名词</span> 是“这是……”。<span lang="ru">Кто э́то?</span> 问人或动物，回答也用 <span lang="ru">Э́то + 主格</span>；<span lang="ru">Что э́то?</span> 问物。否定只在 <span lang="ru">Э́то</span> 后加 <span lang="ru">не</span>：<span lang="ru">Э́то не шка́ф.</span> 本周不把 <span lang="ru">э́то</span> 当作要变格的普通形容词来背。</p>
  <h4>连接词与小词</h4><p><span lang="ru">и</span> 表并列，<span lang="ru">а</span> 引出对照，<span lang="ru">но</span> 表转折：<span lang="ru">Э́то по́лка, а э́то шка́ф.</span>；<span lang="ru">Э́то ма́ленький? Но…</span> 的完整形容词搭配留到以后。<span lang="ru">то́же</span> 是“也”，通常放在要强调的成分前后按例句记；<span lang="ru">ещё</span> 是“还、再”，<span lang="ru">о́чень</span> 是“非常”，<span lang="ru">вот</span> 可引出“这就是……”。</p>
  <p>阅读短文只有 10 句，先遮住中文逐句读，再打开中文核对。写作时写 5 句“这是什么／这是谁”，至少放入一个否定句和一个 <span lang="ru">и / а</span> 对照句；主格复数可另抄 5 组。</p></div>`;
}

function russianFirstConjugationExplanation() {

  <h4>“有”：у + 人称代词 + есть</h4><div class="table-wrap"><table><caption>固定形式</caption><thead><tr><th>中文</th><th lang="ru">形式</th><th>例句</th></tr></thead><tbody>

  <tr><td>他／她／它有</td><td lang="ru">у него́ / у неё</td><td lang="ru">У него́ есть текст.</td></tr>

  <h4>物主代词的主格一致</h4><div class="table-wrap"><table><caption>先看名词的性和数</caption><thead><tr><th>人称</th><th>阳性</th><th>阴性</th><th>中性</th><th>复数</th></tr></thead><tbody>

  <p>阅读短文先找 <span lang="ru">у меня́ есть</span>，再圈出第一变位动词的词尾。写作 5 句时至少写两句“我有”和三句现在时动作。</p></div>`;
}

function russianPrepositionalExplanation() {
  return `<div class="lesson-text"><p>配合《东方大学俄语（新版）》第 3 课。本周先把前置格当作两个问题来记：<span lang="ru">Где?</span>（在哪里？）和 <span lang="ru">О ком? / О чём?</span>（关于谁／什么？）。每天 30 分钟是 SRS 10 分钟加课文阅读 20 分钟，周末用 60 分钟系统块集中做介词搭配和变位。</p>
  <h4>前置格单数词尾</h4><div class="table-wrap"><table><caption>最常见的地点和话题形式</caption><thead><tr><th>主格结尾</th><th>前置格结尾</th><th>例子</th></tr></thead><tbody>
  <tr><td>阳性辅音；中性 -о</td><td>-е</td><td lang="ru">Пеки́н → в Пеки́не；о́фис → в о́фисе</td></tr>
  <tr><td>阴性 -а / -я</td><td>-е</td><td lang="ru">кварти́ра → в кварти́ре；страна́ → в стране́</td></tr>
  <tr><td>阴性 -ь</td><td>-и</td><td lang="ru">пло́щадь → на пло́щади</td></tr>
  <tr><td>-ий / -ия / -ие</td><td>-ии</td><td lang="ru">Росси́я → в Росси́и；общежи́тие → в общежи́тии</td></tr>
  </tbody></table></div><p>四个常见的 <span lang="ru">-у</span> 型先整体认读：<span lang="ru">в лесу́、в саду́、на полу́、в шкафу́</span>。它们不是本周要自由套用的第五条规则。</p>
  <h4>в 和 на</h4><ul><li><span lang="ru">в</span> 常表示在内部，也用于国家、城市和大多数建筑内部：<span lang="ru">в кварти́ре、в Кита́е、в Пеки́не、в библиоте́ке</span>。</li><li><span lang="ru">на</span> 常表示在表面、开放地点、活动或固定搭配：<span lang="ru">на у́лице、на рабо́те、на уро́ке、на по́чте、на стадио́не、на вокза́ле、на заво́де</span>。搭配先整体记，不用中文“在”机械选择。</li></ul>

  <tr><td>вы</td><td>-ите</td><td lang="ru">говори́те</td><td lang="ru">смо́трите</td></tr>

let lastSaved = document.querySelector('meta[name="srs-saved-at"]').content;
let saveKind = document.querySelector('meta[name="srs-save-kind"]').content;
let storageWarning = '', notice = '', saving = false, handleReady = false, fileHandle = null;

function persistCache() {
  try {
    localStorage.setItem(CACHE_KEY,JSON.stringify({state,cards:rows}));

  } catch (_) {
    storageWarning = '本地缓存不可用，请及时保存文件或导出进度。';

function touch() {
  state.updatedAt = new Date(Math.max(Date.now(),Date.parse(state.updatedAt)+1)).toISOString();
  state.log = pruneLog(state.log);

function safeJSON(value) {
  return JSON.stringify(value,null,2).replace(/<\//g,'<\\/').replace(/<!--/g,'\\u003c!--');
}
function serializeDocument(doc, cardSnapshot, stateSnapshot, savedAt, kind) {
  const copy = doc.cloneNode(true);
  const head = copy.head, body = copy.body;
  head.replaceChildren(...['meta[charset]','meta[name="viewport"]','meta[name="srs-saved-at"]','meta[name="srs-save-kind"]','title','style#srs-style'].map(selector => head.querySelector(selector)));
  body.replaceChildren(...['app','cards-data','state-data','srs-app'].map(id => copy.getElementById(id)));
  copy.documentElement.replaceChildren(head,body);
  for (const node of [copy.documentElement,body]) {
    for (const attribute of [...node.attributes]) node.removeAttribute(attribute.name);
  }
  copy.documentElement.setAttribute('lang','zh-CN');
  copy.getElementById('app').replaceChildren();
  copy.getElementById('cards-data').textContent = safeJSON(cardSnapshot);
  copy.getElementById('state-data').textContent = safeJSON(stateSnapshot);
  copy.querySelector('meta[name="srs-saved-at"]').content = savedAt;
  copy.querySelector('meta[name="srs-save-kind"]').content = kind;
  return '<!DOCTYPE html>\n'+copy.documentElement.outerHTML;
}
function snapshotDocument(doc) {
  const cards = JSON.parse(doc.getElementById('cards-data').textContent);
  const progress = JSON.parse(doc.getElementById('state-data').textContent);
  if (!Array.isArray(cards) || !validISO(progress.updatedAt)) throw new Error('文件中的卡片或进度快照无效。');
  return JSON.stringify({cardCount:cards.length,updatedAt:progress.updatedAt});
}
async function checkFileBeforeSave(picked) {
  const text = await (await fileHandle.getFile()).text();
  // 新建的空文件还没有 SRS 快照；已有文件（含无法解析的文件）须检查。
  if (picked && text === '') { overwritePending = null; return true; }
  let diskSnapshot = null;
  try { diskSnapshot = snapshotDocument(new DOMParser().parseFromString(text,'text/html')); } catch (_) {}
  if (diskSnapshot !== fileSnapshot && !(overwritePending?.handle === fileHandle && overwritePending.snapshot === diskSnapshot)) {
    overwritePending = {handle:fileHandle,snapshot:diskSnapshot};
    showNotice('文件在本页打开后被外部修改（可能是新课程或另一台设备的进度）。请先重新打开页面；仍要覆盖请再点一次保存');
    return false;
  }
  overwritePending = null;
  return true;
}
function handleStore(mode, value) {
  return new Promise((resolve,reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB 不可用')); return; }
    const request = indexedDB.open('language-srs-files-v1',1);
    request.onupgradeneeded = () => request.result.createObjectStore('handles');
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('文件句柄数据库被占用'));
    request.onsuccess = () => {
      const db = request.result;
      try {
        const tx = db.transaction('handles',mode === 'get' ? 'readonly' : 'readwrite');
        const operation = mode === 'get' ? tx.objectStore('handles').get(CACHE_KEY) : tx.objectStore('handles').put(value,CACHE_KEY);
        let result = null;
        operation.onsuccess = () => { result = operation.result; };
        tx.oncomplete = () => { db.close(); resolve(result); };
        tx.onerror = tx.onabort = () => { db.close(); reject(tx.error || new Error('句柄未能保存')); };
      } catch (error) { db.close(); reject(error); }
    };
  });
}
async function loadHandle() {
  if ('showSaveFilePicker' in window) {
    try { fileHandle = await Promise.race([handleStore('get'),new Promise(resolve => setTimeout(() => resolve(null),2000))]); } catch (_) { fileHandle = null; }
  }
  handleReady = true; renderHeader();
}
function download(content,type,name) {
  const url = URL.createObjectURL(new Blob([content],{type}));
  const link = document.createElement('a');
  link.href = url; link.download = name; link.hidden = true;
  document.getElementById('app').append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url),60000);
}

  lastSaved = savedAt; saveKind = kind;

  persistCache(); renderHeader();
}
async function saveFile({asNew=false,forceDownload=false} = {}) {

    const html = serializeDocument(document,cardSnapshot,stateSnapshot,savedAt,kind);
    if (usePicker) {
      writable = await fileHandle.createWritable();
      await writable.write(html); await writable.close(); writable = null;
      fileSnapshot = JSON.stringify({cardCount:cardSnapshot.length,updatedAt:stateSnapshot.updatedAt});
      adoptSaved(cardSnapshot,stateSnapshot,savedAt,kind,savedRevision);
      let handleWarning = '';
      if (handleNeedsStore) {
        try { await handleStore('put',fileHandle); handleNeedsStore = false; } catch (_) { handleWarning = ' 浏览器未能记住文件位置，下次打开可能需要重选。'; }
      }
      showNotice('已保存到文件。'+(dirty ? ' 保存期间有新进度，请再保存一次。' : '')+handleWarning);
    } else {
      download(html,'text/html;charset=utf-8','index.html');
      adoptSaved(cardSnapshot,stateSnapshot,savedAt,kind,savedRevision);
      showNotice('已生成 index.html 下载。请确认浏览器已完成下载并保留该文件；原文件不会自动覆盖。');
    }
  } catch (error) {
    if (writable) { try { await writable.abort(); } catch (_) {} }
    showNotice(error.name === 'AbortError' ? '已取消保存，进度仍保留在当前页面和可用的本地缓存中。' : '保存失败：'+error.message);
  } finally { saving = false; renderHeader(); }
}

// 评分、导入与交互。
function focusReview() {
  const target = document.getElementById(!revealed && currentCard()?.direction === 'p' ? 'spelling' : 'review-card');
  target?.focus({preventScroll:true});
}
function checkDay() {
  if (session && session.day !== localDay()) {
    resetSession(); render(); showNotice('本地日期已变化，今日队列已更新。'); return false;
  }
  return true;
}
function reveal(unknown=false) {
  if (!checkDay() || revealed || !currentCard()) return;
  const card = currentCard();
  if (card.direction === 'p') {
    typedAnswer = document.getElementById('spelling')?.value || '';
    feedback = unknown ? {grade:0,kind:'wrong',message:'尚未记住'} : spellingResult(typedAnswer,card.row.front,card.row.lang);
  }
  revealed = true; render(); focusReview();
}
function gradeCard(grade) {
  if (!checkDay() || !revealed || !currentCard()) return;
  const card = currentCard(), day = localDay();
  state.cards[card.id] = schedule(state.cards[card.id],grade,day);
  state.log.push({t:new Date().toISOString(),card:card.id,grade});
  if (session.queue.length) session.queue.shift(); else session.again.shift();
  if (grade === 0) session.again.push(card);
  session.done++; revealed = false; typedAnswer = ''; feedback = null;
  touch(); render(); focusReview();
}
function importCSV(text) {
  const incoming = parseCSV(text), nextRows = mergeRows(rows,incoming);
  const added = incoming.filter(row => !rows.some(old => old.id === row.id)).length;
  rows = nextRows; resetSession(); touch();
  showNotice(`已导入 ${incoming.length} 条：新增 ${added} 条，更新 ${incoming.length-added} 条。复习状态保留，请保存文件。`);
}
function importProgress(text) {
  const incoming = validateState(JSON.parse(text));
  state = mergeProgress(state,incoming); resetSession(); touch();
  showNotice(`已按卡合并 ${Object.keys(incoming.cards).length} 条进度，并合并最近 60 天日志。请保存文件。`);
}
async function copyProgress() {
  state.log = pruneLog(state.log);
  const text = JSON.stringify(state,null,2);
  try {
    if (!navigator.clipboard?.writeText) throw new Error('clipboard unavailable');
    await navigator.clipboard.writeText(text); showNotice('进度 JSON 已复制。');
  } catch (_) {
    const area = document.getElementById('progress-text');
    if (area) { area.value = text; area.focus(); area.select(); }
    showNotice(area ? '浏览器未允许自动复制。JSON 已放入文本框并选中，可手动复制，或点下载进度 JSON。' : '浏览器未允许自动复制，请返回设置下载进度 JSON。');
  }
}
async function readTextFile(file) {
  if (!file) return null;
  if (file.size > 20*1024*1024) throw new Error('文件超过 20 MB，请检查是否选对文件。');
  if (file.text) return file.text();
  return new Promise((resolve,reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('文件读取失败。')); reader.readAsText(file,'UTF-8'); });
}
function handleError(error) { showNotice('未完成：'+(error.message || String(error))); }
function bindEvents() {
  document.getElementById('app').addEventListener('click',event => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    try {
      if (button.dataset.tab) { tab = button.dataset.tab; render(); return; }
      if (button.dataset.lesson) { lesson = button.dataset.lesson; render(); return; }
      if (button.dataset.grade !== undefined) { gradeCard(Number(button.dataset.grade)); return; }
      const action = button.dataset.action;
      if (action === 'save') void saveFile();
      else if (action === 'save-as') void saveFile({asNew:true});
      else if (action === 'download-html') void saveFile({forceDownload:true});
      else if (action === 'reveal') reveal();
      else if (action === 'unknown') reveal(true);
      else if (action === 'import-csv') importCSV(document.getElementById('csv-text').value);
      else if (action === 'import-progress') importProgress(document.getElementById('progress-text').value);
      else if (action === 'copy-progress') void copyProgress();
      else if (action === 'export-progress') { state.log = pruneLog(state.log); download(JSON.stringify(state,null,2),'application/json;charset=utf-8','srs-progress-'+localDay()+'.json'); showNotice('已生成进度 JSON 下载，请确认下载完成。'); }
    } catch (error) { handleError(error); }
  });
  document.getElementById('app').addEventListener('input',event => {
    if (event.target.id === 'spelling') typedAnswer = event.target.value;
    const form = event.target.closest('[data-exercise]');
    if (form) {
      exerciseWork.set(lesson+':'+form.dataset.exercise,{answer:event.target.value});
      form.querySelector('.exercise-result').replaceChildren();
    }
  });
  document.getElementById('app').addEventListener('change',async event => {
    try {
      if (event.target.id === 'language') { language = event.target.value; resetSession(); render(); return; }
      if (['csv-file','progress-file'].includes(event.target.id)) {
        const isCSV = event.target.id === 'csv-file', text = await readTextFile(event.target.files[0]);
        if (text !== null) { if (isCSV) importCSV(text); else importProgress(text); }
        event.target.value = '';
      }
    } catch (error) { event.target.value = ''; handleError(error); }
  });
  document.getElementById('app').addEventListener('submit',event => {
    event.preventDefault();
    try {
      const form = event.target;
      if (form.id === 'limits') {
        const es = Number(form.elements.es.value), ru = Number(form.elements.ru.value);
        if ([es,ru].some(n => !Number.isInteger(n) || n<0 || n>999)) throw new Error('每日新卡数须为 0–999 的整数。');
        state.settings.newPerDay = {es,ru}; resetSession(); touch(); showNotice('每日新卡数已应用，请保存文件。');
      } else if (form.dataset.exercise !== undefined) {
        const i = Number(form.dataset.exercise), exercise = LESSONS[lesson].exercises[i], answer = form.elements.answer.value;
        const result = spellingResult(answer,exercise.answer,LESSONS[lesson].lang);
        exerciseWork.set(lesson+':'+i,{answer,result}); form.querySelector('.exercise-result').innerHTML = exerciseFeedback(result,exercise.answer,Boolean(exercise.options));
      }
    } catch (error) { handleError(error); }
  });
  document.addEventListener('keydown',event => {
    if (tab !== 'review' || event.repeat || event.isComposing || event.keyCode === 229 || event.altKey || event.ctrlKey || event.metaKey) return;
    const editing = event.target.closest('input,textarea,select,[contenteditable="true"]');
    if (event.key === 'Enter' && event.target.id === 'spelling') { event.preventDefault(); reveal(); return; }
    if (editing) return;
    if (/^[1-4]$/.test(event.key) && revealed) { event.preventDefault(); gradeCard(GRADES[Number(event.key)-1]); }
    else if ((event.code === 'Space' || event.key === ' ') && !event.target.closest('button,summary,a')) { event.preventDefault(); reveal(); }
  });
  window.addEventListener('beforeunload',event => { if (dirty) { event.preventDefault(); event.returnValue = ''; } });
  document.addEventListener('visibilitychange',() => { if (!document.hidden && tab === 'review') checkDay(); });
  window.addEventListener('storage',event => {
    if (event.key === CACHE_KEY && event.newValue) showNotice('同一页面路径的其他标签页更新了缓存。为避免覆盖，请只在一个标签页复习；可先导出本页进度，再重新打开并合并。');
  });
}

// 启动。
function initialize() {
  fileSnapshot = snapshotDocument(document);
  rows = validateRows(JSON.parse(document.getElementById('cards-data').textContent));
  state = validateState(JSON.parse(document.getElementById('state-data').textContent));
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (raw) {
      const cache = JSON.parse(raw), cachedState = validateState(cache.state || cache);
      const cachedRows = cache.cards && Array.isArray(cache.cards) ? validateRows(cache.cards) : [];
      const fileIds = new Set(rows.map(row => row.id));
      const added = cachedRows.filter(row => !fileIds.has(row.id));
      const nextRows = validateRows([...rows,...added]);
      const newer = Date.parse(cachedState.updatedAt) > Date.parse(state.updatedAt);
      rows = nextRows;
      if (newer) { state = cachedState; source = '本地缓存'; }
      if (newer || added.length) dirty = true;
    }
  } catch (_) { storageWarning = '本地缓存无法读取，已使用文件中的数据；请及时保存。'; }
  render(); bindEvents(); void loadHandle();
}
try { initialize(); } catch (error) {
  document.getElementById('app').innerHTML = `<div class="loading"><h1>页面数据无法加载</h1><p>${esc(error.message)}</p><p>请使用完好的 HTML 文件重新打开，保留当前文件供检查。</p></div>`;
}
})();
</script>
</body>
