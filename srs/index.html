function spanishExplanation() {

  <h4>重音符号是拼写的一部分</h4><ul>

  <h4>容易混写的字母组</h4><p>b / v 一般不靠读音区分；h 通常不发音；ll / y 在多数地区同音；g 在 e / i 前与 j 对应同一类读音。c（e / i 前）、s、z 在拉美及西班牙部分地区可能同音，在西班牙多数地区仍有区别。当前按词形记忆这些组，不做发音练习。也留意 qu / c / k。</p>

  return `<div class="lesson-text"><p>先辨认 33 个字母，再看国际词的拼写。拉丁转写只帮助建立大致对应，不做发音练习，也不播放音频。</p>
  <ul><li><strong>形音都同：</strong>А К М О Т。这里指与拉丁字母的大致形音对应，不表示所有语境下发音完全一样。</li><li><strong>形同音不同：</strong>В Е Н Р С У Х。尤其留意 В → v、Н → n、Р → r、С → s。</li><li><strong>新形：</strong>其余 21 个，包括 Ё、Ь、Ъ。</li></ul>
  <p>转写约定：ye / yo / yu / ya 用于辨认 е / ё / ю / я；kh 也写作 x。Й 的 y 表示短促滑音，Ы 的 y 只是转写约定，两者不同。这里只列近似提示，实际读音随位置而变。</p>
  <div class="table-wrap" tabindex="0" aria-label="可横向滚动的俄语字母表"><table class="alphabet"><caption>33 个字母（字母顺序）</caption><thead><tr><th>大写</th><th>小写</th><th>斜体</th><th>大致读音／转写</th><th>分组</th></tr></thead><tbody>${letters.map(row => {
    const [upper,lower] = row.front.split(/\s+/); const [sound,group] = row.back.split('；');
    return `<tr><td class="letter" lang="ru">${esc(upper)}</td><td class="letter" lang="ru">${esc(lower || upper)}</td><td class="italic" lang="ru">${esc(lower || upper)}</td><td>${esc(sound)}</td><td>${esc(group || '新形')}</td></tr>`;
  }).join('')}</tbody></table></div>
  <h4>印刷体和斜体</h4><p>留意同一字母的斜体：<span lang="ru">т → <i class="italic">т</i>、д → <i class="italic">д</i>、г → <i class="italic">г</i>、и → <i class="italic">и</i>、п → <i class="italic">п</i>、в → <i class="italic">в</i></span>。т 常像拉丁 m，д 常像 g，и 常像 u，п 常像 n；г、в 也可能有较大变化。这里用系统衬线字体的斜体，实际字形依字体而异，不能代表所有手写体。</p>
  <h4>ь、ъ 与重音标记</h4><p>ь（软音符号）和 ъ（硬音符号）本身不发音，但不能漏写。ь 可以提示软化、分隔或语法信息；ъ 常见于前缀与 е、ё、ю、я 之间，起分隔作用。ё 的两点、й 顶部的短音符都是词形的一部分。</p>
  <p>词卡在重读元音后加组合重音符，如 телефо́н、му́зыка。普通俄语文本通常省略这个标记；本页拼写比较忽略 U+0301，但仍区分 е / ё、и / й。单音节国际词也统一标重音。字母示例里的 ё 本身提示重读。</p>
  <h4>键盘输入</h4><p>macOS 添加“俄语”（ЙЦУКЕН）或“俄语－语音”布局；iPhone 在键盘设置中添加俄语。先熟悉 33 个字母的位置。键盘输出的字符不会因为题目使用斜体而改变。</p>
  <h4>国际词</h4><p>本课准备了 18 个国际词，按词表标注记性别。例句统一用 Э́то…（这是……），不要求先学变格。前几周可先做下方页内练习；若暂不引入俄语 SRS 新卡，可在设置把 ru 每日新卡数设为 0，到期卡仍会出现。</p></div>`;
}

// 本地缓存与文件保存。
let rows, state, source = '文件', dirty = false, revision = 0;
let lastSaved = document.querySelector('meta[name="srs-saved-at"]').content;
let saveKind = document.querySelector('meta[name="srs-save-kind"]').content;
let storageWarning = '', notice = '', saving = false, handleReady = false, fileHandle = null;
let tab = 'review', language = 'all', lesson = 'es-01', session = null;
let revealed = false, typedAnswer = '', feedback = null;
const exerciseWork = new Map();
function persistCache() {
  try {
    localStorage.setItem(CACHE_KEY,JSON.stringify({state,cards:rows}));
    storageWarning = '';
  } catch (_) {
    storageWarning = '本地缓存不可用，请及时保存文件或导出进度。';
    if (dirty) source = '当前页面（本地缓存不可用）';
  }
}
function touch() {
  state.updatedAt = new Date(Math.max(Date.now(),Date.parse(state.updatedAt)+1)).toISOString();
  state.log = pruneLog(state.log);
  dirty = true; revision++; source = '本地缓存'; persistCache(); renderHeader();
}
function safeJSON(value) {
  return JSON.stringify(value,null,2).replace(/<\//g,'<\\/').replace(/<!--/g,'\\u003c!--');
}
function serializeDocument(doc, cardSnapshot, stateSnapshot, savedAt, kind) {
  const copy = doc.cloneNode(true);
  copy.getElementById('app').replaceChildren();
  copy.getElementById('cards-data').textContent = safeJSON(cardSnapshot);
  copy.getElementById('state-data').textContent = safeJSON(stateSnapshot);
  copy.querySelector('meta[name="srs-saved-at"]').content = savedAt;
  copy.querySelector('meta[name="srs-save-kind"]').content = kind;
  return '<!DOCTYPE html>\n'+copy.documentElement.outerHTML;
}
function handleStore(mode, value) {
  return new Promise((resolve,reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB 不可用')); return; }
    const request = indexedDB.open('language-srs-files-v1',1);
    request.onupgradeneeded = () => request.result.createObjectStore('handles');
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('文件句柄数据库被占用'));
    request.onsuccess = () => {
      const db = request.result;
      try {
        const tx = db.transaction('handles',mode === 'get' ? 'readonly' : 'readwrite');
        const operation = mode === 'get' ? tx.objectStore('handles').get(CACHE_KEY) : tx.objectStore('handles').put(value,CACHE_KEY);
        let result = null;
        operation.onsuccess = () => { result = operation.result; };
        tx.oncomplete = () => { db.close(); resolve(result); };
        tx.onerror = tx.onabort = () => { db.close(); reject(tx.error || new Error('句柄未能保存')); };
      } catch (error) { db.close(); reject(error); }
    };
  });
}
async function loadHandle() {
  if ('showSaveFilePicker' in window) {
    try { fileHandle = await Promise.race([handleStore('get'),new Promise(resolve => setTimeout(() => resolve(null),2000))]); } catch (_) { fileHandle = null; }
  }
  handleReady = true; renderHeader();
}
function download(content,type,name) {
  const url = URL.createObjectURL(new Blob([content],{type}));
  const link = document.createElement('a');
  link.href = url; link.download = name; link.hidden = true;
  document.getElementById('app').append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url),60000);
}
function adoptSaved(cardSnapshot,stateSnapshot,savedAt,kind,savedRevision) {
  document.getElementById('cards-data').textContent = safeJSON(cardSnapshot);
  document.getElementById('state-data').textContent = safeJSON(stateSnapshot);
  document.querySelector('meta[name="srs-saved-at"]').content = savedAt;
  document.querySelector('meta[name="srs-save-kind"]').content = kind;
  lastSaved = savedAt; saveKind = kind;
  if (revision === savedRevision) { rows = cardSnapshot; state = stateSnapshot; dirty = false; source = '文件'; }
  persistCache(); renderHeader();
}
async function saveFile({asNew=false,forceDownload=false} = {}) {
  if (saving) return;
  saving = true; renderHeader();
  let writable = null;
  try {
    const usePicker = !forceDownload && 'showSaveFilePicker' in window;
    let picked = false;
    if (usePicker) {
      if (!fileHandle || asNew) {
        const handle = await window.showSaveFilePicker({suggestedName:'index.html',types:[{description:'SRS 页面（HTML）',accept:{'text/html':['.html']}}]});
        fileHandle = handle; picked = true;
      } else if (await fileHandle.queryPermission({mode:'readwrite'}) !== 'granted') {
        if (await fileHandle.requestPermission({mode:'readwrite'}) !== 'granted') throw new Error('未取得文件写入权限。可在设置中另存为或下载 HTML。');
      }
    }
    const cardSnapshot = cloneValue(rows), stateSnapshot = cloneValue(state);
    stateSnapshot.log = pruneLog(stateSnapshot.log);
    const savedAt = new Date().toISOString(), savedRevision = revision;
    const kind = usePicker ? 'file' : 'download';
    const html = serializeDocument(document,cardSnapshot,stateSnapshot,savedAt,kind);
    if (usePicker) {
      writable = await fileHandle.createWritable();
      await writable.write(html); await writable.close(); writable = null;
      adoptSaved(cardSnapshot,stateSnapshot,savedAt,kind,savedRevision);
      let handleWarning = '';
      if (picked) {
        try { await handleStore('put',fileHandle); } catch (_) { handleWarning = ' 浏览器未能记住文件位置，下次打开可能需要重选。'; }
      }
      showNotice('已保存到文件。'+(dirty ? ' 保存期间有新进度，请再保存一次。' : '')+handleWarning);
    } else {
      download(html,'text/html;charset=utf-8','index.html');
      adoptSaved(cardSnapshot,stateSnapshot,savedAt,kind,savedRevision);
      showNotice('已生成 index.html 下载。请确认浏览器已完成下载并保留该文件；原文件不会自动覆盖。');
    }
  } catch (error) {
    if (writable) { try { await writable.abort(); } catch (_) {} }
    showNotice(error.name === 'AbortError' ? '已取消保存，进度仍保留在当前页面和可用的本地缓存中。' : '保存失败：'+error.message);
  } finally { saving = false; renderHeader(); }
}

function renderHeader() {

  node.innerHTML = `<div class="top-inner"><div class="top-row"><h1>语言复习 <small>SRS · v1</small></h1><div class="actions"><span class="save-status ${dirty?'dirty':''}">${dirty?'有未保存更改':'无未保存更改'}</span><button class="primary" data-action="save" ${saving || !handleReady?'disabled':''}>${saving?'保存中…':'保存'}</button></div></div><div class="state-source">当前状态来源：${esc(source)} · 最后保存时间：${esc(time)}${saveKind === 'download'?'（下载生成，请确认下载完成）':''}${storageWarning?' · '+esc(storageWarning):''}</div>${dirty && source !== '文件'?'<div class="state-source dirty">有未保存到文件的进度，记得保存</div>':''}</div>`;

function render() {
  document.getElementById('app').innerHTML = `<header class="top" id="header"></header><main class="page"><nav class="tabs" aria-label="主导航">${[['review','复习'],['lessons','课程'],['stats','统计'],['settings','设置']].map(([key,label]) => `<button data-tab="${key}" ${tab===key?'aria-current="page"':''}>${label}</button>`).join('')}</nav><div class="notice" id="notice" role="status" aria-live="polite">${esc(notice)}</div><section id="content" aria-label="${{review:'复习',lessons:'课程',stats:'统计',settings:'设置'}[tab]}"></section><p class="foot">当前只学读写。v1 冻结至 2026-12-06 复盘，中间只修 bug。</p></main>`;

function resetSession() { session = null; revealed = false; typedAnswer = ''; feedback = null; }

    const queue = buildQueue(rows,state,language,day);

}

  <section class="panel"><h3>保存文件</h3><p>评分后会自动缓存。点保存把卡片和进度写入 HTML，保存后再人工提交和推送 Git。</p><div class="actions"><button class="primary" data-action="save">保存</button><button data-action="save-as">另存为</button><button data-action="download-html">下载 HTML</button></div><p class="muted">Chrome / Edge 首次选择文件位置，之后复用。其他浏览器下载一份新文件。GitHub Pages 页面不能直接改仓库。</p></section>
  <section class="panel span-all"><h3>导入卡片 CSV</h3><p class="muted">按 id 更新内容和增加词条，保留已有复习状态。请保留原 id；字母行的 tags 需包含 letter。</p><label for="csv-file">选择 CSV 文件</label><input id="csv-file" type="file" accept=".csv,text/csv"><label for="csv-text">或粘贴 CSV（含表头）</label><textarea id="csv-text" spellcheck="false" placeholder="id,lang,lesson,front,back,example,example_zh,note,tags"></textarea><div class="actions"><button data-action="import-csv">导入粘贴的卡片</button></div></section>
  <section class="panel span-all"><h3>导出／导入进度</h3><p>在手机导出，在电脑导入。同一张卡取 last 日期更晚的记录；同日比较该卡最近评分时间，仍相同则保留当前记录。导入保留本机的每日新卡设置。</p><div class="actions"><button data-action="copy-progress">复制进度 JSON</button><button data-action="export-progress">下载进度 JSON</button></div><label for="progress-file">选择进度 JSON 文件</label><input id="progress-file" type="file" accept=".json,application/json"><label for="progress-text">或粘贴进度 JSON</label><textarea id="progress-text" spellcheck="false" placeholder="粘贴完整状态 JSON"></textarea><div class="actions"><button data-action="import-progress">合并粘贴的进度</button></div><p class="muted">进度 JSON 不包含卡片内容。两台设备应使用相同卡片；暂时未知的卡片进度会保留，之后导入对应 CSV 即可继续。</p></section>
  <section class="panel span-all help"><h3>帮助</h3><ol><li>先在课程页看讲解和词表，再到复习页选语言。</li><li>先尝试回忆，再翻面评分。拼写题可按 Enter 提交，符号提示只给建议。</li><li>Again 会在本次队列末尾再出；刷新后仍以到期卡出现。日期按设备本地时区计算。</li><li>每天结束时点保存。iPhone 上的进度只在当前浏览器缓存；需要合并时导出 JSON，到电脑导入后保存。</li><li>加卡片时编辑 srs/cards/*.csv，在此页导入，再保存。页面不会自行读取 CSV。</li></ol><p>本地缓存按页面路径区分，不是跨设备同步；清理浏览器数据、使用隐私模式或换路径都可能影响缓存。下载后请确认文件确实已保留。</p><p>v1 冻结到 2026-12-06 复盘前，只修 bug，不加功能。完整说明见同目录 README.md。</p></section></div>`;
}

// 评分、导入与交互。
function focusReview() {
  const target = document.getElementById(!revealed && currentCard()?.direction === 'p' ? 'spelling' : 'review-card');
  target?.focus({preventScroll:true});
}
function checkDay() {
  if (session && session.day !== localDay()) {
    resetSession(); render(); showNotice('本地日期已变化，今日队列已更新。'); return false;
  }
  return true;
}
function reveal(unknown=false) {
  if (!checkDay() || revealed || !currentCard()) return;
  const card = currentCard();
  if (card.direction === 'p') {
    typedAnswer = document.getElementById('spelling')?.value || '';
    feedback = unknown ? {grade:0,kind:'wrong',message:'尚未记住'} : spellingResult(typedAnswer,card.row.front,card.row.lang);
  }
  revealed = true; render(); focusReview();
}
function gradeCard(grade) {
  if (!checkDay() || !revealed || !currentCard()) return;
  const card = currentCard(), day = localDay();
  state.cards[card.id] = schedule(state.cards[card.id],grade,day);
  state.log.push({t:new Date().toISOString(),card:card.id,grade});
  if (session.queue.length) session.queue.shift(); else session.again.shift();
  if (grade === 0) session.again.push(card);
  session.done++; revealed = false; typedAnswer = ''; feedback = null;
  touch(); render(); focusReview();
}
function importCSV(text) {
  const incoming = parseCSV(text), nextRows = mergeRows(rows,incoming);
  const added = incoming.filter(row => !rows.some(old => old.id === row.id)).length;
  rows = nextRows; resetSession(); touch();
  showNotice(`已导入 ${incoming.length} 条：新增 ${added} 条，更新 ${incoming.length-added} 条。复习状态保留，请保存文件。`);
}
function importProgress(text) {
  const incoming = validateState(JSON.parse(text));
  state = mergeProgress(state,incoming); resetSession(); touch();
  showNotice(`已按卡合并 ${Object.keys(incoming.cards).length} 条进度，并合并最近 60 天日志。请保存文件。`);
}
async function copyProgress() {
  state.log = pruneLog(state.log);
  const text = JSON.stringify(state,null,2);
  try {
    if (!navigator.clipboard?.writeText) throw new Error('clipboard unavailable');
    await navigator.clipboard.writeText(text); showNotice('进度 JSON 已复制。');
  } catch (_) {
    const area = document.getElementById('progress-text');
    if (area) { area.value = text; area.focus(); area.select(); }
    showNotice(area ? '浏览器未允许自动复制。JSON 已放入文本框并选中，可手动复制，或点下载进度 JSON。' : '浏览器未允许自动复制，请返回设置下载进度 JSON。');
  }
}
async function readTextFile(file) {
  if (!file) return null;
  if (file.size > 20*1024*1024) throw new Error('文件超过 20 MB，请检查是否选对文件。');
  if (file.text) return file.text();
  return new Promise((resolve,reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('文件读取失败。')); reader.readAsText(file,'UTF-8'); });
}
function handleError(error) { showNotice('未完成：'+(error.message || String(error))); }
function bindEvents() {
  document.getElementById('app').addEventListener('click',event => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    try {
      if (button.dataset.tab) { tab = button.dataset.tab; render(); return; }
      if (button.dataset.lesson) { lesson = button.dataset.lesson; render(); return; }
      if (button.dataset.grade !== undefined) { gradeCard(Number(button.dataset.grade)); return; }
      const action = button.dataset.action;
      if (action === 'save') void saveFile();
      else if (action === 'save-as') void saveFile({asNew:true});
      else if (action === 'download-html') void saveFile({forceDownload:true});
      else if (action === 'reveal') reveal();
      else if (action === 'unknown') reveal(true);
      else if (action === 'import-csv') importCSV(document.getElementById('csv-text').value);
      else if (action === 'import-progress') importProgress(document.getElementById('progress-text').value);
      else if (action === 'copy-progress') void copyProgress();
      else if (action === 'export-progress') { state.log = pruneLog(state.log); download(JSON.stringify(state,null,2),'application/json;charset=utf-8','srs-progress-'+localDay()+'.json'); showNotice('已生成进度 JSON 下载，请确认下载完成。'); }
    } catch (error) { handleError(error); }
  });
  document.getElementById('app').addEventListener('input',event => {
    if (event.target.id === 'spelling') typedAnswer = event.target.value;
    const form = event.target.closest('[data-exercise]');
    if (form) {
      exerciseWork.set(lesson+':'+form.dataset.exercise,{answer:event.target.value});
      form.querySelector('.exercise-result').replaceChildren();
    }
  });
  document.getElementById('app').addEventListener('change',async event => {
    try {
      if (event.target.id === 'language') { language = event.target.value; resetSession(); render(); return; }
      if (['csv-file','progress-file'].includes(event.target.id)) {
        const isCSV = event.target.id === 'csv-file', text = await readTextFile(event.target.files[0]);
        if (text !== null) { if (isCSV) importCSV(text); else importProgress(text); }
        event.target.value = '';
      }
    } catch (error) { event.target.value = ''; handleError(error); }
  });
  document.getElementById('app').addEventListener('submit',event => {
    event.preventDefault();
    try {
      const form = event.target;
      if (form.id === 'limits') {
        const es = Number(form.elements.es.value), ru = Number(form.elements.ru.value);
        if ([es,ru].some(n => !Number.isInteger(n) || n<0 || n>999)) throw new Error('每日新卡数须为 0–999 的整数。');
        state.settings.newPerDay = {es,ru}; resetSession(); touch(); showNotice('每日新卡数已应用，请保存文件。');
      } else if (form.dataset.exercise !== undefined) {
        const i = Number(form.dataset.exercise), exercise = LESSONS[lesson].exercises[i], answer = form.elements.answer.value;
        const result = spellingResult(answer,exercise.answer,LESSONS[lesson].lang);
        exerciseWork.set(lesson+':'+i,{answer,result}); form.querySelector('.exercise-result').innerHTML = exerciseFeedback(result,exercise.answer);
      }
    } catch (error) { handleError(error); }
  });
  document.addEventListener('keydown',event => {
    if (tab !== 'review' || event.repeat || event.isComposing || event.keyCode === 229 || event.altKey || event.ctrlKey || event.metaKey) return;
    const editing = event.target.closest('input,textarea,select,[contenteditable="true"]');
    if (event.key === 'Enter' && event.target.id === 'spelling') { event.preventDefault(); reveal(); return; }
    if (editing) return;
    if (/^[1-4]$/.test(event.key) && revealed) { event.preventDefault(); gradeCard(GRADES[Number(event.key)-1]); }
    else if ((event.code === 'Space' || event.key === ' ') && !event.target.closest('button,summary,a')) { event.preventDefault(); reveal(); }
  });
  window.addEventListener('beforeunload',event => { if (dirty) { event.preventDefault(); event.returnValue = ''; } });
  document.addEventListener('visibilitychange',() => { if (!document.hidden && tab === 'review') checkDay(); });
  window.addEventListener('storage',event => {
    if (event.key === CACHE_KEY && event.newValue) showNotice('同一页面路径的其他标签页更新了缓存。为避免覆盖，请只在一个标签页复习；可先导出本页进度，再重新打开并合并。');
  });
}

// 启动。
function initialize() {
  rows = validateRows(JSON.parse(document.getElementById('cards-data').textContent));
  state = validateState(JSON.parse(document.getElementById('state-data').textContent));
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (raw) {
      const cache = JSON.parse(raw), cachedState = validateState(cache.state || cache);
      if (Date.parse(cachedState.updatedAt) > Date.parse(state.updatedAt)) {
        const cachedRows = cache.cards && Array.isArray(cache.cards) ? validateRows(cache.cards) : rows;
        state = cachedState; rows = cachedRows; source = '本地缓存'; dirty = true;
      }
    }
  } catch (_) { storageWarning = '本地缓存无法读取，已使用文件中的数据；请及时保存。'; }
  render(); bindEvents(); void loadHandle();
}
try { initialize(); } catch (error) {
  document.getElementById('app').innerHTML = `<div class="loading"><h1>页面数据无法加载</h1><p>${esc(error.message)}</p><p>请使用完好的 HTML 文件重新打开，保留当前文件供检查。</p></div>`;
}
})();
</script>
