。","kind":"学习例句","note":"～を引く＝扣除。到期价值 100 与净利润 40 不是同一个数字；忽略手续费与税。","sourceKey":"role","page":22},{"jp":"{買い手|かいて}は{権利|けんり}を{放棄できます|ほうきできます}が、{売り手|うりて}は{行使された|こうしされた}{権利|けんり}に{応じる|おうじる}{義務|ぎむ}を{負います|おいます}。","zh":"买方可以放弃权利，卖方则负有履行被行使权利的义务。","kind":"学习例句","note":"这里的买卖方是期权合约买卖方。卖出看跌期权也承担义务，不能因为名字有“看跌”就当作卖股票。","sourceKey":"role","page":21},{"jp":"プットを{買う|かう}{人|ひと}は、{決められた|きめられた}{価格|かかく}で{原資産|げんしさん}を{売る|うる}{権利|けんり}を{得ます|えます}。","zh":"买入看跌期权的人，取得按约定价格卖出基础资产的权利。","kind":"学习例句","note":"得る＝获得。看跌期权买方拥有卖出标的的权利；它仍然是在“买期权”。","sourceKey":"role","page":21},{"jp":"プレミアムを{比べる|くらべる}ときは、{原資産|げんしさん}の{価格|かかく}に{加えて|くわえて}、{満期|まんき}までの{時間|じかん}とボラティリティも{確認します|かくにんします}。","zh":"比较权利金时，除了基础资产价格，也要查看剩余到期时间与波动率。","kind":"学习例句","note":"～に加えて＝除了……之外还……。期权价格不能只用股票今天涨跌来解释。","sourceKey":"role","page":23}],"grammar":[{"pattern":"～なら","explain":"设置假定条件，适合描述不同到期价格下的盈亏。","example":"{満期|まんき}の{株価|かぶか}が1,100{円|えん}なら、このコールの{満期価値|まんきかち}はゼロです。","zh":"如果到期股价为 1,100 日元，这份看涨期权的到期价值为零。"},{"pattern":"～に加えて、～も","explain":"添加分析因素，比单纯列举更能表达“还须考虑”。","example":"{価格|かかく}に{加えて|くわえて}、{残存期間|ざんぞんきかん}も{比べます|くらべます}。","zh":"除价格外，也比较剩余期限。"}],"terms":[{"ja":"コール","kana":"こーる","zh":"看涨期权，买方获得按约定条件买入标的的权利。"},{"ja":"プット","kana":"ぷっと","zh":"看跌期权，买方获得按约定条件卖出标的的权利。"},{"ja":"権利行使価格","kana":"けんりこうしかかく","zh":"行权价格，期权规定的买卖标的价格。"},{"ja":"プレミアム","kana":"ぷれみあむ","zh":"期权价格、权利金，由期权买方支付给卖方。"},{"ja":"権利行使","kana":"けんりこうし","zh":"依合约要求执行买入或卖出等约定。"},{"ja":"権利放棄","kana":"けんりほうき","zh":"不执行期权权利；已付权利金不会因此退还。"},{"ja":"満期","kana":"まんき","zh":"合约期限结束的时点。"},{"ja":"本質的価値","kana":"ほんしつてきかち","zh":"内在价值；以即时行权价值作基本理解，不能为负。"},{"ja":"時間的価値","kana":"じかんてきかち","zh":"期权价格中与到期前可能性等有关、超过内在价值的部分。"},{"ja":"ボラティリティ","kana":"ぼらてぃりてぃ","zh":"波动率，描述价格波动程度，不等于预期上涨率。"},{"ja":"義務","kana":"ぎむ","zh":"必须履行的责任；期权卖方须按规则响应行权。"},{"ja":"損益","kana":"そんえき","zh":"盈利或亏损；应说明是否计入权利金及费用。"}],"questions":[{"type":"choice","prompt":"本课算例：行权价 1,200、权利金 60、到期股价 1,300，不计费用，看涨买方净利润是多少？","options":["100","40","160"],"answer":1,"explain":"到期价值 max(1300−1200,0)=100；净利润 100−60=40。"},{"type":"choice","prompt":"哪一方拥有按约定价格卖出基础资产的权利？","options":["看跌期权买方","看跌期权卖方","看涨期权卖方"],"answer":0,"explain":"Put 的买方获得卖出标的的权利；Put 卖方承担被行权时买入标的的义务。"},{"type":"text","prompt":"写出「権利行使」的平假名读音。","answers":["けんりこうし"],"explain":"権利＝けんり，行使＝こうし。"},{"type":"choice","prompt":"一份已经全额付清权利金的单独看涨期权到期无价值，未另做其他交易，买方主要损失是？","options":["自动获得退款","只需忘记合约就没有损失","已经支付的权利金，另加相关费用"],"answer":2,"explain":"单独买入期权可将期权头寸损失限制在权利金及费用；行权后取得的新资产或其他组合风险须另算。"}],"writing":{"prompt":"用一句日语说明期权买方和卖方最重要的一项区别。","reference":"{買い手|かいて}は{権利|けんり}を{持ちます|もちます}が、{売り手|うりて}は{行使|こうし}に{応じる|おうじる}{義務|ぎむ}を{負います|おいます}。","zh":"买方拥有权利，而卖方承担响应行权的义务。","checks":["买卖方是否指期权合约的买卖方？","是否避免把卖方亏损也限制为权利金？"]},"notes":["四种头寸：买入 Call＝买入标的的权利；卖出 Call＝被行权时卖出标的的义务；买入 Put＝卖出标的的权利；卖出 Put＝被行权时买入标的的义务。指数期权等现金结算产品按合约支付差额，不交付“指数实物”。","简化到期公式（S＝到期标的价，K＝行权价，p＝权利金，均按相同单位且不计费用）：Call 买方为 max(S−K,0)−p；Put 买方为 max(K−S,0)−p；对应卖方盈亏相反。Call 卖方的无保护亏损理论上可无限扩大；对价格不能低于零的股票，Put 卖方亏损有数学上限，但仍可能远超收到的权利金。","本课 1,200/60 的 Call 若到期股价为 1,100，到期价值为零、净亏损 60；若到期为 1,240，到期价值 40，仍净亏损 20。期权有行权价值，不等于买方整笔交易已经盈利。","美式（アメリカン）与欧式（ヨーロピアン）区分可行权时段，不是区分投资者国籍或上市地域。欧式在规定到期日行权，仍可能在到期前卖出期权平仓；自动行权、放弃申报等按产品规则执行。","期权买方通常支付全额权利金；卖方通常需保证金承担履约风险。时间价值受剩余期限与预期波动等影响，其他条件相同的一般模型下，波动率增加通常会提高普通期权价格；这不是“股票必涨”的信号。","保护性看跌（プロテクティブ・プット）将持有标的与买入 Put 组合，可为下跌风险提供保护，但需付权利金。备兑看涨（カバード・コール）持有标的并卖出 Call，收取权利金的同时限制部分上涨收益，标的下跌风险仍存在。","期权也用于方向判断、波动率交易及多腿组合。交易历史从早期权利契约发展到现代交易所标准化合约；教材举美国 1973 年上市股票期权、日本 1989 年股指期权作为节点，重点理解标准化和市场组织的发展。"],"coverage":["Ⅴ-2 Call/Put、买方权利与卖方义务、权利金","Ⅴ-2 四类头寸到期盈亏","Ⅴ-2 行权日、美式/欧式、保证金","Ⅴ-2 内在价值、时间价值、期限与波动率","Ⅴ-2 期权历史","Ⅴ-2 保护性看跌、备兑看涨、投机与组合策略"]},{"id":"role-06","module":"交易所机制","title":"成交以后：清算、交收与信用交易","titleJa":"清算・決済・信用取引","summary":"把“成交”和“钱券到位”拆开理解，再认识净额处理、账户划转以及借钱买股、借券卖出的履约责任。","minutes":30,"sources":[{"key":"role","pages":[29,30,31,32,33,34],"label":"Ⅶ 股票交收、JSCC、净额结算、保管振替与信用交易"}],"objectives":["用日语区分成交、清算与最终交收","说明 JSCC 与证券保管振替机构的不同职责","认识信用交易的借贷、担保、费用、追加保证金和了结方式"],"sentences":[{"jp":"{売買|ばいばい}が{成立しても|せいりつしても}、その{瞬間|しゅんかん}に{代金|だいきん}と{株式|かぶしき}の{受渡し|うけわたし}が{終わる|おわる}とは{限りません|かぎりません}。","zh":"即使交易已经成交，也不意味着价款和股票的交付在那个瞬间就已经完成。","kind":"学习例句","note":"～とは限らない＝不一定……。成交建立契约，最终交收完成实际的款券转移。","sourceKey":"role","page":29},{"jp":"{清算|せいさん}では{誰が|だれが}{何を|なにを}{渡す|わたす}かを{整理し|せいりし}、{決済|けっさい}では{実際に|じっさいに}{資金|しきん}や{証券|しょうけん}を{移します|うつします}。","zh":"清算整理各方应交付什么，而交收则实际转移资金和证券。","kind":"学习例句","note":"这是入门层面的职责划分；中央对手方还承担债务承接和履约保障等功能。","sourceKey":"role","page":30},{"jp":"{同じ|おなじ}{決済日|けっさいび}の{同じ|おなじ}{銘柄|めいがら}について、{買い|かい}300{株|かぶ}と{売り|うり}200{株|かぶ}を{相殺すると|そうさいすると}、{差引き|さしひき}は{買い|かい}100{株|かぶ}です。","zh":"对于相同交收日的同一证券，买入 300 股与卖出 200 股相抵后，净额是买入 100 股。","kind":"学习例句","note":"数字用于解释同一清算参与方的证券数量净额；资金金额还须依据各笔成交价另算。","sourceKey":"role","page":30},{"jp":"{株式|かぶしき}の{受渡し|うけわたし}は、{紙|かみ}の{株券|かぶけん}を{運ぶ|はこぶ}{代わりに|かわりに}、{口座間|こうざかん}の{振替|ふりかえ}で{行われます|おこなわれます}。","zh":"股票交付通过账户之间的划转进行，而不是搬运纸质股票。","kind":"学习例句","note":"～代わりに＝代替……。日本上市股票的电子化账户制度是这里的背景。","sourceKey":"role","page":31},{"jp":"{信用取引|しんようとりひき}で{資金|しきん}や{株式|かぶしき}を{借りた|かりた}{場合|ばあい}は、{決められた|きめられた}{条件|じょうけん}に{従って|したがって}{返済する|へんさいする}{必要|ひつよう}があります。","zh":"如果通过信用交易借用了资金或股票，就需要按照约定条件偿还。","kind":"学习例句","note":"～に従って＝按照……。能做较大规模交易，并不取消偿还借款或借券的义务。","sourceKey":"role","page":34}],"grammar":[{"pattern":"～ても、～とは限らない","explain":"即使前件成立，后件也不一定成立，用于区分相近阶段。","example":"{約定|やくじょう}しても、{受渡し|うけわたし}が{完了した|かんりょうした}とは{限りません|かぎりません}。","zh":"即使成交了，也不一定已经完成交收。"},{"pattern":"～に従って","explain":"表示按照规则、期限或程序执行。","example":"{契約|けいやく}に{従って|したがって}、{借りた|かりた}{株式|かぶしき}を{返します|かえします}。","zh":"按照合同归还借入的股票。"}],"terms":[{"ja":"清算","kana":"せいさん","zh":"在成交后承接、核算或抵销债权债务，为交收作准备。"},{"ja":"決済","kana":"けっさい","zh":"通过款券转移等履行应交付义务；语境不同也可指头寸了结。"},{"ja":"受渡し","kana":"うけわたし","zh":"交收、交付，指证券与价款等的转移。"},{"ja":"相殺","kana":"そうさい","zh":"互相抵销；此处不读そうさつ。"},{"ja":"振替","kana":"ふりかえ","zh":"账户间划转。"},{"ja":"基準日","kana":"きじゅんび","zh":"确定享有特定股东权利者的记录基准日。"},{"ja":"信用取引","kana":"しんようとりひき","zh":"向券商借入资金或证券进行买卖的交易。"},{"ja":"担保","kana":"たんぽ","zh":"为履行债务而提供的担保资产。"},{"ja":"委託保証金","kana":"いたくほしょうきん","zh":"信用交易向券商交付的保证金。"},{"ja":"追証","kana":"おいしょう","zh":"担保不足等情况下追加的保证金。"},{"ja":"品貸料","kana":"しながしりょう","zh":"制度信用交易中证券借贷紧张时可能发生的借券费用，也称逆日步。"},{"ja":"逆日歩","kana":"ぎゃくひぶ","zh":"品貸料的另一称呼；不等于普通持仓利息。"}],"questions":[{"type":"choice","prompt":"“成交—清算—交收”的正确理解是哪一个？","options":["三个词完全同义","成交建立交易，清算处理债务，交收完成实际转移","清算保证股票一定上涨"],"answer":1,"explain":"清算与交收服务于交易履约，不消除价格波动造成的投资损失。"},{"type":"text","prompt":"写出「相殺」在清算语境中的平假名读音。","answers":["そうさい"],"explain":"相殺读そうさい，表示互相抵销。"},{"type":"choice","prompt":"同一参与方、同一交收日、同一证券：买入 500 股、卖出 350 股，证券净交收数量是？","options":["净买入 150 股","净买入 850 股","净卖出 150 股"],"answer":0,"explain":"500−350＝150，资金净额需另按成交金额计算。"},{"type":"choice","prompt":"关于信用交易保证金，哪项准确？","options":["保证金就是全部最大亏损","借钱买股无需归还借款","行情不利时可能需要追加保证金，亏损可能超过初始保证金"],"answer":2,"explain":"保证金用于担保履约，并非对亏损设置上限。"}],"writing":{"prompt":"用「～とは限りません」写一句日语，说明成交和交收不能混为一谈。","reference":"{注文|ちゅうもん}が{約定|やくじょう}しても、{代金|だいきん}の{受渡し|うけわたし}まで{終わった|おわった}とは{限りません|かぎりません}。","zh":"即使订单成交，也不一定已经完成价款交付。","checks":["是否把约定与受渡し区分开？","是否正确使用了とは限りません？"]},"notes":["教材的 2026 年 3 月版以日本普通股票 T+2 交收为例：T 是交易日，+2 指之后两个营业日。基准日、除权日和最后含权交易日需要结合交收日历理解，不能只看自然日或简单认为“基准日当天买就有权利”。","JSCC 作为中央对手方承接参与者之间的债务、进行净额处理并安排履约。集中清算降低和管理对手方风险，并不消除一切风险；市场价格风险、集中清算自身的流动性及违约管理风险仍需要制度管理。","证券与资金可分别净额计算：同一证券的股数相抵不依赖成交价，资金净额则按买卖金额合计相抵。净额处理减少需要实际转移的款券数量，不改变每笔交易原有的经济盈亏。","证券保管振替机构（証券保管振替機構／しょうけんほかんふりかえきこう，简称ほふり）处理证券账户划转，并依据账户机构资料进行股东信息通知，帮助发行公司维护股东名册。JSCC 的清算角色与ほふり的划转角色不同。","信用买入借钱买股，信用卖出借券卖股；买入股票或卖出款项作为担保，还会有委托保证金。行情变化可能要求追加保证金。券商条件可能严于市场最低要求，不能仅凭教材比例推断自己的账户要求。","制度信用交易按交易所规定的相关条件进行；一般信用交易依券商与客户约定。期限、可借品种和费用可能不同。证券金融公司的貸借取引（たいしゃくとりひき）用于补充券商资金或股票来源；证券短缺可能产生品貸料／逆日歩。","了结方法：信用买入可卖股偿还借款，或自行付款现引（現引き／げんびき）取得股票；信用卖出可买回还券，或自行交付相同证券现渡（現渡し／げんわたし）。这些方法都需要处理借贷、费用及可能的盈亏。","JSCC 服务不只覆盖现货股票，也涵盖多种上市衍生品及部分场外交易；不同产品的担保和结算安排必须分开查看。"],"coverage":["Ⅶ-1 股票交收、T+2、基准日与含权/除权","Ⅶ-2 JSCC范围、中央对手方、证券与资金净额处理","Ⅶ-3 保管振替、电子账户、总股东通知","Ⅶ-4 信用交易目的、借贷、担保、委托保证金与追证","Ⅶ-4 证券金融、贷借交易、品贷料/逆日步","Ⅶ-4 制度信用与一般信用、反向交易、现引/现渡"]},{"id":"role-07","module":"交易所机制","title":"市场公平如何被维护","titleJa":"自主規制と市場の公正さ","summary":"认识交易审查与券商检查，练习区分内幕信息、操纵行为、正常价格变化和监管结论。","minutes":20,"sources":[{"key":"role","pages":[35,36],"label":"Ⅷ 自律监管、交易审查、券商检查、合规支持"}],"objectives":["区分上市审查、上市管理、交易审查和券商检查","理解未公开重要信息与人为误导市场的问题","掌握表达“是否调查”和“尚不能断定”的日语句型"],"sentences":[{"jp":"{市場|しじょう}への{信頼|しんらい}を{保つ|たもつ}ために、{注文|ちゅうもん}や{売買|ばいばい}のデータを{調べる|しらべる}{仕事|しごと}があります。","zh":"为了维护对市场的信任，有专门分析订单和交易数据的工作。","kind":"学习例句","note":"～を保つ＝维持……。交易监管关心市场公平，不能据此推断某只股票的价值。","sourceKey":"role","page":35},{"jp":"{担当者|たんとうしゃ}は、{公表前|こうひょうまえ}の{重要情報|じゅうようじょうほう}と{売買|ばいばい}の{時期|じき}に{関係|かんけい}がないかを{確認します|かくにんします}。","zh":"相关人员检查未公开重要信息与交易时点之间是否存在关联。","kind":"学习例句","note":"～ないかを確認する＝检查是否存在某种问题；询问式否定并不预先断定结果。","sourceKey":"role","page":35},{"jp":"{不自然な|ふしぜんな}{値動き|ねうごき}があっても、それだけで{違反|いはん}と{断定する|だんていする}ことはできません。","zh":"即使出现不自然的价格变化，也不能仅凭这一点断定违法。","kind":"学习例句","note":"～だけで＝仅凭……。异常信号、调查过程和查明违规是不同层次。","sourceKey":"role","page":35},{"jp":"{証券会社|しょうけんがいしゃ}については、{書面|しょめん}の{報告|ほうこく}だけでなく、{実地|じっち}で{業務|ぎょうむ}の{状況|じょうきょう}を{確かめる|たしかめる}{方法|ほうほう}もあります。","zh":"检查证券公司时，除了查看书面报告，也可以实地确认业务情况。","kind":"学习例句","note":"実地读じっち。书面持续监控与现场检查可以互相补充。","sourceKey":"role","page":36},{"jp":"{問題|もんだい}が{見つかった|みつかった}{場合|ばあい}は、その{内容|ないよう}に{応じて|おうじて}、{改善|かいぜん}を{求めたり|もとめたり}{処分|しょぶん}を{行ったり|おこなったり}します。","zh":"如果发现问题，会根据问题内容要求改进或采取处分。","kind":"学习例句","note":"～たり～たり列举可能的做法；不是任何小问题都会立即导致取消交易资格。","sourceKey":"role","page":36}],"grammar":[{"pattern":"～かを確認する","explain":"把疑问嵌入陈述句，表示核实某种情况。","example":"{規則|きそく}どおりに{処理した|しょりした}かを{確認します|かくにんします}。","zh":"核实是否依照规则进行了处理。"},{"pattern":"～に応じて","explain":"根据情况、程度或内容作相应调整。","example":"{問題|もんだい}の{内容|ないよう}に{応じて|おうじて}、{必要な|ひつような}{対応|たいおう}を{考えます|かんがえます}。","zh":"根据问题内容考虑所需的应对。"}],"terms":[{"ja":"自主規制","kana":"じしゅきせい","zh":"市场运营体系中的自律监管，服务于公正与可信的市场。"},{"ja":"売買審査","kana":"ばいばいしんさ","zh":"审查交易与订单，识别可能的不公正交易。"},{"ja":"考査","kana":"こうさ","zh":"对市场参与证券公司等开展业务及管理状况检查。"},{"ja":"相場操縦","kana":"そうばそうじゅう","zh":"人为影响行情并误导其他投资者的操纵行为。"},{"ja":"インサイダー取引","kana":"いんさいだーとりひき","zh":"涉及依法受限制的未公开重要信息的内幕交易。"},{"ja":"未公表","kana":"みこうひょう","zh":"尚未按要求公开。"},{"ja":"重要事実","kana":"じゅうようじじつ","zh":"可能对投资判断有重大影响、在相关规则下有特定含义的信息。"},{"ja":"取引参加者","kana":"とりひきさんかしゃ","zh":"取得相关市场交易资格的机构等。"},{"ja":"実地考査","kana":"じっちこうさ","zh":"现场检查系统、文件、流程和实际执行情况。"},{"ja":"内部管理","kana":"ないぶかんり","zh":"机构内部用于合规和稳健运营的管理机制。"},{"ja":"処分","kana":"しょぶん","zh":"依据相关规则作出的制裁或资格限制等措施。"},{"ja":"注意喚起","kana":"ちゅういかんき","zh":"提示有关风险或问题，促使相关方注意和改善。"}],"questions":[{"type":"choice","prompt":"JPX-R 的自律监管工作中，针对订单与成交、寻找不公正交易迹象的是？","options":["売買審査","株式分割","配当計算"],"answer":0,"explain":"売買審査分析交易行为；上市审查与券商考查各有不同对象。"},{"type":"choice","prompt":"看到某只股票突然大涨，最合理的结论是？","options":["已经证明有人操纵","不需要任何资料就能定性","可作为分析线索，但需要更多证据判断"],"answer":2,"explain":"异常价格变化不自动等于违法；应结合订单、消息、时点等证据调查。"},{"type":"text","prompt":"写出「考査」的平假名读音。","answers":["こうさ"],"explain":"考査读こうさ，此处指对证券公司业务等的检查。"},{"type":"choice","prompt":"哪一项属于持续书面监控而非现场检查？","options":["检查人员进入券商办公场所查看系统","审阅券商按要求提交的经营与交易报告","搬运纸质股票"],"answer":1,"explain":"审阅报告及书面问询属于非现场持续监控，可与实地检查互补。"}],"writing":{"prompt":"用「～かを確認します」写一句日语，描述合规人员的一项核查工作。","reference":"{担当者|たんとうしゃ}は、{必要な|ひつような}{記録|きろく}が{保存されている|ほぞんされている}かを{確認します|かくにんします}。","zh":"相关人员检查所需记录是否已经保存。","checks":["疑问内容是否接在か之前？","是否把调查行为与违规结论区分开？"]},"notes":["四项工作可按对象记：上場審査关注申请上市企业；上場管理关注已上市企业；売買審査关注交易行为；考査关注券商等参与者的管理和业务。组织独立性有助于缓解市场经营与监管之间的利益冲突。","操纵市场的问题在于人为制造误导性的交易或价格信号。内幕交易的问题在于利用受到相关规则约束的未公开重要信息。课程只学习概念，不能仅凭亲友传言或一次获利便认定某个人违法。","监管分析可将订单及成交数据与公司信息发布时间、关系人身份等相互核对。JPX-R 的调查与相关监管机关的执法职责不同，审查资料可支持监管机关的市场监控。","证券公司参加市场前需取得资格；参加后仍有书面报告、持续监控及实地检查。检查内容可以包括资金状况、系统、客户订单处理、内部控制及记录保存。","发现问题后的措施可能包括要求改善、警示、限制或停止交易资格等，具体取决于事实与适用规则；不要把交易所规则处分与司法机关的刑事判决混为一谈。","合规培训也是预防工作。教材介绍 COMLEC 的讲座、内部培训和电子学习等方式，目的在于帮助上市企业和交易参与者理解与落实规则。"],"coverage":["Ⅷ 自律监管的独立性与四项职能","Ⅷ-1 交易审查、操纵市场、内幕交易、信息核对与监管机关合作","Ⅷ-1 COMLEC合规支持","Ⅷ-2 交易资格审核、非现场监控、实地检查","Ⅷ-2 处分、改善与注意提示"]},{"id":"role-08","module":"交易所机制","title":"从基金到指数：先弄清自己在看什么","titleJa":"投資商品と株価指数","summary":"对照股票、债券、基金、ETF 与 REIT，再比较股价指数的加权方式和用途。","minutes":30,"sources":[{"key":"role","pages":[37,38,39,40,41],"label":"Ⅸ-1～3 储蓄投资、股票债券、基金、ETF和REIT"},{"key":"role","pages":[42,43,44,45],"label":"Ⅸ-4～5 股价变化、TOPIX、日经平均与其他指数"}],"objectives":["说明基金的投资者、运用指示方与保管方的分工","区分ETF、指数、REIT以及不同风险来源","理解股价、指数点位、权重、基准与基金回报的关系"],"sentences":[{"jp":"{投資信託|とうししんたく}を{選ぶ|えらぶ}ときは、{名前|なまえ}だけでなく、{何に|なにに}{投資する|とうしする}かと{費用|ひよう}を{調べます|しらべます}。","zh":"选择投资基金时，不只看名字，也要查清投向什么资产以及费用。","kind":"学习例句","note":"～か把疑问作为調べます的宾语。叫“基金”并不能直接说明风险大小。","sourceKey":"role","page":39},{"jp":"{ETF|イーティーエフ}は{取引所|とりひきじょ}で{売買できます|ばいばいできます}が、すべての{ETF|イーティーエフ}が{同じ|おなじ}{指数|しすう}に{連動する|れんどうする}わけではありません。","zh":"ETF 可以在交易所交易，但并不是所有 ETF 都跟踪同一个指数。","kind":"学习例句","note":"有的ETF跟踪不同指数，也有主动管理ETF；交易形式与投资策略要分开看。","sourceKey":"role","page":41},{"jp":"{不動産投資信託|ふどうさんとうししんたく}の{収益|しゅうえき}には、{建物|たてもの}の{賃料|ちんりょう}や{売却|ばいきゃく}による{損益|そんえき}が{関係します|かんけいします}。","zh":"REIT 的收益与物业租金及出售物业产生的盈亏等有关。","kind":"学习例句","note":"～には提示收益的构成领域；收到分配不意味着市值不会下降。","sourceKey":"role","page":40},{"jp":"{会社|かいしゃ}の{利益|りえき}が{増えても|ふえても}、{投資家|とうしか}の{期待|きたい}に{届かなければ|とどかなければ}、{株価|かぶか}が{下がる|さがる}ことがあります。","zh":"即使公司利润增长，如果未达到投资者预期，股价也可能下跌。","kind":"学习例句","note":"～ても表示让步；～ことがある表示有时会出现。股价反映需求与供给及对未来的判断，不是把利润机械复制。","sourceKey":"role","page":42},{"jp":"{指数|しすう}を{比べる|くらべる}{前に|まえに}、{採用銘柄|さいようめいがら}と{計算方法|けいさんほうほう}がどう{違う|ちがう}のかを{確認しましょう|かくにんしましょう}。","zh":"比较指数前，先确认成分证券和计算方法有什么不同。","kind":"学习例句","note":"～前に＝在……之前。指数涨幅相同，也不说明成分或风险完全一样。","sourceKey":"role","page":43}],"grammar":[{"pattern":"～ても、～ことがある","explain":"表示即使一个条件成立，仍可能出现另一种结果。","example":"{売上|うりあげ}が{増えても|ふえても}、{利益|りえき}が{減る|へる}ことがあります。","zh":"即使销售额增加，利润也可能减少。"},{"pattern":"动词原形＋前に","explain":"表示进行某项操作前的先行步骤。","example":"{指数|しすう}を{使う|つかう}{前に|まえに}、{算出方法|さんしゅつほうほう}を{読みます|よみます}。","zh":"使用指数之前，阅读其编制方法。"}],"terms":[{"ja":"投資信託","kana":"とうししんたく","zh":"汇集投资者资金，依特定方针投资并由相应机构管理的基金。"},{"ja":"受益者","kana":"じゅえきしゃ","zh":"享有基金权益的投资者。"},{"ja":"委託者","kana":"いたくしゃ","zh":"在本课基金结构中，发出运用指示的运用公司。"},{"ja":"受託者","kana":"じゅたくしゃ","zh":"在本课基金结构中，保管管理信托资产的信托银行等。"},{"ja":"上場投資信託","kana":"じょうじょうとうししんたく","zh":"ETF，在交易所上市交易的基金。"},{"ja":"不動産投資信託","kana":"ふどうさんとうししんたく","zh":"REIT，通过投资房地产等取得收入并向投资者分配。"},{"ja":"株価指数","kana":"かぶかしすう","zh":"按既定规则汇总一组证券价格变化的指标。"},{"ja":"時価総額","kana":"じかそうがく","zh":"股价乘以相关股票数量得到的市值。"},{"ja":"浮動株","kana":"ふどうかぶ","zh":"在指数计算等语境中，可在市场流通交易的股票部分。"},{"ja":"採用銘柄","kana":"さいようめいがら","zh":"被选入指数的成分证券。"},{"ja":"連動","kana":"れんどう","zh":"跟随某个指标变化；实际产品可能存在跟踪误差。"},{"ja":"為替リスク","kana":"かわせりすく","zh":"汇率变化影响以本币计算的资产价值或收益的风险。"},{"ja":"ETF","kana":"イーティーエフ","zh":"上市交易基金的简称；既有指数型，也有主动管理型。"},{"ja":"REIT","kana":"リート","zh":"房地产投资信托的简称；通过租金等收益和资产价值变化影响投资结果。"},{"ja":"TOPIX","kana":"トピックス","zh":"东证股价指数，依照浮动股市值等规则加权。"}],"questions":[{"type":"choice","prompt":"关于 ETF，哪项准确？","options":["ETF一定没有费用","ETF一定只投资日本股票","ETF是交易形式，具体资产与策略需要另看"],"answer":2,"explain":"ETF可投资不同资产、跟踪不同指标，也可能主动管理；风险与成本取决于具体产品。"},{"type":"choice","prompt":"TOPIX 与日经平均不能只比较指数的绝对数值，主要因为？","options":["成分、加权和基准不同","两个指数总是完全一样","指数越高一定越便宜"],"answer":0,"explain":"指数的点位基准与方法不同，不能拿绝对点位直接比较贵贱或表现。"},{"type":"text","prompt":"写出「時価総額」的平假名读音。","answers":["じかそうがく"],"explain":"時価＝じか，総額＝そうがく。"},{"type":"choice","prompt":"公司利润增长，股价却下跌，哪种解释在概念上可能成立？","options":["一定是交易系统坏了","增长不及市场原先预期","利润增长就绝不可能下跌"],"answer":1,"explain":"市场价格受预期、利率、风险和买卖需求等多种因素影响，并不机械复制利润变化。"}],"writing":{"prompt":"用「～前に」写一句日语，说明比较两只基金或指数之前要核实什么。","reference":"{二つ|ふたつ}の{ETF|イーティーエフ}を{比べる|くらべる}{前に|まえに}、{投資対象|とうしたいしょう}と{費用|ひよう}を{確認します|かくにんします}。","zh":"比较两只 ETF 之前，先确认投资对象和费用。","checks":["是否把要先做的核实写在前に后？","是否避免仅凭名称或历史涨幅作判断？"]},"notes":["储蓄与投资应结合用途理解。分散资产、分散时间与长期持有可以改变风险特征，但都不能保证本金或收益。股票代表权益，普通债券代表按条款取得利息及偿还本金的债权；债券仍有信用、利率及可能的汇率风险。","在教材所举契约型基金结构中，投资者是受益者，运用公司作为委托者决定投资，信托银行作为受托者保管管理资产。销售渠道、运用决策与资产保管不是同一种职责。","ETF 是上市交易的基金，存在指数型与主动型。REIT 聚焦房地产收益。基金市场成交价、资产净值和分配金是不同概念；产品费率、买卖价差、跟踪误差与持有资产均会影响结果。","ETF 资产类别可以覆盖日本股票、海外股票债券、房地产和商品等，外币风险及是否汇率对冲须分别检查。杠杆或反向产品通常以每日目标倍数运作，多日复利后不等于同期涨跌幅的固定倍数，不宜凭“2倍”字样推断长期结果。","股价受到公司业务、技术、品牌、事故与治理，以及景气、利率、汇率、海外市场、政策、灾害和投资者预期等影响。某个因素的方向并非对所有公司都相同，例如汇率会通过不同业务结构产生不同影响。","TOPIX 以浮动股调整市值等规则加权；日经平均采用经过调整的价格加权方法和除数。不能把日经平均简单理解为永远除以225的算术平均。成分变化、拆股等需要维护指数连续性。","指数既可描述市场，也可作业绩比较基准或衍生品标的。比较基金和指数时应对齐期间、币种及是否含股息；价格指数上涨幅度不等于投资者已经获得的含股息总回报。","教材还介绍 JPX日经400、JPX Prime150 及 ESG 指数。它们通过盈利能力、市场评价、ESG评分、碳效率或净零路径等不同规则选股或调整权重；纳入某指数不是对未来表现的保证，比较时应阅读方法文件。","历史指数走势图展示已经发生的价格路径。本课不重绘教材历史图，不把过去的形状当作未来必然趋势，也不把教材中的成分数量当作当前实时数量。"],"coverage":["Ⅸ-1 储蓄投资、自我判断与全球/时间分散和长期持有","Ⅸ-2 股票与债券的权利、收益及风险","Ⅸ-3 基金机制、受益者/委托者/受托者、基金类型与汇率风险","Ⅸ-3 ETF与REIT；参考1 ETF种类、检索及杠杆反向","Ⅸ-4 需求供给与公司/市场股价因素","Ⅸ-5 TOPIX/日经平均的权重、方法、用途与历史图","Ⅸ-5 JPX日经400、Prime150与ESG/碳效率/净零等指数"]},{"id":"role-09","module":"交易所机制","title":"市场之外：教育、数据与可持续投资","titleJa":"金融教育・データ・サステナビリティ","summary":"把教材中的教育活动、ESG、数字服务和碳市场串起来，学习如何提出可核实的问题并追溯原始资料。","minutes":25,"sources":[{"key":"role","pages":[48,49,50,51],"label":"Ⅹ-2 金融经济教育、模拟学习、主题证券和设施参观"},{"key":"role","pages":[52,53,54,55,56,57],"label":"Ⅹ-3～5 ESG、五项数字服务、绿色债券与碳信用市场"}],"objectives":["辨认金融教育、数据服务与投资产品的区别","用日语提出有关 ESG 信息来源和环境效果的核实问题","解释碳信用、环境债与股票的不同性质"],"sentences":[{"jp":"{授業|じゅぎょう}では、{実際に|じっさいに}{資金|しきん}を{使う|つかう}{前に|まえに}、シミュレーションで{価格変動|かかくへんどう}を{体験します|たいけんします}。","zh":"课堂上，在实际投入资金之前，先通过模拟体验价格变化。","kind":"学习例句","note":"～で表示手段。模拟可帮助学习机制，但简化条件下的成绩不等于真实投资能力。","sourceKey":"role","page":50},{"jp":"{ESG|イーエスジー}の{情報|じょうほう}を{読む|よむ}ときは、{環境|かんきょう}だけでなく、{働く|はたらく}{人|ひと}や{経営|けいえい}の{仕組み|しくみ}にも{目|め}を{向けます|むけます}。","zh":"阅读 ESG 信息时，除了环境，也关注劳动者等社会因素和公司的治理机制。","kind":"学习例句","note":"～に目を向ける＝把注意力转向……。ESG 的三类因素需要分别理解。","sourceKey":"role","page":52},{"jp":"{便利な|べんりな}{検索結果|けんさくけっか}が{見つかっても|みつかっても}、{重要な|じゅうような}{数字|すうじ}は{会社|かいしゃ}が{公表した|こうひょうした}{元|もと}の{資料|しりょう}で{確かめます|たしかめます}。","zh":"即使找到了方便的搜索结果，重要数字仍要回到公司公布的原始资料核实。","kind":"学习例句","note":"～ても表达让步。数据检索、AI摘要和公司原始披露各有用途。","sourceKey":"role","page":55},{"jp":"{環境債|かんきょうさい}を{調べる|しらべる}ときは、{集めた|あつめた}{資金|しきん}の{使い道|つかいみち}と、{環境効果|かんきょうこうか}の{測り方|はかりかた}を{確認します|かくにんします}。","zh":"研究环境债券时，要确认募集资金用途以及环境效果的测量方法。","kind":"学习例句","note":"动词连用形＋方＝做法，如測り方。数字化跟踪可以提供数据，但不直接保证债券收益。","sourceKey":"role","page":56},{"jp":"カーボン・クレジットの{購入|こうにゅう}は、{会社|かいしゃ}の{株式|かぶしき}を{買って|かって}{株主|かぶぬし}になることとは{違います|ちがいます}。","zh":"购买碳信用，与买入公司股票成为股东，是不同的事情。","kind":"学习例句","note":"～とは違う＝与……不同。不要把同在交易所相关市场出现的产品都视作股权。","sourceKey":"role","page":57}],"grammar":[{"pattern":"～に目を向ける","explain":"表示关注某个此前容易忽略的分析角度。","example":"{利益|りえき}に{加えて|くわえて}、{情報|じょうほう}の{透明性|とうめいせい}にも{目|め}を{向けます|むけます}。","zh":"除了利润，也关注信息透明度。"},{"pattern":"动词连用形＋方","explain":"表示做某事的方法，常见于数据阅读和调查步骤。","example":"{排出量|はいしゅつりょう}の{測り方|はかりかた}を{資料|しりょう}で{確認します|かくにんします}。","zh":"在资料中确认排放量的测量方法。"}],"terms":[{"ja":"金融経済教育","kana":"きんゆうけいざいきょういく","zh":"帮助人们理解金融、经济与资金决策的教育。"},{"ja":"模擬取引","kana":"もぎとりひき","zh":"在模拟条件下进行交易练习，不使用真实成交结果作保证。"},{"ja":"環境","kana":"かんきょう","zh":"ESG 中的 E，涉及气候、资源、污染等环境因素。"},{"ja":"社会","kana":"しゃかい","zh":"ESG 中的 S，可包括劳动、客户、供应链等社会因素。"},{"ja":"ガバナンス","kana":"がばなんす","zh":"ESG 中的 G，公司决策、监督、治理与问责机制。"},{"ja":"非財務情報","kana":"ひざいむじょうほう","zh":"财务报表数字以外、仍可能影响企业价值的信息。"},{"ja":"情報検索","kana":"じょうほうけんさく","zh":"查找相关信息，检索结果仍需核对来源与日期。"},{"ja":"書き起こし","kana":"かきおこし","zh":"将语音或活动发言整理成文字记录。"},{"ja":"可視化","kana":"かしか","zh":"将数据或过程用便于观察的形式呈现。"},{"ja":"環境債","kana":"かんきょうさい","zh":"募集资金与环境项目相关的债券，仍属于债务工具。"},{"ja":"排出量","kana":"はいしゅつりょう","zh":"排放数量，需说明气体范围、期间与计量口径。"},{"ja":"削減","kana":"さくげん","zh":"减少；排放削减效果需核实基准和认证方法。"}],"questions":[{"type":"choice","prompt":"ESG 中的 G 主要指哪一方面？","options":["交易保证收益","公司治理","股票价格增长"],"answer":1,"explain":"G 是 Governance，关注公司治理；不表示收益保证。"},{"type":"choice","prompt":"使用 AI 生成的公司摘要发现关键利润数字，下一步最好怎样做？","options":["回到公司原始披露核对期间、口径和数字","将摘要视为唯一原始凭证","认为数字经 AI 处理后不会有错误"],"answer":0,"explain":"数字服务可提高检索效率，重要判断仍应追溯原始资料及后续更正。"},{"type":"text","prompt":"写出「排出量」的平假名读音。","answers":["はいしゅつりょう"],"explain":"排出＝はいしゅつ，量＝りょう。"},{"type":"choice","prompt":"购买碳信用，能否仅因此取得某家公司的股东投票权？","options":["总是可以","只要名称含“市场”就可以","不能，碳信用和股票是不同产品"],"answer":2,"explain":"碳信用并不是股权证券；产品的权利应依据具体制度和条款理解。"}],"writing":{"prompt":"写一句日语，说明研究环境项目或 ESG 数据时你准备核实哪一种方法或来源。","reference":"{資料|しりょう}の{発行日|はっこうび}と、{排出量|はいしゅつりょう}の{測り方|はかりかた}を{確認します|かくにんします}。","zh":"我将核对资料发布日期与排放量的测量方法。","checks":["是否明确了要核实的日期、来源或方法？","是否避免把ESG标签写成盈利或环境效果保证？"]},"notes":["教育活动面向学生、教师、家庭、大学生、社会人士和企业培训。教材中的 JPXマネ部！ラボ、东证マネ部！和北浜投資塾分别提供不同形式的课程、文章与视频；模拟经营、模拟投资和设施参观也属于学习渠道。活动日期、预约、名额及费用需另看当前公告。","教材还介绍与其他机构合作的主题证券筛选，例如女性发展、健康经营、DX 与可持续转型等主题。入选反映特定评价维度，不能替代估值、风险分析，也不代表任何确定收益。","ESG 把环境、社会与治理因素纳入研究。气候风险既可能影响企业资产与经营，也可能经政策、技术及需求变化影响价值。教材讲到 TCFD 建议与相关披露，学习其分析目的即可；现行准则及适用范围须按最新官方文件核对。","截至本教材 2026 年 3 月版，数字服务示例包括：J-Quants 提供金融数据及分析学习支持；JPX ESG Link 帮助定位企业公开的 ESG 材料；SCRIPTS Asia 整理投资者关系活动文字及翻译；JPX Market Explorer 以数据与 AI 辅助检索和比较企业；绿色数字追踪债券把环境指标采集及查看流程数字化。它们不是同一类金融产品，是否收费及功能范围可能更新。","运用这些工具可分三步：发现线索、追溯原始材料、检查期间与计量口径。会议文字记录应区分管理层预测与实际结果；AI 摘要也应核实遗漏、翻译和数字。","绿色数字追踪债券的示例将 IoT 等数据采集与数字技术连接，用来查看发电量或碳减排等指标。数字化能提高观察效率，数据质量、项目效果和债券发行人的偿债能力仍是不同问题。","碳信用把按制度核算、认证的减排或吸收量形成可交易单位。不同项目类型、认证规则与年份不能只凭“每吨价格”简单视为相同。交易市场帮助形成流动性与价格信息，并不使碳信用自动变成公司股权。","JPX 推动可持续金融还包括相关指数、基金及债券信息支持、上市公司对话、市场韧性及自身信息披露。本课以机制为主，不沿用教材中的历史参与者人数、成交吨数和服务免费状态作为实时事实。"],"coverage":["Ⅹ-2 JPX教育品牌、学校/大学/社会/企业培训","Ⅹ-2 文章视频、模拟学习、主题证券、设施参观","Ⅹ-3 ESG与气候信息、治理、相关产品服务及JPX自身实践","Ⅹ-4 J-Quants、JPX ESG Link、SCRIPTS Asia、JPX Market Explorer","Ⅹ-4 绿色数字追踪债券、IoT与环境指标可视化","Ⅹ-5 碳信用市场的背景、产品性质及价格/流动性功能"]}]</script>
<script>
'use strict';
const lessons = JSON.parse(document.getElementById('course-data').textContent);
const sourceInfo = {
 fsa:{name:'金融厅 · 第4章「貯める・増やす」応用編',url:'https://www.fsa.go.jp/news/r3/sonota/20220317/04-2.pdf',pages:29,desc:'涵盖资产形成、利息与复利、金融产品、风险、ESG、长期定投分散和税优制度。历史图表、示例利率按原教材语境阅读。'},
 abc:{name:'东京证券交易所 · 株式ABC',url:'https://www.jpx.co.jp/corporate/learning/resources/tvdivq0000003toh-att/nlsgeu000000yyte.pdf',pages:32,desc:'公司与股东、上市与交易、交易规则、市场监管、股价、指数、东证参观与历史。'},
 role:{name:'JPX · 知っていますか？取引所の役割',url:'https://www.jpx.co.jp/corporate/learning/resources/tvdivq0000003toh-att/shitteimasuka.pdf',pages:64,desc:'从市场结构到股票、衍生品、清算结算、系统与自主监管，学习交易所的完整作用。'},
 nisa:{name:'金融厅 · NISA 官方说明',url:'https://www.fsa.go.jp/policy/nisa2/know/index.html'},
 ideco:{name:'iDeCo 官方说明',url:'https://www.ideco-koushiki.jp/guide/'},
 deposit:{name:'金融厅 · 存款保护说明',url:'https://www.fsa.go.jp/policy/payoff/index.html'},
 trading:{name:'JPX · 现货股票交易规则',url:'https://www.jpx.co.jp/equities/trading/domestic/04.html'},
 nikkei:{name:'日经指数 · 日经平均股价',url:'https://indexes.nikkei.co.jp/nkave/index/profile?idx=nk225'},
 topix:{name:'JPX · TOPIX 指数说明',url:'https://www.jpx.co.jp/markets/indices/topix/index.html'}
};
const storageKey='language-study-jp-investment-v1';
const allowedTabs=['read','grammar','terms','quiz','sources'];
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ruby=s=>escapeHTML(s).replace(/\{([^{}|]+)\|([^{}]+)\}/g,'<ruby>$1<rp>（</rp><rt>$2</rt><rp>）</rp></ruby>');
const plain=s=>String(s??'').replace(/\{([^{}|]+)\|([^{}]+)\}/g,'$1');
function normalize(s){return String(s??'').normalize('NFKC').trim().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s。、,.!?！？「」『』・]/g,'').toLowerCase()}
function defaultState(){return {version:1,lesson:lessons[0].id,tab:'read',ruby:true,zh:true,completed:[],answers:{},drafts:{},checks:{}}}
function sanitizeState(input){
 const s=defaultState(); if(!input||typeof input!=='object'||Array.isArray(input))return s;
 const ids=new Set(lessons.map(l=>l.id));
 if(ids.has(input.lesson))s.lesson=input.lesson;if(allowedTabs.includes(input.tab))s.tab=input.tab;
 if(typeof input.ruby==='boolean')s.ruby=input.ruby;if(typeof input.zh==='boolean')s.zh=input.zh;
 s.completed=Array.isArray(input.completed)?[...new Set(input.completed.filter(id=>ids.has(id)))]:[];
 for(const lesson of lessons){const id=lesson.id;const draft=input.drafts?.[id];if(typeof draft==='string')s.drafts[id]=draft.slice(0,10000);
  if(Array.isArray(input.checks?.[id]))s.checks[id]=input.checks[id].filter(n=>Number.isInteger(n)&&n>=0&&n<(lesson.writing?.checks?.length??0));
  const saved=input.answers?.[id];if(!saved||typeof saved!=='object')continue;s.answers[id]={};
  lesson.questions.forEach((q,i)=>{const a=saved[i];if(!a||typeof a!=='object')return;let value=a.value;
   if(q.type==='choice'){if(!Number.isInteger(value)||value<0||value>=q.options.length)return}else{if(typeof value!=='string')return;value=value.slice(0,1000)}
   s.answers[id][i]={value,checked:a.checked===true};
  });
 } return s;
}
let storageAvailable=true,state;
try{state=sanitizeState(JSON.parse(localStorage.getItem(storageKey)||'null'))}catch(e){state=defaultState();storageAvailable=false}
let overview=false,toastTimer;
const current=()=>lessons.find(l=>l.id===state.lesson)||lessons[0];
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));storageAvailable=true}catch(e){storageAvailable=false}updateStorageNote()}
function updateStorageNote(){ $('storage-note').textContent=storageAvailable?'进度保存在当前浏览器；换设备或清理数据前，可先备份进度。':'浏览器未能保存进度，本次操作只保留在当前页面。请使用「备份进度」导出。'}
function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,4000)}
function sourceURL(key,page,url){const base=url||sourceInfo[key]?.url;if(!base||!/^https:\/\//.test(base))return '';return base+(page?'#page='+page:'')}
function sourceLink(key,page,label,url){const target=sourceURL(key,page,url);return target?`<a class="source-inline" href="${escapeHTML(target)}" target="_blank" rel="noopener noreferrer">${escapeHTML(label||('原教材 · PDF第'+page+'页'))} ↗</a>`:''}
function applyPreferences(){document.body.classList.toggle('hide-ruby',!state.ruby);document.body.classList.toggle('hide-zh',!state.zh);$('ruby-toggle').checked=state.ruby;$('zh-toggle').checked=state.zh}
function renderNavigation(){
 const search=normalize($('course-search').value);let group='';let html='';
 lessons.forEach((l,i)=>{if(search&&!normalize([l.title,l.titleJa,l.summary,...l.coverage,...l.terms.map(t=>t.ja)].join(' ')).includes(search))return;
  if(group!==l.module){group=l.module;html+=`<div class="module-name">${escapeHTML(group)}</div>`}
  html+=`<button type="button" class="lesson-link" data-lesson="${escapeHTML(l.id)}" ${!overview&&l.id===state.lesson?'aria-current="page"':''}><span class="lesson-num">${String(i+1).padStart(2,'0')}</span><span>${escapeHTML(l.title)}</span><span class="done-mark" aria-label="${state.completed.includes(l.id)?'已学完':'未标记学完'}">${state.completed.includes(l.id)?'✓':''}</span></button>`;
 });$('course-list').innerHTML=html||'<p class="empty small">没有匹配课程，请换个关键词。</p>';
 $('progress-text').textContent=state.completed.length+' / '+lessons.length+' 节';const percent=Math.round(state.completed.length/lessons.length*100);$('progress-bar').style.width=percent+'%';document.querySelector('.progress-track').setAttribute('aria-valuenow',percent);
}
function renderHero(){const l=current(),index=lessons.indexOf(l)+1;$('breadcrumb').textContent='投资日语 / '+l.module+' / 第'+String(index).padStart(2,'0')+'节';
 $('lesson-hero').innerHTML=`<div class="hero"><div class="hero-meta"><span class="eyebrow">LESSON ${String(index).padStart(2,'0')} / ${lessons.length}</span><span class="pill">${escapeHTML(l.module)}</span><span class="small muted">约 ${l.minutes} 分钟</span></div><h1 lang="ja">${escapeHTML(l.titleJa)}</h1><p class="zh-title">${escapeHTML(l.title)}</p><p class="summary">${escapeHTML(l.summary)}</p><div class="objectives">${l.objectives.map(o=>`<span>${escapeHTML(o)}</span>`).join('')}</div></div>`;
}
function notesHTML(l){return l.notes?.length?`<aside class="callout" aria-label="阅读提示">${l.notes.map(n=>`<p>${escapeHTML(n)}</p>`).join('')}</aside>`:''}
function footerHTML(){const l=current(),i=lessons.indexOf(l),done=state.completed.includes(l.id);return `<div><button type="button" data-move="-1" ${i===0?'disabled':''}>← 上一节</button><button type="button" data-move="1" ${i===lessons.length-1?'disabled':''}>下一节 →</button></div><button type="button" class="${done?'':'primary'}" id="complete-button" aria-pressed="${done}">${done?'✓ 已标记学完 · 点击撤销':'标记本节学完'}</button>`}
function renderReading(l){return `<div class="intro-line"><span>先读日文，再核对中文。右上角可隐藏读音或译文。</span><span>${l.sentences.length} 段精读</span></div>`+l.sentences.map((s,i)=>`<article class="sentence"><div class="sentence-top"><span class="type">${String(i+1).padStart(2,'0')} / ${escapeHTML(s.kind)}</span>${sourceLink(s.sourceKey||l.sources[0]?.key,s.page)}</div><p class="jp" lang="ja">${ruby(s.jp)}</p><p class="zh-line">${escapeHTML(s.zh)}</p><p class="sentence-note">${escapeHTML(s.note)}</p></article>`).join('')+(l.id==='fsa-02'?calculatorHTML():'')+notesHTML(l)+`<div class="panel-foot"><span class="small muted">读完后，用句型把意思重新说一遍。</span><button type="button" data-tab="grammar">学习句型 →</button></div>`}
function renderGrammar(l){return `<div class="intro-line"><span>把长句拆成可以复用的表达。</span></div><div class="grammar-list">`+l.grammar.map(g=>`<article class="grammar-card"><h3 lang="ja">${ruby(g.pattern)}</h3><p>${escapeHTML(g.explain)}</p><p class="jp" lang="ja">${ruby(g.example)}</p><p class="zh-line muted">${escapeHTML(g.zh)}</p></article>`).join('')+'</div><div class="panel-foot"><span class="small muted">试着替换句子中的一个词。</span><button type="button" data-tab="terms">复习术语 →</button></div>'}
function renderTerms(l){return `<div class="vocab-tools"><label class="sr" for="term-search">搜索本节术语</label><input id="term-search" type="search" placeholder="查日语、读音或中文"><button type="button" id="expand-terms">展开全部释义</button></div><p class="small muted">先回忆，再点开卡片核对。共 ${l.terms.length} 个术语。</p><div class="vocab-grid" id="vocab-grid">${termsHTML(l.terms)}</div><div class="panel-foot"><span></span><button type="button" data-tab="quiz">开始自测 →</button></div>`}
function termsHTML(terms){return terms.length?terms.map(t=>`<details class="vocab-card"><summary><span><span class="term-ja" lang="ja">${escapeHTML(t.ja)}</span><span class="reading-kana" lang="ja">${escapeHTML(t.kana)}</span></span></summary><p>${escapeHTML(t.zh)}</p></details>`).join(''):'<p class="empty">未找到匹配术语。</p>'}
function answerFor(i){return state.answers[state.lesson]?.[i]}
function isCorrect(q,value){return q.type==='choice'?value===q.answer:q.answers.some(a=>normalize(a)===normalize(value))}
function feedbackHTML(q,a){if(!a?.checked)return '';const correct=isCorrect(q,a.value);return `<strong>${correct?'回答正确。':'再看一下。'}</strong> ${escapeHTML(q.explain)}`}
function quizStatus(l){const a=state.answers[l.id]||{};const checked=l.questions.filter((q,i)=>a[i]?.checked).length;const correct=l.questions.filter((q,i)=>a[i]?.checked&&isCorrect(q,a[i].value)).length;return '已检查 '+checked+' / '+l.questions.length+' 题 · 答对 '+correct+' 题'}
function renderQuiz(l){let html=`<p class="quiz-intro">${l.questions.length} 道题即时反馈；末尾的日语表达题按参考句自行核对。<br><span class="quiz-status" id="quiz-status">${quizStatus(l)}</span></p>`;
 l.questions.forEach((q,i)=>{const a=answerFor(i);html+=`<fieldset class="question" data-question="${i}"><legend><span class="q-num">QUESTION ${String(i+1).padStart(2,'0')}</span>${ruby(q.prompt)}</legend><div class="question-body">`;
  if(q.type==='choice'){html+=q.options.map((o,j)=>`<label class="choice"><input type="radio" name="q-${i}" value="${j}" ${a?.value===j?'checked':''}><span>${ruby(o)}</span></label>`).join('')}else{html+=`<label class="sr" for="answer-${i}">第${i+1}题答案</label><input class="answer-field" id="answer-${i}" name="q-${i}" type="text" autocomplete="off" value="${escapeHTML(a?.value??'')}" placeholder="输入答案">`}
  html+=`<div class="answer-row"><button type="button" data-check="${i}">检查答案</button></div><div class="feedback ${a?.checked&&!isCorrect(q,a.value)?'bad':''}" id="feedback-${i}" role="status" ${a?.checked?'':'hidden'}>${feedbackHTML(q,a)}</div></div></fieldset>`;
 });
 if(l.writing)html+=`<section class="writing"><h3>用日语写一句</h3><label for="writing-draft">${escapeHTML(l.writing.prompt)}</label><textarea id="writing-draft" placeholder="在这里试写，内容会保存在当前浏览器。">${escapeHTML(state.drafts[l.id]||'')}</textarea><details id="writing-reference"><summary>查看参考表达与自查要点</summary><p class="jp" lang="ja">${ruby(l.writing.reference)}</p><p class="zh-line">${escapeHTML(l.writing.zh)}</p><p class="small muted">参考句不是唯一答案。此题由你自查，不做自动评分。</p><div class="checklist">${l.writing.checks.map((c,i)=>`<label><input type="checkbox" data-writing-check="${i}" ${(state.checks[l.id]||[]).includes(i)?'checked':''}>${escapeHTML(c)}</label>`).join('')}</div></details></section>`;
 return html;
}
function sourceEntry(s){const data=sourceInfo[s.key]||{};return `<div class="source-card"><h3>${escapeHTML(data.name||s.label||s.key)}</h3><p>${escapeHTML(s.label||'')}</p>${s.pages?.length?s.pages.map(p=>sourceLink(s.key,p,'PDF第'+p+'页',s.url)).join(' · '):sourceLink(s.key,null,'官方资料',s.url)}</div>`}
function renderSources(l){return `<h2>本节与原教材的对应</h2><p class="small muted">以下页码均为 PDF 阅读器中的页序，包含封面。打开原文需要联网。</p>`+l.sources.map(sourceEntry).join('')+`<h3 style="margin-top:26px">本节覆盖的主题</h3><ul class="small">${l.coverage.map(c=>`<li>${escapeHTML(c)}</li>`).join('')}</ul><p class="small muted">日中对照、词汇说明、例句与练习为本课程编写；只有明确标注「原文摘句」的短句来自原教材。来源中的历史数据不代表当前市场。</p><button type="button" id="source-overview">查看全部教材与覆盖表</button>`}
function renderPanel(){const l=current();$('lesson-panel').innerHTML=({read:renderReading,grammar:renderGrammar,terms:renderTerms,quiz:renderQuiz,sources:renderSources}[state.tab])(l);$('lesson-panel').setAttribute('aria-labelledby','tab-'+state.tab);$('lesson-panel').removeAttribute('aria-label');
 document.querySelectorAll('#tabs [role=tab]').forEach(b=>{const active=b.dataset.tab===state.tab;b.setAttribute('aria-selected',active);b.tabIndex=active?0:-1});$('lesson-footer').innerHTML=footerHTML();if(l.id==='fsa-02'&&state.tab==='read')updateCalculator();
}
function render(){applyPreferences();renderNavigation();$('tabs').hidden=false;$('lesson-footer').hidden=false;renderHero();renderPanel();updateStorageNote()}
function closeMenu(){document.querySelector('.sidebar').classList.remove('menu-open');$('menu-button').setAttribute('aria-expanded','false')}
function selectLesson(id,tab='read'){if(!lessons.some(l=>l.id===id))return;state.lesson=id;state.tab=allowedTabs.includes(tab)?tab:'read';overview=false;save();render();closeMenu();try{history.replaceState(null,'','#'+id)}catch(e){}window.scrollTo({top:0,behavior:'instant'});$('main').focus({preventScroll:true})}
function selectTab(tab){if(!allowedTabs.includes(tab))return;overview=false;state.tab=tab;save();renderPanel()}
function renderOverview(){overview=true;renderNavigation();closeMenu();$('breadcrumb').textContent='投资日语 / 教材与课程总览';$('tabs').hidden=true;$('lesson-footer').hidden=true;
 const termCount=lessons.reduce((n,l)=>n+l.terms.length,0),sentenceCount=lessons.reduce((n,l)=>n+l.sentences.length,0),questionCount=lessons.reduce((n,l)=>n+l.questions.length,0);
 $('lesson-hero').innerHTML=`<div class="hero"><p class="eyebrow">READ · UNDERSTAND · PRACTICE</p><h1 lang="ja">お金の知識を、日本語で。</h1><p class="zh-title">把投资知识，读成自己的日语</p><p class="summary">覆盖金融厅第4章和两份东证教材的全部实质主题。按概念重新分课，用原创学习例句练习阅读，并随时回到原教材。</p><div class="overview-stat"><div><strong>${lessons.length}</strong><span>完整课程</span></div><div><strong>${sentenceCount}</strong><span>日中对照段落</span></div><div><strong>${termCount}</strong><span>课内术语条目</span></div><div><strong>${questionCount}</strong><span>即时反馈练习</span></div></div><button type="button" class="primary" data-lesson="${escapeHTML(state.lesson)}">继续当前课程 →</button></div>`;
 $('lesson-panel').removeAttribute('aria-labelledby');$('lesson-panel').setAttribute('aria-label','教材与课程总览');
 $('lesson-panel').innerHTML=`<h2>三份教材，一条阅读路线</h2><p class="small muted">课程整理日期：2026年10月12日。每节含精读、句型、术语、自测与表达练习；无需按顺序解锁。</p>`+['fsa','abc','role'].map(k=>`<article class="source-card"><h3>${escapeHTML(sourceInfo[k].name)}</h3><p>${escapeHTML(sourceInfo[k].desc)} 全文 ${sourceInfo[k].pages} 页。</p>${sourceLink(k,null,'打开官方教材')}</article>`).join('')+`<div class="callout"><p><strong>怎样使用：</strong>先开着读音精读，再隐藏中文复述；用术语卡回忆含义，最后完成自测。页码对应表用于回查原文，不是逐页全文翻译。</p><p>教材链接需联网；课程正文、卡片、自测和复利演示均可离线使用。进度按浏览器保存，备份文件可在另一设备恢复。</p></div><h2>教材主题覆盖表</h2><div class="table-wrap"><table><thead><tr><th>课程</th><th>覆盖主题</th><th>原教材 PDF 页码</th></tr></thead><tbody>${lessons.map((l,i)=>`<tr><td><button type="button" class="text-link" data-lesson="${escapeHTML(l.id)}">${String(i+1).padStart(2,'0')} ${escapeHTML(l.title)}</button><small>${escapeHTML(l.module)}</small></td><td>${l.coverage.map(escapeHTML).join('<br>')}</td><td>${l.sources.map(s=>`${escapeHTML(s.key.toUpperCase())} ${(s.pages||[]).map(p=>sourceLink(s.key,p,String(p),s.url)).join(' / ')}`).join('<br>')}</td></tr>`).join('')}</tbody></table></div><h2>出处与使用说明</h2><p class="small">金融厅网站通常依照公共数据利用规约提供内容，使用时须标注出处和修改；第三方素材单独适用权利条件。东证教材免费公开，但不等同于开放许可。本课程采用少量标明出处的短引文，配合独立编写的日中例句、解释和练习，不复制原书插图或完整章节。</p><p class="small">${sourceLink('fsa',null,'金融厅利用规则','https://www.fsa.go.jp/rules/index.html')} · ${sourceLink('role',null,'JPX 使用说明','https://www.jpx.co.jp/term-of-use.html')}</p><p class="small muted">NISA、iDeCo、存款保护及交易规则以链接中的现行官方说明为准；课程不把源书中的旧数值当作当前标准。示例金额和收益率均用于练习，不构成收益预测。</p><div class="source-card"><h3>制度与市场规则的补充来源</h3>${['nisa','ideco','deposit','trading','topix','nikkei'].map(k=>`<p>${sourceLink(k,null,sourceInfo[k].name)}</p>`).join('')}</div>`;window.scrollTo({top:0,behavior:'instant'});$('main').focus({preventScroll:true});
}
function calculatorHTML(){return `<section class="calculator" aria-labelledby="calc-title"><h3 id="calc-title">动一动数字，理解单利与复利</h3><p>假定年利率固定、每年计息一次，不追加本金，未计税费与通胀。这里是数学演示。</p><div class="calc-fields"><label for="principal">元本 · 本金（日元）<input type="number" id="principal" min="0" max="1000000000" step="1" value="100000"></label><label for="rate">年利率（%）<input type="number" id="rate" min="0" max="20" step="0.1" value="5"></label><label for="years">期間 · 年数<input type="number" id="years" min="1" max="60" step="1" value="10"></label></div><p class="calc-error" id="calc-error" role="status" hidden></p><div class="calc-result" aria-live="polite"><div><span>単利 · 期末金额</span><strong id="simple-value"></strong></div><div><span>複利 · 期末金额</span><strong id="compound-value"></strong></div><div><span>复利与单利之差</span><strong id="difference-value"></strong></div></div><svg class="chart" id="growth-chart" viewBox="0 0 620 240" role="img" aria-label="单利与复利的期末金额随年数变化"></svg><div class="calc-legend"><span><i class="swatch"></i>复利</span><span><i class="swatch simple"></i>单利</span></div><p class="formula">单利：本金 × (1 + 年利率 × 年数)<br>复利：本金 × (1 + 年利率)<sup>年数</sup>。计算时把 5% 换成 0.05。</p></section>`}
function calculateGrowth(principal,rate,years){return {simple:principal*(1+rate*years),compound:principal*Math.pow(1+rate,years)}}
function updateCalculator(){
 if(!$('principal'))return;
 const fields=['principal','rate','years'].map($),valid=fields.every(f=>f.value!==''&&Number.isFinite(Number(f.value))&&f.checkValidity());
 $('calc-error').hidden=valid;$('growth-chart').toggleAttribute('hidden',!valid);
 if(!valid){$('calc-error').textContent='请输入范围内的数字：本金 0–10亿日元，年利率 0–20%，年数 1–60（整数）。';['simple-value','compound-value','difference-value'].forEach(id=>$(id).textContent='—');return}
 const p=Number($('principal').value),r=Number($('rate').value)/100,n=Number($('years').value),amount=calculateGrowth(p,r,n),fmt=v=>Math.round(v).toLocaleString('zh-CN')+' 円';
 $('simple-value').textContent=fmt(amount.simple);$('compound-value').textContent=fmt(amount.compound);$('difference-value').textContent=fmt(amount.compound-amount.simple);
 const width=Math.max(270,Math.round($('growth-chart').getBoundingClientRect().width)),height=240,left=65,right=15,top=22,bottom=43,max=Math.max(10000,amount.compound*1.1),x=t=>left+t/n*(width-left-right),y=v=>height-bottom-v/max*(height-top-bottom);
 $('growth-chart').setAttribute('viewBox','0 0 '+width+' '+height);
 let chart='<title>单利与复利比较</title><desc>本金'+p+'日元，年利率'+r*100+'%，'+n+'年。单利期末'+Math.round(amount.simple)+'日元；复利期末'+Math.round(amount.compound)+'日元。</desc>';
 for(let i=0;i<=4;i++){const v=max*i/4;chart+=`<line x1="${left}" y1="${y(v)}" x2="${width-right}" y2="${y(v)}" stroke="#cad5c8" stroke-width="1"/><text x="${left-10}" y="${y(v)+4}" text-anchor="end">${v>=1e8?(v/1e8).toFixed(1)+'亿':(v/1e4).toFixed(v===0?0:1)+'万'}</text>`}
 const ticks=[...new Set([0,Math.round(n/2),n])];ticks.forEach(t=>chart+=`<text x="${x(t)}" y="${height-bottom+23}" text-anchor="middle">${t}</text>`);chart+=`<text x="9" y="14">日元</text><text x="${width-right}" y="232" text-anchor="end">年数</text>`;
 for(const type of ['simple','compound']){let d='';for(let t=0;t<=n;t++){const v=calculateGrowth(p,r,t)[type];d+=(t?' L':'M')+x(t).toFixed(2)+','+y(v).toFixed(2)}chart+=`<path d="${d}" fill="none" stroke="${type==='simple'?'#996221':'#265c4d'}" stroke-width="2.5" ${type==='simple'?'stroke-dasharray="6 4"':''}/>`}
 $('growth-chart').innerHTML=chart;
}
window.addEventListener('resize',()=>{if(!overview&&state.tab==='read'&&state.lesson==='fsa-02')updateCalculator()});

function storeAnswer(i,value){state.answers[state.lesson]??={};state.answers[state.lesson][i]={value,checked:false};save()}
function checkAnswer(i){const l=current(),q=l.questions[i],field=document.querySelector('[data-question="'+i+'"]');let value;if(q.type==='choice'){const chosen=field.querySelector('input:checked');if(!chosen){notify('先选择一个答案。');return}value=Number(chosen.value)}else{value=field.querySelector('input[type=text]').value;if(!normalize(value)){notify('先输入答案。');return}}state.answers[l.id]??={};const a=state.answers[l.id][i]={value,checked:true};save();const feedback=$('feedback-'+i);feedback.innerHTML=feedbackHTML(q,a);feedback.classList.toggle('bad',!isCorrect(q,value));feedback.hidden=false;$('quiz-status').textContent=quizStatus(l)}
document.addEventListener('click',e=>{
 const lessonButton=e.target.closest('[data-lesson]');if(lessonButton){selectLesson(lessonButton.dataset.lesson);return}
 const tab=e.target.closest('[data-tab]');if(tab){selectTab(tab.dataset.tab);return}
 const move=e.target.closest('[data-move]');if(move&&!move.disabled){selectLesson(lessons[lessons.indexOf(current())+Number(move.dataset.move)]?.id);return}
 const check=e.target.closest('[data-check]');if(check){checkAnswer(Number(check.dataset.check));return}
 if(e.target.closest('#complete-button')){const id=state.lesson;if(state.completed.includes(id)){state.completed=state.completed.filter(x=>x!==id);notify('已撤销本节完成标记。')}else{state.completed.push(id);notify('已标记本节学完。')}save();renderNavigation();$('lesson-footer').innerHTML=footerHTML();return}
 if(e.target.closest('#expand-terms')){const cards=[...document.querySelectorAll('.vocab-card')],open=cards.some(c=>!c.open);cards.forEach(c=>c.open=open);$('expand-terms').textContent=open?'收起全部释义':'展开全部释义'}
 if(e.target.closest('#source-overview'))renderOverview();
});
document.addEventListener('input',e=>{
 if(e.target.id==='term-search'){$('vocab-grid').innerHTML=termsHTML(current().terms.filter(t=>normalize(t.ja+t.kana+t.zh).includes(normalize(e.target.value))));$('expand-terms').textContent='展开全部释义'}
 if(e.target.id==='writing-draft'){state.drafts[state.lesson]=e.target.value;save()}
 if(['principal','rate','years'].includes(e.target.id))updateCalculator();
 const field=e.target.closest('[data-question]');if(field){const i=Number(field.dataset.question);storeAnswer(i,e.target.type==='radio'?Number(e.target.value):e.target.value);$('feedback-'+i).hidden=true;$('quiz-status').textContent=quizStatus(current())}
});
document.addEventListener('change',e=>{if(e.target.matches('[data-writing-check]')){const index=Number(e.target.dataset.writingCheck),checks=new Set(state.checks[state.lesson]||[]);e.target.checked?checks.add(index):checks.delete(index);state.checks[state.lesson]=[...checks];save()}});
$('course-search').addEventListener('input',renderNavigation);
$('ruby-toggle').addEventListener('change',e=>{state.ruby=e.target.checked;applyPreferences();save()});$('zh-toggle').addEventListener('change',e=>{state.zh=e.target.checked;applyPreferences();save()});
$('menu-button').addEventListener('click',()=>{const open=document.querySelector('.sidebar').classList.toggle('menu-open');$('menu-button').setAttribute('aria-expanded',open)});
$('overview-button').addEventListener('click',renderOverview);
$('tabs').addEventListener('keydown',e=>{const tabs=[...$('tabs').querySelectorAll('[role=tab]')],index=tabs.indexOf(document.activeElement);let next;if(e.key==='ArrowRight')next=(index+1)%tabs.length;if(e.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;if(e.key==='Home')next=0;if(e.key==='End')next=tabs.length-1;if(next!==undefined){e.preventDefault();selectTab(tabs[next].dataset.tab);tabs[next].focus()}});
$('export-button').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({kind:'jp-investment-course-progress',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='japanese-investment-progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出进度备份。')});
$('import-button').addEventListener('click',()=>$('import-file').click());
$('import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('备份文件过大');const data=JSON.parse(await file.text());if(data.kind!=='jp-investment-course-progress'||!data.state||data.state.version!==1)throw Error('不是本课程支持的进度备份');if(!confirm('恢复备份会替换当前浏览器的课程进度。继续吗？'))return;state=sanitizeState(data.state);overview=false;save();render();try{history.replaceState(null,'','#'+state.lesson)}catch(e){}notify('已恢复进度。')}catch(error){notify('恢复失败：'+error.message)}finally{e.target.value=''}});
try{const id=decodeURIComponent(location.hash.slice(1));if(lessons.some(l=>l.id===id))state.lesson=id}catch(e){}
render();
</script>
</body>
</html>
