<a class="skip" href="#main">跳到课程内容</a>
<div class="layout" id="app">
<aside class="sidebar" aria-label="课程导航">
 <div class="brand"><div class="seal" aria-hidden="true">読</div><div><strong>投資の日本語</strong><small>日中对照 · 投资阅读课</small></div></div>
 <button type="button" class="mobile-menu" id="menu-button" aria-expanded="false" aria-controls="sidebar-body">课程目录</button>
 <div class="sidebar-body" id="sidebar-body">
  <div class="progress-head"><span>我的学习进度</span><span id="progress-text">0 / 0</span></div>
  <div class="progress-track" role="progressbar" aria-label="课程完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-bar" style="width:0%"></span></div>
  <div class="search-wrap"><label class="sr" for="course-search">搜索课程</label><input id="course-search" type="search" placeholder="查找课程或主题" autocomplete="off"></div>
  <nav class="course-list" id="course-list" aria-label="全部课程"></nav>
 </div>
 <div class="sidebar-foot"><button type="button" id="overview-button">教材与课程总览</button><button type="button" id="export-button">备份进度</button><button type="button" id="import-button">恢复进度</button><input type="file" id="import-file" accept="application/json,.json" hidden></div>
</aside>
<div class="shell">
 <header class="topbar"><span class="breadcrumb" id="breadcrumb"></span><div class="preferences"><label><input type="checkbox" id="ruby-toggle" checked>假名读音</label><label><input type="checkbox" id="zh-toggle" checked>中文对照</label></div></header>
 <main class="content" id="main" tabindex="-1">
  <div id="lesson-hero"></div>
  <div class="tabbar" role="tablist" aria-label="本节学习步骤" id="tabs">
   <button type="button" id="tab-read" role="tab" data-tab="read" aria-controls="lesson-panel" aria-selected="true">01 精读</button>
   <button type="button" id="tab-grammar" role="tab" data-tab="grammar" aria-controls="lesson-panel" aria-selected="false" tabindex="-1">02 句型</button>
   <button type="button" id="tab-terms" role="tab" data-tab="terms" aria-controls="lesson-panel" aria-selected="false" tabindex="-1">03 术语卡</button>
   <button type="button" id="tab-quiz" role="tab" data-tab="quiz" aria-controls="lesson-panel" aria-selected="false" tabindex="-1">04 自测</button>
   <button type="button" id="tab-sources" role="tab" data-tab="sources" aria-controls="lesson-panel" aria-selected="false" tabindex="-1">教材页码</button>
  </div>
  <section id="lesson-panel" role="tabpanel" aria-labelledby="tab-read" tabindex="0"></section>
  <footer id="lesson-footer" class="lesson-footer"></footer>
  <p class="storage-note" id="storage-note">进度保存在当前浏览器；换设备或清理数据前，可先备份进度。</p>
 </main>
</div>
</div>

<script id="course-data" type="application/json">[{"id":"fsa-01","module":"资产形成","title":"从家庭收支到资产形成","titleJa":"家計から考える資産形成","summary":"从家庭收支出发，先理解储蓄的目的，再用收益性、安全性和流动性比较金融产品。","minutes":20,"sources":[{"key":"fsa","pages":[2,7],"label":"4-1 / 4-6"}],"objectives":["读懂家计管理与储蓄的基本表达","分清金额增长与购买力变化","用三项标准说明产品的取舍"],"sentences":[{"jp":"まずは{家計管理|かけいかんり}をしっかり{行|おこな}い、{貯蓄|ちょちく}しましょう","zh":"首先，认真做好家庭收支管理，并进行储蓄吧。","kind":"原文摘句","note":"「行い」是「行う」的连用形，连接后面的动作；「～ましょう」表示建议。这是本课保留的教材短原句。","sourceKey":"fsa","page":2},{"jp":"{将来|しょうらい}の{支出|ししゅつ}に{備|そな}えるために、{目的|もくてき}と{必要|ひつよう}な{金額|きんがく}を{考|かんが}えます。","zh":"为未来的支出作准备，需要考虑用途和所需金额。","kind":"学习例句","note":"资产形成先明确何时、为何用钱；「～に備える」表示为某事作准备。","sourceKey":"fsa","page":2},{"jp":"{物価|ぶっか}が{上|あ}がると、{同|おな}じ{金額|きんがく}で{買|か}えるものが{少|すく}なくなることがあります。","zh":"物价上涨时，同样金额可以买到的东西可能变少。","kind":"学习例句","note":"名义金额不变，并不表示购买力不变；「～ことがある」表达可能出现的情况。","sourceKey":"fsa","page":2},{"jp":"{金融商品|きんゆうしょうひん}を{選|えら}ぶときは、{収益性|しゅうえきせい}・{安全性|あんぜんせい}・{流動性|りゅうどうせい}を{比|くら}べます。","zh":"选择金融产品时，要比较收益性、安全性和流动性。","kind":"学习例句","note":"收益性关注获利潜力，安全性关注本金损失的可能，流动性关注取出或变现的容易程度。","sourceKey":"fsa","page":7},{"jp":"すぐに{使|つか}うお{金|かね}は、{必要|ひつよう}なときに{引|ひ}き{出|だ}せるかどうかが{大切|たいせつ}です。","zh":"很快就要使用的钱，关键在于需要时能否取出。","kind":"学习例句","note":"没有一种产品在三个方面都完全理想；不同用途需要不同取舍。","sourceKey":"fsa","page":7}],"grammar":[{"pattern":"～ときは","explain":"表示“做某事时”；前接动词原形，可用于介绍一般规则。","example":"{金融商品|きんゆうしょうひん}を{選|えら}ぶときは、{手数料|てすうりょう}も{確認|かくにん}します。","zh":"选择金融产品时，也查看手续费。"},{"pattern":"～かどうか","explain":"把“是否……”嵌入句子，常与確認する、調べる搭配。","example":"{必要|ひつよう}なときに{売|う}れるかどうかを{確認|かくにん}します。","zh":"确认需要时是否能够卖出。"}],"terms":[{"ja":"家計管理","kana":"かけいかんり","zh":"家庭收入、支出和结余的管理"},{"ja":"貯蓄","kana":"ちょちく","zh":"储蓄；积存资金"},{"ja":"資産形成","kana":"しさんけいせい","zh":"为未来生活逐步积累资产"},{"ja":"物価","kana":"ぶっか","zh":"商品和服务的价格水平"},{"ja":"金融商品","kana":"きんゆうしょうひん","zh":"存款、股票、债券、基金等金融产品"},{"ja":"収益性","kana":"しゅうえきせい","zh":"获得收益的潜力"},{"ja":"安全性","kana":"あんぜんせい","zh":"本金损失可能性的高低"},{"ja":"流動性","kana":"りゅうどうせい","zh":"取款或变现的容易程度"},{"ja":"元本","kana":"がんぽん","zh":"最初投入或存入的本金"},{"ja":"引き出す","kana":"ひきだす","zh":"取出账户中的资金"}],"questions":[{"type":"text","prompt":"「貯蓄」的平假名读音是什么？","answers":["ちょちく"],"explain":"「貯」读ちょ，「蓄」读ちく。"},{"type":"choice","prompt":"下个月就要交学费，比较产品时尤其需要考虑哪一点？","options":["多年后的最高预期收益","需要时能否取出资金","产品名称是否流行"],"answer":1,"explain":"支出日期很近，应重视可用性和本金风险；只比较预期收益不足以作决定。"},{"type":"choice","prompt":"物价上涨，而账户金额没有变化，哪一种理解正确？","options":["购买力可能下降","购买力一定上升","购买力不可能变化"],"answer":0,"explain":"相同金额可能买到更少商品，这属于实际购买力变化。"},{"type":"text","prompt":"“流动性”的日语写作什么？请填汉字。","answers":["流動性"],"explain":"流動性＝りゅうどうせい，关注资金取出或变现的容易程度。"}],"writing":{"prompt":"用「～ときは」写一句话，说明选择金融产品时要确认什么。","reference":"{金融商品|きんゆうしょうひん}を{選|えら}ぶときは、{流動性|りゅうどうせい}を{確認|かくにん}します。","zh":"选择金融产品时，确认流动性。","checks":["是否使用「动词原形＋ときは」","是否用「を」标记确认的对象","是否提出了明确的比较标准"]},"notes":["本课是语言与概念学习。教材中的“超低利率”属于制作时的背景；本课不把它当作当前利率判断。"],"coverage":["4-1：资产形成的目的、家计管理、储蓄与通货膨胀","4-6：收益性、安全性、流动性与本金"]},{"id":"fsa-02","module":"资产形成","title":"利息、复利与时间","titleJa":"利子・複利・金利の推移","summary":"分清利息金额与利率，练习单利、复利和 72 法则，同时学会把历史利率与当前信息分开。","minutes":20,"sources":[{"key":"fsa","pages":[3,4,5,6],"label":"4-2 / 4-3 / 4-4 / 4-5"}],"objectives":["分清利子、金利和元本","用一个简单例子解释复利","识别 72 法则和历史图表的适用范围"],"sentences":[{"jp":"{利子|りし}はお{金|かね}を{貸|か}したり{預|あず}けたりして{受|う}け{取|と}る{金額|きんがく}で、{金利|きんり}は{元本|がんぽん}に{対|たい}する{利子|りし}の{割合|わりあい}です。","zh":"利息是出借或存入资金后收到的金额；利率是利息相对于本金的比例。","kind":"学习例句","note":"例如本金 10 万日元、年利率 3%，一年利息为 3,000 日元；此处只是计算假设，未计税费。","sourceKey":"fsa","page":3},{"jp":"ほかの{条件|じょうけん}が{同|おな}じなら、お{金|かね}を{預|あず}けるときは{高|たか}い{金利|きんり}が、お{金|かね}を{借|か}りるときは{低|ひく}い{金利|きんり}が{有利|ゆうり}です。","zh":"其他条件相同，存钱时较高利率有利，借钱时较低利率有利。","kind":"学习例句","note":"「なら」引出前提；比较时还要看期限、费用和产品条件。","sourceKey":"fsa","page":3},{"jp":"{単利|たんり}では{元本|がんぽん}だけに{利子|りし}がつき、{複利|ふくり}では{受|う}け{取|と}った{利子|りし}も{運用|うんよう}します。","zh":"单利只对本金计息；复利把收到的利息也继续运用。","kind":"学习例句","note":"10 万日元按年利率 3% 持有两年：单利 106,000 日元，按年复利 106,090 日元。计算假定利率不变、收益再投入、没有税费。","sourceKey":"fsa","page":4},{"jp":"{年利|ねんり}が6％で{一定|いってい}なら、72を6で{割|わ}ると、{元本|がんぽん}が{約|やく}12{年|ねん}で2{倍|ばい}になる{目安|めやす}が{得|え}られます。","zh":"若年利率恒为 6%，72 除以 6，得到本金约 12 年翻倍的估计。","kind":"学习例句","note":"72 法则是复利条件下的近似心算方法；不是对投资收益的承诺，在非常低或高的利率下误差可能更明显。","sourceKey":"fsa","page":5},{"jp":"{過去|かこ}の{金利|きんり}のグラフを{読|よ}むときは、{対象期間|たいしょうきかん}と{金利|きんり}の{種類|しゅるい}を{確認|かくにん}します。","zh":"读历史利率图时，要确认数据的时期与利率种类。","kind":"学习例句","note":"原图 1995 年 6 月以前与之后使用的指标不同；原教材写的“现在几乎为零”不能直接用于今天。","sourceKey":"fsa","page":6}],"grammar":[{"pattern":"～なら","explain":"表示在某种前提成立时；做计算题时必须说明假设。","example":"{年利|ねんり}が3％で{一定|いってい}なら、{条件|じょうけん}をそろえて{比較|ひかく}できます。","zh":"若年利率恒为 3%，就可以在统一条件下比较。"},{"pattern":"～ほど","explain":"表示程度关系；常用于“越……越……”。","example":"{期間|きかん}が{長|なが}いほど、{複利|ふくり}による{差|さ}が{大|おお}きくなります。","zh":"期限越长，由复利产生的差距越大。"}],"terms":[{"ja":"利子","kana":"りし","zh":"利息，金额概念"},{"ja":"利息","kana":"りそく","zh":"利息，与利子意思接近"},{"ja":"金利","kana":"きんり","zh":"资金借贷或存放的利率"},{"ja":"利率","kana":"りりつ","zh":"利率，以百分比表示"},{"ja":"年利","kana":"ねんり","zh":"以一年为单位表示的利率"},{"ja":"単利","kana":"たんり","zh":"只对最初本金计算利息"},{"ja":"複利","kana":"ふくり","zh":"将利息计入后续计息基础"},{"ja":"運用","kana":"うんよう","zh":"运用资金或资产"},{"ja":"推移","kana":"すいい","zh":"数值随时间的变化"},{"ja":"目安","kana":"めやす","zh":"用于估计的参考值"}],"questions":[{"type":"choice","prompt":"本金 10 万日元，年利率恒为 3%，不计税费，一年利息是多少？","options":["300 日元","3,000 日元","30,000 日元"],"answer":1,"explain":"100,000×0.03＝3,000。利率是 3%，利息是 3,000 日元。"},{"type":"text","prompt":"「複利」的平假名读音是什么？","answers":["ふくり"],"explain":"複利＝ふくり；与単利（たんり）对照记忆。"},{"type":"choice","prompt":"用 72 法则估计年利率 6% 的复利翻倍时间，应怎么算？","options":["72×6＝432 年","72÷6＝约 12 年","6÷72＝约 0.08 年"],"answer":1,"explain":"72÷以百分数表示的年利率，得到大致年数；假定利率稳定并再投资。"},{"type":"text","prompt":"「金利は割合、利子は＿＿です」中应填“金额”的日语汉字。","answers":["金額"],"explain":"金額＝きんがく；金额与百分比是两种不同单位。"}],"writing":{"prompt":"用「～なら」写一句包含本金、利率或期限假设的计算说明。","reference":"{年利|ねんり}が6％で{一定|いってい}なら、72の{法則|ほうそく}では{約|やく}12{年|ねん}が{目安|めやす}です。","zh":"若年利率恒为 6%，按 72 法则估计约需 12 年。","checks":["是否写明假定利率固定","是否把 72 法则写成近似估计","是否区分百分比与金额"]},"notes":["本课数字是数学示例，不表示可获得固定收益的投资产品。实际复利结果受收益波动、税费、再投资时点影响。","原 PDF 的 0.02%、祖父母世代 8% 等是教学或历史示例；第 6 页图表也不是当前存款利率表。"],"coverage":["4-2：利子、金利以及存款人与借款人的不同立场","4-3：单利、复利与再投资","4-4：72 法则与近似计算","4-5：利率历史、图表时期和指标口径"]},{"id":"fsa-03","module":"资产形成","title":"存款与债券：把钱借给谁","titleJa":"預金と債券の仕組み","summary":"认识存款的支付功能、保护范围，以及国债和公司债的偿付与交易风险。","minutes":20,"sources":[{"key":"fsa","pages":[8,9],"label":"4-7 / 4-8"},{"key":"deposit","pages":[],"label":"金融厅：存款保险制度（补充核验）","url":"https://www.fsa.go.jp/policy/payoff/index.html"}],"objectives":["说明存款与债券的基本用途","辨认存款保险的保护条件","理解债券的到期偿付与违约风险"],"sentences":[{"jp":"{普通預金|ふつうよきん}は、{給与|きゅうよ}の{受|う}け{取|と}りや{公共料金|こうきょうりょうきん}の{支払|しはら}いにも{使|つか}われます。","zh":"普通存款也用于接收工资和支付公共事业费用。","kind":"学习例句","note":"日本的「普通預金」接近活期存款账户；「～にも」表示除了其他用途，也用于这一用途。","sourceKey":"fsa","page":8},{"jp":"{預金保険|よきんほけん}による{保護|ほご}の{範囲|はんい}は、{預金|よきん}の{種類|しゅるい}によって{異|こと}なります。","zh":"存款保险的保护范围因存款种类而异。","kind":"学习例句","note":"不能把“存款安全”读成任何币种、任何账户、任何金额都获得全额保证；具体范围见本课补充说明。","sourceKey":"fsa","page":8},{"jp":"{国債|こくさい}は{国|くに}が、{社債|しゃさい}は{会社|かいしゃ}が{資金|しきん}を{借|か}りるために{発行|はっこう}する{債券|さいけん}です。","zh":"国债是国家、公司债是公司为借入资金而发行的债券。","kind":"学习例句","note":"「A は B が発行する C です」：B が発行する修饰 C，A 是主题。购买债券是形成债权，不是成为股东。","sourceKey":"fsa","page":9},{"jp":"{一般的|いっぱんてき}な{利付債|りつきさい}では、{利子|りし}を{受|う}け{取|と}り、{満期|まんき}には{額面金額|がくめんきんがく}の{返済|へんさい}を{受|う}ける{予定|よてい}です。","zh":"一般附息债券按约定付息，并计划在到期时偿还票面金额。","kind":"学习例句","note":"「予定」不是无条件保证；债券也有零息等不同结构。票面金额与在市场上买入的价格可以不同。","sourceKey":"fsa","page":9},{"jp":"{発行者|はっこうしゃ}が{返済|へんさい}できなくなったり、{満期前|まんきまえ}に{売|う}る{価格|かかく}が{下|さ}がったりすると、{損失|そんしつ}が{出|で}ることがあります。","zh":"发行人无力偿付，或者到期前卖出时价格下跌，都可能造成损失。","kind":"学习例句","note":"到期持有也不能排除违约风险；需要中途用钱时，还要考虑价格与流动性。","sourceKey":"fsa","page":9}],"grammar":[{"pattern":"～によって","explain":"表示“因……而异”或“根据……”，常与異なる、変わる搭配。","example":"{保護|ほご}の{範囲|はんい}は{商品|しょうひん}によって{異|こと}なります。","zh":"保护范围因产品而异。"},{"pattern":"～たり、～たりする","explain":"列举有代表性的动作或情况，不表示已经列出全部。","example":"{価格|かかく}が{上|あ}がったり{下|さ}がったりします。","zh":"价格有时上涨，有时下跌。"}],"terms":[{"ja":"預金","kana":"よきん","zh":"存入银行等机构的资金"},{"ja":"普通預金","kana":"ふつうよきん","zh":"便于日常收付的存款账户"},{"ja":"定期預金","kana":"ていきよきん","zh":"约定存期的存款"},{"ja":"預金保険","kana":"よきんほけん","zh":"金融机构破产时按规则保护存款的制度"},{"ja":"債券","kana":"さいけん","zh":"发行人为筹资而发行的债务凭证"},{"ja":"国債","kana":"こくさい","zh":"由国家发行的债券"},{"ja":"社債","kana":"しゃさい","zh":"由公司发行的债券"},{"ja":"満期","kana":"まんき","zh":"约定期限届满"},{"ja":"額面金額","kana":"がくめんきんがく","zh":"债券票面载明的金额"},{"ja":"返済","kana":"へんさい","zh":"偿还借入的资金"}],"questions":[{"type":"choice","prompt":"购买公司债后，投资者主要取得什么关系？","options":["对发行公司的债权","发行公司的员工身份","自动成为公司股东"],"answer":0,"explain":"债券代表债权；股票代表股权。两者的权利和风险不同。"},{"type":"text","prompt":"「満期」的平假名读音是什么？","answers":["まんき"],"explain":"満期＝まんき，表示约定期限届满。"},{"type":"choice","prompt":"关于日本存款保险，哪项理解正确？","options":["所有外币存款都全额保护","保护规则与存款种类、金融机构等条件有关","在同一家银行多开几个普通存款账户就各有独立限额"],"answer":1,"explain":"一般存款按每位存款人、每家金融机构合并计算；并非按账户分开计算。"},{"type":"text","prompt":"“国债”的日语汉字是什么？","answers":["国債"],"explain":"国債＝こくさい；公司发行的债券是社債。"}],"writing":{"prompt":"用「～によって異なります」写一句，说明债券风险或存款保护有不同条件。","reference":"{債券|さいけん}のリスクは、{発行者|はっこうしゃ}や{満期|まんき}までの{期間|きかん}によって{異|こと}なります。","zh":"债券风险因发行人及距到期的期限而异。","checks":["是否明确指出比较对象","是否使用「によって異なります」","是否避免把任何债券写成无条件保本"]},"notes":["按金融厅官方规则，受保护的一般存款以每位存款人、每家金融机构合并计算，保护本金 1,000 万日元及破产日前的利息等；符合条件的支付结算存款全额保护。外币存款等可能不在该制度保护范围。","教材对存款、债券的比较是入门概括；具体安全性、流动性和收益性取决于发行人、币种、期限与条款。"],"coverage":["4-7：存款、工资收取、自动扣款、流动性与存款保护","4-8：国债、公司债、利息、到期、票面金额及偿付风险"]},{"id":"fsa-04","module":"资产形成","title":"股票、基金与产品比较","titleJa":"株式・投資信託を比べる","summary":"从股东身份读到基金的资金集合机制，再用同一套标准比较四类金融产品。","minutes":20,"sources":[{"key":"fsa","pages":[10,11,12],"label":"4-9 / 4-10 / 4-11"}],"objectives":["分清持有股票与出借资金","说明投资信托为什么能小额参与","把产品特点与资金用途联系起来"],"sentences":[{"jp":"{株式|かぶしき}を{持|も}つと{株主|かぶぬし}になり、{会社|かいしゃ}の{所有者|しょゆうしゃ}の{一人|ひとり}になります。","zh":"持有股票就成为股东，也是公司的所有者之一。","kind":"学习例句","note":"与债券不同，公司通常没有像偿还借款一样返还股票投资本金的义务；股东可能通过出售股票退出。","sourceKey":"fsa","page":10},{"jp":"{株価|かぶか}は{業績|ぎょうせき}や{景気|けいき}などで{変動|へんどう}し、{配当|はいとう}が{出|で}ないこともあります。","zh":"股价会随业绩、经济景气等变化，公司也可能不分红。","kind":"学习例句","note":"预期收益不能当成确定到账的收益；「～こともある」表示也会出现这种情况。","sourceKey":"fsa","page":10},{"jp":"{投資信託|とうししんたく}は、{多|おお}くの{投資家|とうしか}の{資金|しきん}をまとめて、{株式|かぶしき}や{債券|さいけん}などに{投資|とうし}する{仕組|しく}みです。","zh":"投资信托把许多投资者的资金汇集起来，投资股票、债券等资产。","kind":"学习例句","note":"中文常称证券投资基金；「投資信託」也叫ファンド，但不同基金的投资范围并不相同。","sourceKey":"fsa","page":11},{"jp":"{少額|しょうがく}から{買|か}える{投資信託|とうししんたく}もありますが、{値動|ねうご}きや{費用|ひよう}は{商品|しょうひん}によって{違|ちが}います。","zh":"有些基金可以小额购买，但价格波动和费用因产品而异。","kind":"学习例句","note":"基金价格常称「基準価額」；小额起投不等于风险低，也不等于所有基金都充分分散。","sourceKey":"fsa","page":11},{"jp":"{預金|よきん}・{債券|さいけん}・{株式|かぶしき}・{投資信託|とうししんたく}は、{使|つか}う{目的|もくてき}と{時期|じき}に{応|おう}じて{比較|ひかく}します。","zh":"存款、债券、股票和基金，需要根据用途和用钱时间比较。","kind":"学习例句","note":"用收益性、安全性、流动性评价具体产品；不能只凭产品大类就断定优劣。","sourceKey":"fsa","page":12}],"grammar":[{"pattern":"～と、～になる","explain":"表示条件成立后的结果，适合介绍身份或状态变化。","example":"{株式|かぶしき}を{買|か}うと、その{会社|かいしゃ}の{株主|かぶぬし}になります。","zh":"买入股票，就成为该公司的股东。"},{"pattern":"～に応じて","explain":"表示“根据……相应地”，后接采取的方法或选择。","example":"{目的|もくてき}に{応|おう}じて{商品|しょうひん}を{選|えら}びます。","zh":"根据用途选择产品。"}],"terms":[{"ja":"株式","kana":"かぶしき","zh":"股票，代表公司股权"},{"ja":"株主","kana":"かぶぬし","zh":"持有股票的股东"},{"ja":"株価","kana":"かぶか","zh":"股票价格"},{"ja":"業績","kana":"ぎょうせき","zh":"企业的经营成绩"},{"ja":"景気","kana":"けいき","zh":"经济活动的景气程度"},{"ja":"配当","kana":"はいとう","zh":"公司向股东分配利润等"},{"ja":"投資信託","kana":"とうししんたく","zh":"汇集投资者资金投资的一种基金机制"},{"ja":"基準価額","kana":"きじゅんかがく","zh":"投资信托每一定份额的净资产价值"},{"ja":"少額","kana":"しょうがく","zh":"较小金额"},{"ja":"費用","kana":"ひよう","zh":"购买、持有或出售时发生的成本"}],"questions":[{"type":"choice","prompt":"买入股票后，下列哪项一定成立？","options":["每年都收到固定股息","取得相应的股东身份","本金能由公司随时全额返还"],"answer":1,"explain":"持股形成股东身份，但分红和投资收益都不是无条件保证。"},{"type":"text","prompt":"「株主」的平假名读音是什么？","answers":["かぶぬし"],"explain":"株主读かぶぬし，不是かぶしゅ。"},{"type":"choice","prompt":"关于投资信托，哪项正确？","options":["所有基金风险完全一样","基金投资什么资产会影响其风险","小额起投就不会亏损"],"answer":1,"explain":"基金的风险收益取决于投资对象、策略、费用等。"},{"type":"text","prompt":"“投资信托”的日语汉字是什么？","answers":["投資信託"],"explain":"投資信託＝とうししんたく，也可称ファンド。"}],"writing":{"prompt":"用「～に応じて」写一句，说明如何比较或选择金融产品。","reference":"お{金|かね}を{使|つか}う{時期|じき}に{応|おう}じて、{金融商品|きんゆうしょうひん}を{比較|ひかく}します。","zh":"根据用钱时间比较金融产品。","checks":["是否使用「に応じて」连接条件和行动","是否区分株式、株主与株価","是否避免把基金或股票描述为保本产品"]},"notes":["投资信托的实际买卖和赎回规则、到账时间与费用各不相同；“流动性较高”不等于随时按不变价格立即取现。"],"coverage":["4-9：股票、股东、股价、业绩与分红","4-10：投资信托、集合投资、小额投资与资产差异","4-11：四类产品比较与目的对应"]},{"id":"fsa-05","module":"资产形成","title":"风险说的是不确定性","titleJa":"リスクとリターンを読む","summary":"学会读懂收益波动、预期与实际结果的区别，并用日语表达自己的判断条件。","minutes":20,"sources":[{"key":"fsa","pages":[13,14],"label":"4-12 / 4-13"}],"objectives":["用中文准确解释リスク与リターン","分清较高预期收益与必然盈利","读懂自己责任原则的基本含义"],"sentences":[{"jp":"{運用|うんよう}によって{得|え}られた{利益|りえき}や{損失|そんしつ}を、リターンと{呼|よ}びます。","zh":"运用资金产生的收益或损失，称为回报。","kind":"学习例句","note":"「リターン」可正可负；它不只指赚钱的部分。","sourceKey":"fsa","page":13},{"jp":"リスクは、{将来|しょうらい}のリターンがどのくらい{不確実|ふかくじつ}かを{表|あらわ}します。","zh":"风险表示未来回报有多不确定。","kind":"学习例句","note":"教材用“波动幅度”帮助理解；风险还可能来自信用、汇率和流动性等，不只是看到跌价。","sourceKey":"fsa","page":13},{"jp":"{値動|ねうご}きが{大|おお}きい{商品|しょうひん}では、{大|おお}きな{利益|りえき}だけでなく、{大|おお}きな{損失|そんしつ}も{起|お}こり{得|え}ます。","zh":"波动大的产品既可能有较大收益，也可能有较大损失。","kind":"学习例句","note":"「～だけでなく、～も」连接两面；「起こり得る」表示有发生的可能。","sourceKey":"fsa","page":14},{"jp":"{高|たか}いリターンを{期待|きたい}して{買|か}っても、そのリターンが{実現|じつげん}するとは{限|かぎ}りません。","zh":"即使期待较高回报而买入，也不一定能实现那份回报。","kind":"学习例句","note":"风险与预期收益的关系不是“风险越大必赚越多”；高风险产品也可能缺乏合理补偿。","sourceKey":"fsa","page":14},{"jp":"{商品|しょうひん}の{内容|ないよう}を{確認|かくにん}したうえで、{自分|じぶん}で{判断|はんだん}し、{損失|そんしつ}の{可能性|かのうせい}も{考|かんが}えます。","zh":"理解产品内容后自行判断，同时考虑发生损失的可能。","kind":"学习例句","note":"教材中的“自己责任原则”强调知情判断和承担投资结果；不意味着金融机构无需履行法定义务。","sourceKey":"fsa","page":13}],"grammar":[{"pattern":"～だけでなく、～も","explain":"表示“不仅……也……”，可用来同时说明收益和损失。","example":"{利益|りえき}だけでなく、{損失|そんしつ}も{考|かんが}えます。","zh":"不仅考虑收益，也考虑损失。"},{"pattern":"～とは限らない","explain":"表示“并不一定……”，用于否定过度概括。","example":"{過去|かこ}に{上|あ}がった{商品|しょうひん}が、{今後|こんご}も{上|あ}がるとは{限|かぎ}りません。","zh":"过去上涨的产品，今后不一定继续上涨。"}],"terms":[{"ja":"利益","kana":"りえき","zh":"正的获利金额"},{"ja":"損失","kana":"そんしつ","zh":"亏损或经济损失"},{"ja":"不確実性","kana":"ふかくじつせい","zh":"无法事先确定结果的程度"},{"ja":"振れ幅","kana":"ふれはば","zh":"上下波动的幅度"},{"ja":"値動き","kana":"ねうごき","zh":"价格的变化"},{"ja":"期待","kana":"きたい","zh":"对未来结果的预期，不是保证"},{"ja":"実現","kana":"じつげん","zh":"预想的结果成为事实"},{"ja":"可能性","kana":"かのうせい","zh":"某种结果发生的可能"},{"ja":"判断","kana":"はんだん","zh":"根据材料作出判断"},{"ja":"自己責任","kana":"じこせきにん","zh":"在知情自主选择中承担自己的投资结果"}],"questions":[{"type":"choice","prompt":"在本教材的风险定义中，最接近リスク的是哪一个？","options":["未来收益结果的不确定性","手续费的日语别称","保证亏损的金额"],"answer":0,"explain":"リスク关注结果的不确定性；不是“必然亏损”的同义词。"},{"type":"text","prompt":"「損失」的平假名读音是什么？","answers":["そんしつ"],"explain":"損失＝そんしつ，与利益（りえき）相对。"},{"type":"choice","prompt":"“高风险、高回报”应如何理解？","options":["风险高就保证赚得多","为了追求较高预期收益，往往要面对较大不确定性","任何高风险产品都值得买"],"answer":1,"explain":"预期收益不等于实际收益，承担风险也不保证得到补偿。"},{"type":"text","prompt":"将汉字读音补全：「不確実性」＝＿＿。","answers":["ふかくじつせい"],"explain":"不確実性＝ふかくじつせい，是本课的核心概念。"}],"writing":{"prompt":"用「～とは限りません」写一句，纠正“过去赚钱，今后也一定赚钱”的说法。","reference":"{過去|かこ}に{利益|りえき}が{出|で}ても、{今後|こんご}も{利益|りえき}が{出|で}るとは{限|かぎ}りません。","zh":"即使过去赚了钱，今后也不一定盈利。","checks":["是否使用「とは限りません」","是否区分过去结果与未来预期","是否避免把风险仅理解为已经发生的亏损"]},"notes":["教材的风险收益示意图是概念图，不是每一种产品的精确排序。应结合具体产品、期限、币种与费用理解。"],"coverage":["4-12：回报、风险、不确定性与自己责任原则","4-13：风险收益关系、股票与债券等产品的概念位置"]},{"id":"fsa-06","module":"资产形成","title":"资金如何进入社会","titleJa":"投資・経済・SDGs・ESG","summary":"把储蓄与投资放进经济活动中，理解银行贷款、企业经营、公共服务，以及 SDGs 和 ESG。","minutes":20,"sources":[{"key":"fsa","pages":[15,16,17],"label":"4-14 / 4-15 / 4-16"}],"objectives":["说明家庭资金与企业、政府的联系","认出 ESG 三个组成部分","区分社会目标、投资方法和收益结果"],"sentences":[{"jp":"{銀行|ぎんこう}は{預金|よきん}などで{集|あつ}めた{資金|しきん}を、{企業|きぎょう}などへの{貸出|かしだし}に{使|つか}います。","zh":"银行把通过存款等筹集的资金用于向企业等放贷。","kind":"学习例句","note":"这里介绍金融中介的基本作用；企业获得资金后可用于设备、生产等活动。","sourceKey":"fsa","page":15},{"jp":"{企業|きぎょう}や{政府|せいふ}への{資金提供|しきんていきょう}は、{設備投資|せつびとうし}や{公共|こうきょう}サービスを{支|ささ}える{役割|やくわり}があります。","zh":"向企业和政府提供资金，有助于支持设备投资和公共服务。","kind":"学习例句","note":"金融活动与商品、服务、工资、利息及分红相连。二级市场交易通常是投资者之间转让证券，并非每笔买入款都直接进入公司。","sourceKey":"fsa","page":15},{"jp":"{SDGs|エスディージーズ}は、{貧困|ひんこん}や{環境|かんきょう}などの{課題|かだい}に{取|と}り{組|く}むための{国際的|こくさいてき}な{目標|もくひょう}です。","zh":"SDGs 是为应对贫困、环境等问题而设定的国际目标。","kind":"学习例句","note":"SDGs 包含 17 项目标、169 个具体目标；本课学习它与消费及投资选择的联系。","sourceKey":"fsa","page":16},{"jp":"{ESG|イーエスジー}{投資|とうし}では、{財務情報|ざいむじょうほう}に{加|くわ}えて、{環境|かんきょう}・{社会|しゃかい}・ガバナンスも{考慮|こうりょ}します。","zh":"ESG 投资除财务信息外，还考虑环境、社会和公司治理。","kind":"学习例句","note":"E＝Environment，S＝Social，G＝Governance；“ガバナンス”在此通常指公司治理。","sourceKey":"fsa","page":17},{"jp":"{社会課題|しゃかいかだい}への{貢献|こうけん}と、{投資|とうし}による{利益|りえき}は、{別々|べつべつ}に{確認|かくにん}する{必要|ひつよう}があります。","zh":"对社会问题的贡献与投资收益，需要分别核实。","kind":"学习例句","note":"SDGs 是社会发展目标；ESG 是分析企业时考虑的因素。两者有关联，但并非同义词，名称也不保证效果或收益。","sourceKey":"fsa","page":17}],"grammar":[{"pattern":"～を通じて","explain":"表示“通过……”，常用于说明渠道或方式。","example":"{投資|とうし}を{通|つう}じて、{企業|きぎょう}の{活動|かつどう}に{関|かか}わります。","zh":"通过投资参与企业的活动。"},{"pattern":"～に加えて","explain":"表示“除……之外还……”，补充另一个考量因素。","example":"{利益率|りえきりつ}に{加|くわ}えて、{環境|かんきょう}への{対応|たいおう}も{調|しら}べます。","zh":"除利润率外，也调查企业应对环境问题的做法。"}],"terms":[{"ja":"貸出","kana":"かしだし","zh":"金融机构向借款人提供资金"},{"ja":"資金提供","kana":"しきんていきょう","zh":"向某项活动提供资金"},{"ja":"設備投資","kana":"せつびとうし","zh":"为机器、设施等长期经营资产投入资金"},{"ja":"公共サービス","kana":"こうきょうサービス","zh":"政府等提供的公共服务"},{"ja":"社会課題","kana":"しゃかいかだい","zh":"需要社会共同应对的问题"},{"ja":"持続可能","kana":"じぞくかのう","zh":"能够持续维持的；可持续"},{"ja":"環境","kana":"かんきょう","zh":"生态与环境相关因素"},{"ja":"財務情報","kana":"ざいむじょうほう","zh":"利润、资产、现金流等财务信息"},{"ja":"非財務情報","kana":"ひざいむじょうほう","zh":"财务报表以外的重要信息"},{"ja":"企業統治","kana":"きぎょうとうち","zh":"公司治理，亦称ガバナンス"},{"ja":"SDGs","kana":"エスディージーズ","zh":"可持续发展目标；与投资分析框架 ESG 相关，但不是同义词。"},{"ja":"ESG","kana":"イーエスジー","zh":"环境、社会、公司治理三个观察维度。"}],"questions":[{"type":"choice","prompt":"ESG 的 G 在本课中指什么？","options":["增长率","公司治理","政府债券"],"answer":1,"explain":"G 代表 Governance，指企业如何被管理、监督和约束。"},{"type":"text","prompt":"「環境」的平假名读音是什么？","answers":["かんきょう"],"explain":"環境＝かんきょう，对应 ESG 的 E。"},{"type":"choice","prompt":"哪一种理解较准确？","options":["标着 ESG 就保证高收益","SDGs 与 ESG 是同一个缩写","社会贡献与财务回报都需要实际证据"],"answer":2,"explain":"目标、方法与结果要分开判断；ESG 名称本身不能证明收益或社会影响。"},{"type":"text","prompt":"“财务信息”的日语汉字是什么？","answers":["財務情報"],"explain":"財務情報＝ざいむじょうほう；ESG 也关注非財務情報。"}],"writing":{"prompt":"用「～に加えて」写一句，说明你分析企业时还会关注哪项信息。","reference":"{財務情報|ざいむじょうほう}に{加|くわ}えて、{働|はたら}く{人|ひと}の{安全|あんぜん}も{確認|かくにん}します。","zh":"除财务信息外，也确认员工的安全状况。","checks":["是否用「に加えて」增加一项考量","是否选择了具体的环境、社会或治理因素","是否没有把社会贡献写成收益保证"]},"notes":["本课修正原教材总结中容易把 SDGs 与 ESG 混为一谈的简写：两者相关，但不是同义词。"],"coverage":["4-14：存款、贷款、证券投资与企业、政府的资金循环","4-15：消费、投资、SDGs 与社会问题","4-16：ESG、财务信息与非财务信息"]},{"id":"fsa-07","module":"资产形成","title":"长期投资与历史图表","titleJa":"長期投資と過去の実績","summary":"学习长时间持有的含义，也学习如何读数据区间、比较条件，以及过去表现的边界。","minutes":20,"sources":[{"key":"fsa","pages":[18,19,23],"label":"4-17 / 4-18 / 4-22"}],"objectives":["说明长期、定投、分散的配合关系","读出历史结果和未来预测的区别","把投资期限与用钱计划联系起来"],"sentences":[{"jp":"{長期|ちょうき}・{積立|つみたて}・{分散|ぶんさん}は、リスクと{向|む}き{合|あ}うための{基本的|きほんてき}な{考|かんが}え{方|かた}です。","zh":"长期、定投和分散，是应对投资风险的基本思路。","kind":"学习例句","note":"这些方法帮助管理风险，并不消除所有风险；非课税制度则主要影响税后结果。","sourceKey":"fsa","page":18},{"jp":"{長|なが}く{運用|うんよう}し、{利益|りえき}を{再投資|さいとうし}することで、{複利|ふくり}の{効果|こうか}が{働|はたら}く{可能性|かのうせい}があります。","zh":"长期运用并把收益再投入，可能发挥复利效果。","kind":"学习例句","note":"若收益为负，长期持有也可能亏损。谈复利时需要明确再投资及收益假设。","sourceKey":"fsa","page":19},{"jp":"{教材|きょうざい}のグラフは、{一定|いってい}の{条件|じょうけん}で{計算|けいさん}した{過去|かこ}の{実績|じっせき}を{示|しめ}しています。","zh":"教材图表展示的是在一定条件下计算的历史结果。","kind":"学习例句","note":"第 19 页使用 1989 年以后的数据，对国内外股票与债券进行定额投资，比较持有 5 年与 20 年的样本；它不是所有投资都适用的分布。","sourceKey":"fsa","page":19},{"jp":"{過去|かこ}の{比較|ひかく}で{分散投資|ぶんさんとうし}の{成績|せいせき}が{良|よ}くても、{将来|しょうらい}も{同|おな}じ{結果|けっか}になるとは{限|かぎ}りません。","zh":"即使历史比较中分散投资表现较好，未来也不一定有相同结果。","kind":"学习例句","note":"第 23 页比较定期存款、国内股债、全球股债组合的历史累计回报。要同时看时期、投入方式与资产权重。","sourceKey":"fsa","page":23},{"jp":"{途中|とちゅう}で{必要|ひつよう}になるお{金|かね}を{分|わ}けておくと、{長期|ちょうき}の{計画|けいかく}を{続|つづ}けやすくなります。","zh":"把中途可能需要的钱另作安排，有助于持续长期计划。","kind":"学习例句","note":"长期计划应适合个人现金需求；市场波动本身不等于必须卖出，但“长期”也不要求忽略实际生活变化。","sourceKey":"fsa","page":19}],"grammar":[{"pattern":"～ことで","explain":"表示通过某种行为产生的作用，常用于解释机制。","example":"{利益|りえき}を{再投資|さいとうし}することで、{運用|うんよう}する{金額|きんがく}が{増|ふ}えます。","zh":"通过再投资收益，参与运用的金额增加。"},{"pattern":"～ても、～とは限らない","explain":"表示即使前项成立，后项也未必成立。","example":"{長|なが}く{持|も}っても、{利益|りえき}が{出|で}るとは{限|かぎ}りません。","zh":"即使长期持有，也不一定盈利。"}],"terms":[{"ja":"長期投資","kana":"ちょうきとうし","zh":"以较长持有期规划的投资"},{"ja":"保有期間","kana":"ほゆうきかん","zh":"持有资产的时间"},{"ja":"再投資","kana":"さいとうし","zh":"将所得收益再次投入"},{"ja":"運用成果","kana":"うんようせいか","zh":"资金运用得到的结果"},{"ja":"年間収益率","kana":"ねんかんしゅうえきりつ","zh":"以一年为单位的回报率"},{"ja":"出現頻度","kana":"しゅつげんひんど","zh":"某类结果在样本中出现的频率"},{"ja":"累積リターン","kana":"るいせきリターン","zh":"一定期间累计的回报"},{"ja":"実績","kana":"じっせき","zh":"已发生的成绩或结果"},{"ja":"元本割れ","kana":"がんぽんわれ","zh":"资产价值低于投入本金"},{"ja":"継続","kana":"けいぞく","zh":"持续进行"}],"questions":[{"type":"choice","prompt":"教材历史样本里 20 年持有的结果较好，可以推出什么？","options":["未来任意股票持有 20 年都不亏","这些历史样本在指定条件下出现了该结果","所有人都应把生活费投入股市"],"answer":1,"explain":"历史样本支持对那组数据的描述，不能保证未来或其他资产的结果。"},{"type":"text","prompt":"「元本割れ」的平假名读音是什么？","answers":["がんぽんわれ"],"explain":"元本割れ指价值跌破本金。"},{"type":"choice","prompt":"为了更稳妥地执行长期计划，哪一种做法更符合本课？","options":["提前考虑中途现金需要","完全不考虑未来支出","只因为过去涨过就持续加大投入"],"answer":0,"explain":"把短期用钱需求与长期资金区分开，可以减少被迫在不利时点出售的压力。"},{"type":"text","prompt":"“再投资”的日语汉字是什么？","answers":["再投資"],"explain":"再投資＝さいとうし，是理解复利效果的重要条件。"}],"writing":{"prompt":"用「～ても、～とは限りません」说明长期投资的一个边界。","reference":"20{年間|ねんかん}{保有|ほゆう}しても、{必|かなら}ず{利益|りえき}が{出|で}るとは{限|かぎ}りません。","zh":"即使持有 20 年，也不一定必然盈利。","checks":["是否保留“未必”的语气","是否没有把历史结果写成承诺","是否区分持有期限与回报保证"]},"notes":["原图的样本区间、资产组合和投入方法都有限定。课程不将样本中未出现亏损写成“未来不会亏损”。","第 23 页的累计回报与年平均数不能随意代入单笔一次性投资公式；要先看其定额投入的计算条件。"],"coverage":["4-17：降低风险的思路及长期、定投、分散、非课税制度","4-18：长期持有、复利、历史频率与中途退出","4-22：长期定投分散的历史组合比较与结果解读"]},{"id":"fsa-08","module":"资产形成","title":"定投买多少，分散到哪里","titleJa":"積立投資と分散投資","summary":"用份额计算理解固定金额定投，再从资产和地区两方面判断分散是否有效。","minutes":20,"sources":[{"key":"fsa","pages":[20,21,22],"label":"4-19 / 4-20 / 4-21"}],"objectives":["算出价格变化时固定金额买入的份额","区分定投的纪律性与收益保证","说明资产分散和地区分散的作用"],"sentences":[{"jp":"{積立投資|つみたてとうし}では、あらかじめ{決|き}めた{金額|きんがく}を{定期的|ていきてき}に{投資|とうし}します。","zh":"定投是按固定周期投入事先决定的金额。","kind":"学习例句","note":"「あらかじめ」意为事先；固定规则可以减少每次都猜测买入时点的负担。","sourceKey":"fsa","page":20},{"jp":"{毎回|まいかい}{同|おな}じ{金額|きんがく}なら、{価格|かかく}が{低|ひく}いときには{多|おお}く、{高|たか}いときには{少|すく}なく{買|か}います。","zh":"每次金额相同，价格低时买到的份额多，价格高时买到的份额少。","kind":"学习例句","note":"例：每次投入 1 万日元，价格分别为每万份 1 万和 5 千日元，买到 1 万份与 2 万份。","sourceKey":"fsa","page":21},{"jp":"この{例|れい}では、2{万円|まんえん}で3{万口|まんくち}を{買|か}うので、1{万口|まんくち}あたりの{平均購入単価|へいきんこうにゅうたんか}は{約|やく}6,667{円|えん}です。","zh":"在这个例子中，2 万日元共买到 3 万份，所以每万份平均买入价约 6,667 日元。","kind":"学习例句","note":"这是另编的两次买入示例：总投入÷总份额，再换算到每万份；不要直接平均两个价格。","sourceKey":"fsa","page":21},{"jp":"{値動|ねうご}きの{異|こと}なる{資産|しさん}を{組|く}み{合|あ}わせると、{全体|ぜんたい}の{変動|へんどう}を{抑|おさ}えられる{場合|ばあい}があります。","zh":"组合价格变化不同的资产，有时能减小整体波动。","kind":"学习例句","note":"关键是资产的实际相关性；买很多只高度重叠的基金，未必增加有效分散。","sourceKey":"fsa","page":22},{"jp":"{投資先|とうしさき}の{地域|ちいき}を{分|わ}けても、{世界全体|せかいぜんたい}の{市場|しじょう}が{下|さ}がると{損失|そんしつ}が{出|で}ることがあります。","zh":"即使分散到不同地区，全球市场同时下跌时仍可能亏损。","kind":"学习例句","note":"地区分散可降低集中风险，但也可能增加汇率等风险；定投、分散都不保证获利。","sourceKey":"fsa","page":22}],"grammar":[{"pattern":"～あたり","explain":"表示每一个单位，常用于价格、份额、时间的换算。","example":"1{万口|まんくち}あたりの{価格|かかく}を{確認|かくにん}します。","zh":"确认每万份的价格。"},{"pattern":"～場合がある","explain":"表示某些条件下可能出现，不是无条件成立。","example":"{分散|ぶんさん}によって、{全体|ぜんたい}の{変動|へんどう}が{小|ちい}さくなる{場合|ばあい}があります。","zh":"通过分散，整体波动有时会减小。"}],"terms":[{"ja":"積立投資","kana":"つみたてとうし","zh":"按照计划定期投入资金"},{"ja":"定期的","kana":"ていきてき","zh":"按一定时间间隔进行"},{"ja":"購入金額","kana":"こうにゅうきんがく","zh":"买入时投入的金额"},{"ja":"口数","kana":"くちすう","zh":"基金份额数量"},{"ja":"平均購入単価","kana":"へいきんこうにゅうたんか","zh":"总投入除以总份额后换算的平均买入单价"},{"ja":"分散投資","kana":"ぶんさんとうし","zh":"把资金分配到不同投资对象"},{"ja":"資産","kana":"しさん","zh":"具有经济价值的财产或投资对象"},{"ja":"地域","kana":"ちいき","zh":"投资对象所在的地区"},{"ja":"組み合わせる","kana":"くみあわせる","zh":"组合不同对象"},{"ja":"為替","kana":"かわせ","zh":"此处指不同货币间的兑换及汇率"}],"questions":[{"type":"choice","prompt":"同样投入 1 万日元，价格从每万份 1 万日元降到 5 千日元，买到的份额如何变化？","options":["从 1 万份变为 2 万份","从 1 万份变为 5 千份","仍然只有 1 万份"],"answer":0,"explain":"10,000÷5,000×10,000＝20,000 份。固定金额在低价时能买到更多份额。"},{"type":"text","prompt":"「分散投資」的平假名读音是什么？","answers":["ぶんさんとうし"],"explain":"分散＝ぶんさん，投資＝とうし。"},{"type":"choice","prompt":"定投与一次性买入相比，哪项说法正确？","options":["任何行情下都更赚钱","能分散买入时点，但收益仍取决于价格路径等条件","能保证本金不减少"],"answer":1,"explain":"持续上涨时，较早一次性投入可能收益更高；持续下跌时，定投也可能亏损。"},{"type":"text","prompt":"基金的份额数量用「口数」表示，其平假名读音是什么？","answers":["くちすう"],"explain":"「口」在这里读くち；「口数」读くちすう。"}],"writing":{"prompt":"用一句日语说明固定金额定投在低价时会发生什么。","reference":"{同|おな}じ{金額|きんがく}なら、{価格|かかく}が{低|ひく}いときに{多|おお}くの{口数|くちすう}を{買|か}えます。","zh":"金额相同，价格低时能够买到更多份额。","checks":["是否固定了投入金额这一前提","是否把金额与份额分开","是否没有写成定投一定获利"]},"notes":["定投的平均成本取决于买入价格路径；定投不保证比一次性投资成本更低或回报更高。","跨地区投资可能带来汇率波动；分散也无法消除全球性下跌风险。"],"coverage":["4-19：事先设定金额、持续投入和择时困难","4-20：高价少买、低价多买与平均买入成本","4-21：资产分散、地区分散和整体波动"]},{"id":"fsa-09","module":"资产形成","title":"读懂 NISA 与 iDeCo","titleJa":"非課税制度と老後資金","summary":"学习日本两种税收优惠制度的作用，比较取出资金的限制，并知道哪些规则需要查官方最新版。","minutes":20,"sources":[{"key":"fsa","pages":[24],"label":"4-23"},{"key":"nisa","pages":[],"label":"金融厅：NISA 制度官方说明（2026-10-12 核验）","url":"https://www.fsa.go.jp/policy/nisa2/know/index.html"},{"key":"ideco","pages":[],"label":"iDeCo 官方：制度特点（2026-10-12 核验）","url":"https://www.ideco-koushiki.jp/guide/"}],"objectives":["分清制度账户与账户里的投资产品","比较 NISA 与 iDeCo 的主要目的和资金约束","识别税收优惠不会消除投资风险"],"sentences":[{"jp":"{NISA|ニーサ}は{商品|しょうひん}の{名前|なまえ}ではなく、{一定|いってい}の{条件|じょうけん}を{満|み}たす{投資|とうし}の{利益|りえき}が{非課税|ひかぜい}になる{制度|せいど}です。","zh":"NISA 不是产品名称，而是让符合条件的投资收益免税的制度。","kind":"学习例句","note":"制度是账户规则，股票或基金才是其中持有的产品；免税不等于本金保证。","sourceKey":"fsa","page":24},{"jp":"{NISA|ニーサ}には「つみたて{投資枠|とうしわく}」と「{成長投資枠|せいちょうとうしわく}」があり、{対象商品|たいしょうしょうひん}や{上限|じょうげん}を{確認|かくにん}する{必要|ひつよう}があります。","zh":"NISA 设有定投额度和成长投资额度，需要确认可投资产品与额度上限。","kind":"学习例句","note":"金融厅官方页面确认 2024 年起实施的新制度；两个额度可以并用。NISA 中持有的产品可以卖出，具体到账仍按产品规则。","sourceKey":"fsa","page":24},{"jp":"{iDeCo|イデコ}は{老後|ろうご}のための{年金制度|ねんきんせいど}で、{自分|じぶん}が{出|だ}した{掛金|かけきん}の{運用方法|うんようほうほう}を{選|えら}びます。","zh":"iDeCo 是为养老准备的养老金制度，由本人选择自己缴费资金的运用方式。","kind":"学习例句","note":"其正式名称是個人型確定拠出年金；“确定缴费”不表示未来领取金额确定。","sourceKey":"fsa","page":24},{"jp":"{iDeCo|イデコ}には{税制上|ぜいせいじょう}の{優遇|ゆうぐう}がありますが、{資産|しさん}は{原則|げんそく}として60{歳|さい}まで{引|ひ}き{出|だ}せません。","zh":"iDeCo 有税收优惠，但原则上在 60 岁前不能取出资产。","kind":"学习例句","note":"缴费、运用、领取阶段各有相应税务规则；实际领取起始年龄还受加入年限等条件影响，并非所有人一到 60 岁就能领取。","sourceKey":"fsa","page":24},{"jp":"{制度|せいど}を{併用|へいよう}する{場合|ばあい}も、{加入資格|かにゅうしかく}・{手数料|てすうりょう}・お{金|かね}を{使|つか}う{時期|じき}を{確|たし}かめます。","zh":"即使同时使用两种制度，也要确认资格、费用和用钱时间。","kind":"学习例句","note":"缴费抵扣的效果与应税收入等条件有关；不能把表格里的税收优惠直接当成每个人都能获得的固定节税金额。","sourceKey":"fsa","page":24}],"grammar":[{"pattern":"～ではなく、～です","explain":"表示澄清概念；用于明确制度与产品等不同类别。","example":"{NISA|ニーサ}は{投資商品|とうししょうひん}ではなく、{税|ぜい}の{制度|せいど}です。","zh":"NISA 是税收制度，而不是投资产品。"},{"pattern":"～まで、～できない","explain":"表示在某个时间点之前不能做某事；注意直到该时点也未必立即具备条件。","example":"{iDeCo|イデコ}の{資産|しさん}は、{原則|げんそく}として60{歳|さい}まで{引|ひ}き{出|だ}せません。","zh":"iDeCo 资产原则上在 60 岁前不能取出。"}],"terms":[{"ja":"非課税","kana":"ひかぜい","zh":"符合制度条件的收入不课税"},{"ja":"運用益","kana":"うんようえき","zh":"资产运用产生的收益"},{"ja":"投資枠","kana":"とうしわく","zh":"制度允许投入的额度"},{"ja":"掛金","kana":"かけきん","zh":"缴入养老金等制度的费用"},{"ja":"拠出","kana":"きょしゅつ","zh":"向制度或基金缴入资金"},{"ja":"個人型確定拠出年金","kana":"こじんがたかくていきょしゅつねんきん","zh":"iDeCo 的正式名称"},{"ja":"所得控除","kana":"しょとくこうじょ","zh":"按税法从所得中扣除一定金额"},{"ja":"給付","kana":"きゅうふ","zh":"按制度发放资金或权益"},{"ja":"加入資格","kana":"かにゅうしかく","zh":"参加制度所需满足的条件"},{"ja":"併用","kana":"へいよう","zh":"同时使用两种制度或方法"},{"ja":"NISA","kana":"ニーサ","zh":"日本面向个人投资收益的非课税制度；本身不是投资产品。"},{"ja":"iDeCo","kana":"イデコ","zh":"个人型确定缴费养老金的昵称；原则上为长期养老准备。"}],"questions":[{"type":"choice","prompt":"NISA 的核心是什么？","options":["任何投资都由国家保本","符合条件的投资收益适用免税规则","所有人自动获得固定利息"],"answer":1,"explain":"NISA 是税收优惠制度，账户内产品仍有自身风险。"},{"type":"text","prompt":"「非課税」的平假名读音是什么？","answers":["ひかぜい"],"explain":"非課税＝ひかぜい；「非」表示不课税。"},{"type":"choice","prompt":"iDeCo 更适合哪种资金用途的制度设计？","options":["明年就要支付的学费","随时可能使用的旅行预算","长期养老准备"],"answer":2,"explain":"iDeCo 为养老设计，原则上 60 岁前不能取出；参加前应确认资格与取款条件。"},{"type":"text","prompt":"iDeCo 缴入的款项称为「掛金」，其平假名读音是什么？","answers":["かけきん"],"explain":"掛金＝かけきん，与领取阶段的給付（きゅうふ）区别记忆。"}],"writing":{"prompt":"写一句话提醒自己，在使用税收优惠制度前检查一个具体条件。","reference":"{iDeCo|イデコ}を{利用|りよう}する{前|まえ}に、{加入資格|かにゅうしかく}と{受|う}け{取|と}れる{時期|じき}を{確認|かくにん}します。","zh":"使用 iDeCo 前，确认加入资格和可领取时间。","checks":["是否提到了一个实际制度条件","是否区分税收优惠与产品收益","是否没有把旧教材限额直接当作当前规则"]},"notes":["本课于 2026-10-12 对照金融厅 NISA 页面及 iDeCo 官方说明核验概念。原 PDF 的 iDeCo 限额、年龄表与“2024 年将开始”等措辞属于旧版材料，本课不直接沿用。","NISA 的适用资格、投资额度、非课税范围，以及 iDeCo 的缴费上限和领取税务规则，应在实际办理时查官方页面；NISA 和 iDeCo 的产品均不能仅凭制度名称判断风险。","iDeCo 的缴费所得扣除取决于本人应税所得等情况，并有账户及运用费用；领取时是否纳税取决于具体规则和个人情况。"],"coverage":["4-23：NISA 与 iDeCo、税收优惠、对象产品、投资方式、缴费与取款限制、并用"]},{"id":"fsa-10","module":"资产形成","title":"用情景模拟完成自己的说明","titleJa":"シミュレーションと学びへの投資","summary":"把本金、期限与假设收益放进情景模拟，复习全章，并用一句日语说明自己的学习和资金计划。","minutes":20,"sources":[{"key":"fsa","pages":[2,25,26,27,28,29],"label":"4-1 补充 / 模拟体验（1）—（3） / 全章总结"}],"objectives":["识别模拟输入与预测之间的区别","看懂平均预期收益与可能波动范围","用自己的话串起资金计划与自我投资"],"sentences":[{"jp":"シミュレーターでは、{元本|がんぽん}・{積立額|つみたてがく}・{期間|きかん}・{想定利回|そうていりまわ}りなどの{条件|じょうけん}を{設定|せってい}します。","zh":"模拟器需要设置本金、定投金额、期限和假设收益率等条件。","kind":"学习例句","note":"不同工具可能采用一次性投入或定投模式；先看清单位、投入时点以及复利频率，再比较结果。","sourceKey":"fsa","page":25},{"jp":"{複数|ふくすう}の{利回|りまわ}りを{試|ため}すと、{仮定|かてい}が{変|か}わったときの{結果|けっか}の{違|ちが}いを{確認|かくにん}できます。","zh":"试算多个收益率，可以观察假设变化时结果如何不同。","kind":"学习例句","note":"原 PDF 的三个 20 年后金额是特定假设下的演示。试算值用于比较情景，不是未来保证。","sourceKey":"fsa","page":26},{"jp":"{平均的|へいきんてき}な{期待利回|きたいりまわ}りが{同|おな}じでも、{実際|じっさい}の{結果|けっか}には{幅|はば}があります。","zh":"即使平均预期收益率相同，实际结果也可能分布在一个范围内。","kind":"学习例句","note":"第 27 页的图同时标示平均预期值与较好、较差情景；图中数字是当时的模型假设，不是当前可获得的固定回报。","sourceKey":"fsa","page":27},{"jp":"{語学|ごがく}や{技能|ぎのう}を{学|まな}ぶことも、{将来|しょうらい}の{選択肢|せんたくし}を{増|ふ}やすための{自己投資|じことうし}になります。","zh":"学习语言和技能，也可以成为增加未来选择的自我投资。","kind":"学习例句","note":"自我投资不仅是花钱买课，还包括时间投入和练习；其价值应结合学习目标及实际收获评价。","sourceKey":"fsa","page":2},{"jp":"{目的|もくてき}・{必要|ひつよう}な{時期|じき}・{受|う}け{入|い}れられるリスクを{整理|せいり}してから、{資産形成|しさんけいせい}の{計画|けいかく}を{見直|みなお}します。","zh":"先理清目的、用钱时间和可承受的风险，再检查资产形成计划。","kind":"学习例句","note":"全章串联：先管理收支，理解产品和风险，再考虑长期、定投、分散及合适的制度。不要只依据模拟中的最高金额选择。","sourceKey":"fsa","page":28}],"grammar":[{"pattern":"～てから","explain":"表示完成前一动作之后再做后一动作，可用于表达核对顺序。","example":"{条件|じょうけん}を{確認|かくにん}してから、{結果|けっか}を{比|くら}べます。","zh":"确认条件之后，再比较结果。"},{"pattern":"～ための","explain":"表示用途或目的，后面接名词。","example":"{将来|しょうらい}のための{学習計画|がくしゅうけいかく}を{立|た}てます。","zh":"制定为未来作准备的学习计划。"}],"terms":[{"ja":"試算","kana":"しさん","zh":"在给定假设下进行计算"},{"ja":"想定利回り","kana":"そうていりまわり","zh":"模拟时假定的回报率"},{"ja":"積立額","kana":"つみたてがく","zh":"每期投入的金额"},{"ja":"設定","kana":"せってい","zh":"设定参数或条件"},{"ja":"仮定","kana":"かてい","zh":"用于推导结果的假设"},{"ja":"期待利回り","kana":"きたいりまわり","zh":"预期收益率，不是确定回报"},{"ja":"自己投資","kana":"じことうし","zh":"为知识、技能等自身能力投入资源"},{"ja":"技能","kana":"ぎのう","zh":"实际操作或专业技能"},{"ja":"選択肢","kana":"せんたくし","zh":"可供选择的方向"},{"ja":"見直す","kana":"みなおす","zh":"重新检查并按需要调整"}],"questions":[{"type":"choice","prompt":"改变模拟收益率后，期末金额变大了，这意味着什么？","options":["未来一定会获得更高收益","模型在新假设下算出了更高结果","相应产品自动变得更安全"],"answer":1,"explain":"模拟计算的是条件与结果之间的关系，不提供未来保证。"},{"type":"text","prompt":"「自己投資」的平假名读音是什么？","answers":["じことうし"],"explain":"自己投資＝じことうし，也包括学习语言与技能。"},{"type":"choice","prompt":"比较两个模拟结果，首先应检查什么？","options":["哪个结果字体更大","本金、期限、投入方式、税费等条件是否一致","只看金额最多的结果"],"answer":1,"explain":"输入和计算口径不同，结果不能直接用来判断投资方法优劣。"},{"type":"text","prompt":"“试算”的日语汉字是什么？","answers":["試算"],"explain":"試算＝しさん，与資産（しさん）同音，但意思不同。"}],"writing":{"prompt":"用一句日语写本章后的行动：先检查什么，再做什么。","reference":"{家計|かけい}と{将来|しょうらい}の{支出|ししゅつ}を{確認|かくにん}してから、{無理|むり}のない{学習|がくしゅう}と{積立|つみたて}の{計画|けいかく}を{立|た}てます。","zh":"先检查家庭收支与未来支出，再制定可持续的学习和定投计划。","checks":["是否使用「てから」表达次序","是否提到真实的目的或约束","是否把计划写成可执行动作而非收益承诺"]},"notes":["模拟结果需要说明是否计入税费、通货膨胀，以及收益是否固定。本课使用情景思考，不把教材的历史假设移作当前市场预测。","「試算」与「資産」同音，阅读时要根据汉字与上下文区分。"],"coverage":["模拟体验（1）：输入本金、收益率情景与期限","模拟体验（2）：比较不同假设下的期末金额","模拟体验（3）：平均预期收益与可能结果范围","4-1 补充：语学、技能、资格等自我投资","全章总结①②：目的、产品、风险、社会作用与长期定投分散及制度"]},{"id":"abc-01","module":"股票与交易","title":"公司如何创造价值与筹集资金","titleJa":"株式会社と資金調達","summary":"从一家面包公司的设备和原材料出发，区分收入、利润、借款与股权融资，并认识股份公司的历史。","minutes":22,"sources":[{"key":"abc","pages":[6,7,8,9,10],"label":"第2章 株式会社のしくみ"}],"objectives":["能用日语说明公司提供产品、服务并与其他公司协作。","能区分自有资金、借款与发行股份三种资金来源。","能使用「ために」表达筹资的目的，并区分销售收入与利润。"],"sentences":[{"jp":"{小|ちい}さなパンの{会社|かいしゃ}も、{材料|ざいりょう}や{機械|きかい}を{作|つく}る{会社|かいしゃ}と{協力|きょうりょく}して、おいしいパンを{届|とど}けます。","zh":"一家小面包公司也会与生产原材料、机器的公司合作，把好吃的面包送到顾客手中。","note":"「～と協力する」表示与……合作。公司的产品往往来自多家企业的协作。","page":7,"kind":"学习例句","sourceKey":"abc"},{"jp":"{売上|うりあげ}が{増|ふ}えても、{費用|ひよう}がそれ{以上|いじょう}に{増|ふ}えれば、{利益|りえき}は{減|へ}ります。","zh":"即使销售收入增加，如果费用增加得更多，利润也会减少。","note":"「～ても」表示即使；这里用简化的收入减费用关系，避免把卖得多直接等同于赚得多。","page":7,"kind":"学习例句","sourceKey":"abc"},{"jp":"{設備|せつび}や{研究|けんきゅう}に{使|つか}う{資金|しきん}を{集|あつ}めるために、{会社|かいしゃ}は{自己資金|じこしきん}、{借入|かりいれ}、{株式|かぶしき}の{発行|はっこう}などを{検討|けんとう}します。","zh":"为了筹集用于设备和研发的资金，公司会考虑自有资金、借款、发行股份等方式。","note":"「ために」前面说明目的。三种方式可以组合使用，并非只能三选一。","page":8,"kind":"学习例句","sourceKey":"abc"},{"jp":"{銀行|ぎんこう}からの{借入|かりいれ}には{返済|へんさい}と{利息|りそく}の{負担|ふたん}がある{一方|いっぽう}で、{株式|かぶしき}を{買|か}って{出資|しゅっし}した{人|ひと}は{会社|かいしゃ}の{持|も}ち{主|ぬし}の{一人|ひとり}になります。","zh":"向银行借款需要承担还本和付息的负担；通过购买发行股份出资的人，则成为公司的所有者之一。","note":"「一方で」用来比较。此处「买股出资」指公司发行股份时的出资；普通二级市场买入另见第3课。","page":9,"kind":"学习例句","sourceKey":"abc"},{"jp":"1602{年|ねん}に{設立|せつりつ}されたオランダ{東|ひがし}インド{会社|がいしゃ}は、{株式|かぶしき}の{歴史|れきし}を{学|まな}ぶときによく{取|と}り{上|あ}げられます。","zh":"学习股票历史时，经常会讲到1602年成立的荷兰东印度公司。","note":"「取り上げる」在这里是作为话题介绍。教材通过远洋贸易的资金需求与共同承担风险解释股份制度的背景。","page":10,"kind":"学习例句","sourceKey":"abc"}],"grammar":[{"pattern":"动词原形＋ために","explain":"表示有意识地进行某个动作的目的，译为“为了……”。","example":"{新|あたら}しい{工場|こうじょう}を{建|た}てるために、{資金|しきん}を{集|あつ}めます。","zh":"为了建新工厂而筹集资金。"},{"pattern":"～一方で","explain":"从另一个方面进行比较；不要据此推断某种融资方式一定更好。","example":"{会社|かいしゃ}は{商品|しょうひん}を{売|う}る{一方|いっぽう}で、{研究|けんきゅう}にもお{金|かね}を{使|つか}います。","zh":"公司一方面销售产品，另一方面也把资金用于研发。"}],"terms":[{"ja":"株式会社","kana":"かぶしきがいしゃ","zh":"股份公司，以股份形式组织股权的公司。"},{"ja":"売上","kana":"うりあげ","zh":"销售收入，尚未扣除相关费用。"},{"ja":"費用","kana":"ひよう","zh":"开展经营等活动所发生的费用。"},{"ja":"利益","kana":"りえき","zh":"收入扣除相应费用后的成果；不同利润口径范围不同。"},{"ja":"資金","kana":"しきん","zh":"用于经营、投资等目的的资金。"},{"ja":"資金調達","kana":"しきんちょうたつ","zh":"筹集资金。"},{"ja":"自己資金","kana":"じこしきん","zh":"自身已有、可使用的资金。"},{"ja":"借入","kana":"かりいれ","zh":"借款、借入资金。"},{"ja":"返済","kana":"へんさい","zh":"偿还借款等债务。"},{"ja":"利息","kana":"りそく","zh":"借用资金支付或出借资金收取的利息。"},{"ja":"出資","kana":"しゅっし","zh":"投入资本，并取得相应权益。"},{"ja":"株式の発行","kana":"かぶしきのはっこう","zh":"发行股份；公司通过新股发行可以筹集股权资金。"}],"questions":[{"type":"choice","prompt":"公司卖出的产品更多了，利润是否一定增加？","options":["一定，因为销量就是利润。","不一定，还要看价格和费用等因素。","一定，只要它是上市公司。"],"answer":1,"explain":"売上和利益不同。收入增加时，费用若增加得更多，利润仍可能下降。"},{"type":"choice","prompt":"哪一项属于公司发行新股获得的资金？","options":["投资者认购公司新发行股份支付的出资。","两个投资者之间买卖旧有股票支付的价款。","投资者开立证券账户支付的账户费用。"],"answer":0,"explain":"新发行股份的认购款可以进入发行公司；普通二级市场的股票买卖款通常支付给卖方。"},{"type":"text","prompt":"「資金調達」的平假名读音是什么？","answers":["しきんちょうたつ"],"explain":"資金读作しきん，調達读作ちょうたつ。"},{"type":"text","prompt":"填入本课表达目的的句型：工場を建てる＿＿＿、資金を集めます。","answers":["ために"],"explain":"动词原形＋ために表示“为了做……”。"}],"writing":{"prompt":"用「ために」写一句公司筹集资金的目的；可以选择设备、研发或雇用员工。","reference":"{新|あたら}しい{機械|きかい}を{買|か}うために、{会社|かいしゃ}は{資金|しきん}を{集|あつ}めます。","zh":"为了购买新机器，公司筹集资金。","checks":["「ために」前是否使用动词原形？","是否说明了资金的具体用途？"]},"notes":["原教材第2章还通过日常产品、企业分工、雇员、工厂和研发说明公司的经济作用；本课以面包企业为原创学习场景。","股份资本一般没有借款式的到期还本义务，但不等于公司可以免费或无责任地使用资金；股东权益与债权不同。","荷兰东印度公司是教材选取的股份制度历史案例，不把单一案例说成所有股份制度唯一且无争议的起点。"],"coverage":["第2章：身边的股份公司；产品和服务、利润目的与社会作用（PDF 6–7）","第2章：企业间协作；材料、人员、设备和研发的资金需求（PDF 7–8）","第2章：自有资金、银行借款、股份发行与投资者出资（PDF 8–9）","第2章：荷兰东印度公司与分担远洋贸易资金和风险的历史背景（PDF 10）"]},{"id":"abc-02","module":"股票与交易","title":"成为股东：权利、股息与卖出","titleJa":"株主の権利","summary":"读懂股东的定义，认识股东大会、股息和股东优惠，并练习“不一定”的表达。","minutes":20,"sources":[{"key":"abc","pages":[11,12],"label":"第3章 株主とは／第4章开头"}],"objectives":["能区分株式、株主、株価三个词。","能解释股息、股东优惠与表决权的区别。","能用「とは限りません」表达股息等结果并无保证。"],"sentences":[{"jp":"{株式|かぶしき}を{持|も}っている{人|ひと}を「{株主|かぶぬし}」といいます。","zh":"持有股票的人称为“股东”。","note":"「AをBといいます」用于下定义；「持っている」表示持有的状态。","page":11,"kind":"原文摘句","sourceKey":"abc"},{"jp":"{株主総会|かぶぬしそうかい}では、{議決権|ぎけつけん}を{持|も}つ{株主|かぶぬし}が{役員|やくいん}の{選任|せんにん}などに{投票|とうひょう}できます。","zh":"在股东大会上，拥有表决权的股东可以就任命董事等事项投票。","note":"「～では」标记场合。是否具有表决权及其数量取决于股份种类、持股和相关规则。","page":11,"kind":"学习例句","sourceKey":"abc"},{"jp":"{配当金|はいとうきん}を{受|う}け{取|と}れるかどうかは{会社|かいしゃ}の{状況|じょうきょう}などによって{変|か}わり、{毎年|まいとし}もらえるとは{限|かぎ}りません。","zh":"能否收到股息会随公司状况等因素变化，并不是每年都一定能收到。","note":"「かどうか」表示是否；「とは限りません」表示并不一定。盈利也不自动等于一定分红。","page":11,"kind":"学习例句","sourceKey":"abc"},{"jp":"{株主優待|かぶぬしゆうたい}で{商品|しょうひん}や{利用券|りようけん}が{届|とど}く{会社|かいしゃ}もありますが、すべての{会社|かいしゃ}が{実施|じっし}しているわけではありません。","zh":"有的公司通过股东优惠向股东提供商品或使用券，但并不是所有公司都有这项安排。","note":"「～もあります」表示也有这样的情况；「わけではありません」用于限定前面的概括。","page":11,"kind":"学习例句","sourceKey":"abc"},{"jp":"{株式|かぶしき}を{現金|げんきん}に{換|か}えたいときは、{通常|つうじょう}、{買|か}いたい{相手|あいて}に{売|う}る{方法|ほうほう}を{考|かんが}えます。","zh":"希望把股票变成现金时，通常会考虑卖给愿意购买的人。","note":"股票不同于可按约定提取的存款；成交还需要买方及可接受的价格。","page":12,"kind":"学习例句","sourceKey":"abc"}],"grammar":[{"pattern":"AをBといいます","explain":"给某个对象下定义，译为“把A称为B”。","example":"{株式|かぶしき}の{値段|ねだん}を「{株価|かぶか}」といいます。","zh":"股票的价格称为“股价”。"},{"pattern":"～とは限りません","explain":"否定“一定如此”的判断，译为“不一定……”。","example":"{利益|りえき}が{増|ふ}えても、{配当金|はいとうきん}が{増|ふ}えるとは{限|かぎ}りません。","zh":"即使利润增加，股息也不一定增加。"}],"terms":[{"ja":"株式","kana":"かぶしき","zh":"股票、股份，代表对公司的股权。"},{"ja":"株主","kana":"かぶぬし","zh":"股东，持有公司股份的人或机构。"},{"ja":"株価","kana":"かぶか","zh":"股价，即股票交易的价格。"},{"ja":"株主総会","kana":"かぶぬしそうかい","zh":"股东大会，依法审议公司重要事项的会议。"},{"ja":"議決権","kana":"ぎけつけん","zh":"表决权，针对特定决议投票的权利。"},{"ja":"選任","kana":"せんにん","zh":"选任、任命。"},{"ja":"解任","kana":"かいにん","zh":"解除职务。"},{"ja":"配当金","kana":"はいとうきん","zh":"股息、分红；并非每年保证支付。"},{"ja":"無配","kana":"むはい","zh":"不派发股息。"},{"ja":"株主優待","kana":"かぶぬしゆうたい","zh":"股东优惠，如商品或优惠券；并非所有公司提供。"},{"ja":"売却","kana":"ばいきゃく","zh":"出售、卖出。"},{"ja":"換金","kana":"かんきん","zh":"变现，把资产换成现金。"}],"questions":[{"type":"choice","prompt":"下列哪一句最准确？","options":["买入股票后，公司每年必须支付股息。","所有股东都必然拥有完全相同的表决权。","股息、表决权和股东优惠分别有适用条件。"],"answer":2,"explain":"股份种类、公司安排和相关规则可能影响权利；股息及优惠不是无条件保证。"},{"type":"choice","prompt":"小林持有某公司股票。通常希望变现时，应如何理解？","options":["可在市场寻找愿意买入的交易对手，成交价格不保证等于买入价。","公司必须按最初买入价随时退钱。","股价下跌时只能等待公司赔偿。"],"answer":0,"explain":"通常通过卖出变现，而不是要求公司按原买价偿还。"},{"type":"text","prompt":"「株主」的平假名读音是什么？","answers":["かぶぬし"],"explain":"注意不是「かぶしき」：株式是股票，株主是股东。"},{"type":"text","prompt":"填空：株式の値段を「＿＿」といいます。请填汉字。","answers":["株価"],"explain":"股票的价格是株価（かぶか）。"}],"writing":{"prompt":"用「とは限りません」写一句关于股息或股东优惠的谨慎表述。","reference":"{株主|かぶぬし}になっても、{毎年|まいとし}{配当金|はいとうきん}をもらえるとは{限|かぎ}りません。","zh":"即使成为股东，也不一定每年都能收到股息。","checks":["是否使用普通形＋とは限りません？","是否避免把股息或股东优惠说成无条件保证？"]},"notes":["本课仅第一句为原文摘句；其余日语为根据主题编写的学习例句。","第3章的权利举例包括股东大会对役员选任、解任和公司规则变更的表决，以及配当金和株主優待；不同股份及持有条件可能影响权利。","“一般通过卖出变现”是普通股票投资的基本说明，不排除依法进行的回购等其他公司行为。"],"coverage":["第3章：股东定义、公司所有者身份（PDF 11）","第3章：股息、股东大会、役员选任解任、公司规则表决、股东优惠（PDF 11）","第3章末与第4章开头：股东如何通过转让股份变现（PDF 11–12）"]},{"id":"abc-03","module":"股票与交易","title":"从上市到下单：钱流向哪里","titleJa":"上場と株式の売買","summary":"沿着投资者、证券公司和交易所的路径，理解上市审查、退市和一级、二级市场。","minutes":22,"sources":[{"key":"abc","pages":[12,13,14,15],"label":"第4章 株式会社と証券取引所"}],"objectives":["能说出投资者、证券公司、交易所的不同角色。","能解释上市审查并不保证投资收益。","能区分购买新发行股票和从其他投资者手中买入股票的资金流向。"],"sentences":[{"jp":"{証券取引所|しょうけんとりひきじょ}は、{多|おお}くの{売|う}り{注文|ちゅうもん}と{買|か}い{注文|ちゅうもん}を{集|あつ}め、{決|き}められたルールで{売買|ばいばい}を{成|な}り{立|た}たせる{場所|ばしょ}です。","zh":"证券交易所汇集大量卖单和买单，并按照既定规则促成交易。","note":"「成り立たせる」在这里表示使交易成立。市场降低买卖双方寻找对手的困难。","page":12,"kind":"学习例句","sourceKey":"abc"},{"jp":"{投資者|とうししゃ}は{証券会社|しょうけんがいしゃ}を{通|つう}じて{注文|ちゅうもん}を{出|だ}し、{売買|ばいばい}が{成立|せいりつ}すると{報告|ほうこく}を{受|う}けます。","zh":"投资者通过证券公司下单，交易成交后收到报告。","note":"「～を通じて」表示通过某个渠道。证券公司和证券交易所不是同一个主体。","page":15,"kind":"学习例句","sourceKey":"abc"},{"jp":"{上場審査|じょうじょうしんさ}では、{会社|かいしゃ}の{経営|けいえい}や{情報公開|じょうほうこうかい}などが{確認|かくにん}され、{市場区分|しじょうくぶん}によって{基準|きじゅん}も{異|こと}なります。","zh":"上市审查会检查公司的经营、信息公开等事项，标准也会因市场板块而不同。","note":"「によって」表示依照、根据。教材介绍Prime、Standard、Growth三个市场板块，不以板块名称判断收益高低。","page":13,"kind":"学习例句","sourceKey":"abc"},{"jp":"{上場|じょうじょう}している{会社|かいしゃ}でも、{基準|きじゅん}を{満|み}たさなくなれば{上場廃止|じょうじょうはいし}になることがあり、{投資|とうし}の{安全|あんぜん}が{保証|ほしょう}されるわけではありません。","zh":"即使是上市公司，不再符合相关标准时也可能退市；上市并不代表投资安全得到保证。","note":"「～ことがある」表示可能发生。退市不等于公司必定破产；教材列举破产、虚假信息等例子。","page":14,"kind":"学习例句","sourceKey":"abc"},{"jp":"{会社|かいしゃ}が{新|あたら}しく{発行|はっこう}する{株式|かぶしき}を{買|か}う{場合|ばあい}と、ほかの{投資者|とうししゃ}から{買|か}う{場合|ばあい}では、お{金|かね}の{行|い}き{先|さき}が{違|ちが}います。","zh":"认购公司新发行的股票和从其他投资者手中买入股票，钱的去向不同。","note":"新股认购款可流入发行公司；普通二级市场交易的买入款支付给卖方。不能把每一次买股都说成直接给公司融资。","page":12,"kind":"学习例句","sourceKey":"abc"}],"grammar":[{"pattern":"～を通じて","explain":"表示借助机构、媒介或途径做某事。","example":"{証券会社|しょうけんがいしゃ}を{通|つう}じて、{株式|かぶしき}を{売|う}ります。","zh":"通过证券公司卖出股票。"},{"pattern":"～によって異なります","explain":"表示因条件不同而不同。","example":"{会社|かいしゃ}によって、{必要|ひつよう}な{資金|しきん}の{額|がく}は{異|こと}なります。","zh":"不同公司需要的资金金额不同。"}],"terms":[{"ja":"証券取引所","kana":"しょうけんとりひきじょ","zh":"证券交易所，组织证券交易的市场机构。"},{"ja":"証券会社","kana":"しょうけんがいしゃ","zh":"证券公司，为投资者提供证券交易等服务。"},{"ja":"投資者","kana":"とうししゃ","zh":"投资者；「投資家」也常用。"},{"ja":"上場","kana":"じょうじょう","zh":"上市，使证券获准在交易所交易。"},{"ja":"上場審査","kana":"じょうじょうしんさ","zh":"上市审查。"},{"ja":"市場区分","kana":"しじょうくぶん","zh":"市场板块、市场分区。"},{"ja":"上場廃止","kana":"じょうじょうはいし","zh":"退市，终止证券在该交易所上市。"},{"ja":"情報公開","kana":"じょうほうこうかい","zh":"信息公开。"},{"ja":"注文","kana":"ちゅうもん","zh":"订单、交易委托。"},{"ja":"売買","kana":"ばいばい","zh":"买卖。"},{"ja":"発行市場","kana":"はっこうしじょう","zh":"发行市场，投资者认购新发行证券的市场。"},{"ja":"流通市場","kana":"りゅうつうしじょう","zh":"流通市场，已发行证券在投资者等主体之间交易的市场。"}],"questions":[{"type":"choice","prompt":"美咲在市场上买入健太卖出的已有股票。忽略费用，买入款通常支付给谁？","options":["发行公司。","卖方健太。","作为股息分给所有股东。"],"answer":1,"explain":"这是流通市场交易，价款通常流向卖方；不等于公司发行新股筹资。"},{"type":"choice","prompt":"上市审查通过意味着什么？","options":["股票未来不会下跌。","公司不会再被要求披露信息。","证券符合相应上市条件，但收益和持续上市并不因此得到保证。"],"answer":2,"explain":"上市审查与投资收益保证是两回事，上市后也有持续义务与退市制度。"},{"type":"text","prompt":"「証券取引所」的平假名读音是什么？","answers":["しょうけんとりひきじょ"],"explain":"証券＝しょうけん，取引所＝とりひきじょ。"},{"type":"text","prompt":"填入本课表示“通过”的完整表达：証券会社＿＿＿＿、注文を出します。","answers":["を通じて","をつうじて"],"explain":"完整形式是「証券会社を通じて」。"}],"writing":{"prompt":"用「を通じて」写一句投资者买卖股票的句子。","reference":"{投資者|とうししゃ}は{証券会社|しょうけんがいしゃ}を{通|つう}じて、{買|か}い{注文|ちゅうもん}を{出|だ}します。","zh":"投资者通过证券公司发出买入委托。","checks":["机构后是否接「を通じて」？","是否区分证券公司与证券交易所？"]},"notes":["教材的日本公司数量等数字属于该版资料背景，本课不作为当前统计使用。","上市审查主题包括经营稳定性、成长性、准确及时的信息公开及上市公司的责任；不同市场板块适用不同标准。","一级与二级市场的用语是为理解教材资金流向添加的学习说明；这里的新发行认购示例不包含旧股出售等混合安排。"],"coverage":["第4章：卖方与买方寻找对手的困难；证券交易所的市场功能（PDF 12）","第4章：上市、上市股票、上市公司与Prime/Standard/Growth市场区分（PDF 13）","第4章：上市审查、经营与信息公开责任、退市（PDF 14）","第4章：投资者—证券公司—交易所的委托与成交报告路径（PDF 15）"]},{"id":"abc-04","module":"股票与交易","title":"交易规则：先比价格，再看时间","titleJa":"価格優先と時間優先","summary":"用限价委托的简化场景练习排序，理解价格优先、时间优先及其适用边界。","minutes":22,"sources":[{"key":"abc","pages":[16,17],"label":"第5章 証券取引所での取引のルール"},{"key":"trading","pages":[],"label":"JPX：売買成立の方法（现行规则补充）","url":"https://www.jpx.co.jp/equities/trading/domestic/04.html"}],"objectives":["能比较限价买单与卖单的优先顺序。","能说明同价订单在连续竞价中的时间优先。","能区分限价、市价，并知道板寄せ不完全套用本课例子。"],"sentences":[{"jp":"「1{株|かぶ}980{円|えん}までなら{買|か}う」という{指値注文|さしねちゅうもん}では、{買|か}う{価格|かかく}の{上限|じょうげん}を{指定|してい}します。","zh":"“每股不超过980日元就买”的限价委托，指定的是买入价格的上限。","note":"「～までなら」限定可接受的范围。限价委托可能无法成交，并非下单就一定买到。","page":16,"kind":"学习例句","sourceKey":"abc"},{"jp":"ザラバの{指値|さしね}の{買|か}い{注文|ちゅうもん}を{比|くら}べると、1,010{円|えん}の{注文|ちゅうもん}は1,000{円|えん}の{注文|ちゅうもん}より{優先|ゆうせん}されます。","zh":"比较连续竞价中的限价买单，1010日元的订单优先于1000日元的订单。","note":"买单是价格高者优先；这是排序规则，不代表成交价必定是1010日元。","page":16,"kind":"学习例句","sourceKey":"abc"},{"jp":"{反対|はんたい}に、{指値|さしね}の{売|う}り{注文|ちゅうもん}では、{価格|かかく}が{低|ひく}いほうが{先|さき}になります。","zh":"相反，对于限价卖单，价格更低的订单优先。","note":"「反対に」引出相反方向；买方愿出更高价、卖方愿收更低价，分别在各自队列中更优先。","page":16,"kind":"学习例句","sourceKey":"abc"},{"jp":"{同|おな}じ{価格|かかく}の{指値注文|さしねちゅうもん}なら、ザラバでは{通常|つうじょう}、{早|はや}く{受|う}け{付|つ}けた{注文|ちゅうもん}が{優先|ゆうせん}されます。","zh":"同价限价订单在连续竞价中，通常由更早被接受的订单优先。","note":"比较的是交易系统接受的先后；有些集合竞价情形会将订单视为同时发出。","page":17,"kind":"学习例句","sourceKey":"abc"},{"jp":"{成行注文|なりゆきちゅうもん}は{価格|かかく}を{指定|してい}しないため、{思|おも}っていた{価格|かかく}で{約定|やくじょう}するとは{限|かぎ}りません。","zh":"市价委托没有指定价格，因此未必会以预期价格成交。","note":"「約定」读作やくじょう。市价委托通常优先于限价委托，但成交价格和是否成交仍受市场状况与规则影响。","page":16,"kind":"学习例句","sourceKey":"abc"}],"grammar":[{"pattern":"AよりBのほうが～","explain":"比较两个对象；本课用来表达谁更优先。","example":"{買|か}い{注文|ちゅうもん}では、{低|ひく}い{価格|かかく}より{高|たか}い{価格|かかく}のほうが{優先|ゆうせん}されます。","zh":"在买入委托中，高价比低价更优先。"},{"pattern":"～なら","explain":"提出条件，译为“如果是……”。","example":"{同|おな}じ{価格|かかく}なら、{受付時刻|うけつけじこく}を{確認|かくにん}します。","zh":"如果价格相同，就确认接受委托的时刻。"}],"terms":[{"ja":"価格優先","kana":"かかくゆうせん","zh":"价格优先：限价买单价格高者优先，限价卖单价格低者优先。"},{"ja":"時間優先","kana":"じかんゆうせん","zh":"时间优先：适用该规则时，同价委托按接受先后排序。"},{"ja":"買い注文","kana":"かいちゅうもん","zh":"买入委托、买单。"},{"ja":"売り注文","kana":"うりちゅうもん","zh":"卖出委托、卖单。"},{"ja":"指値注文","kana":"さしねちゅうもん","zh":"限价委托，指定买入最高价或卖出最低价。"},{"ja":"成行注文","kana":"なりゆきちゅうもん","zh":"市价委托，不指定成交价格。"},{"ja":"約定","kana":"やくじょう","zh":"成交，买卖合同成立。"},{"ja":"数量","kana":"すうりょう","zh":"数量，此处指订单的股票数量。"},{"ja":"ザラバ","kana":"ざらば","zh":"连续竞价阶段，符合条件的买卖订单依次成交。"},{"ja":"板寄せ","kana":"いたよせ","zh":"集合竞价方法，汇集订单后按规则决定单一成交价。"}],"questions":[{"type":"choice","prompt":"连续竞价中，两笔普通限价买单分别为980日元与990日元，先比较价格时哪笔优先？","options":["980日元。","990日元。","一定由数量更大的订单优先。"],"answer":1,"explain":"买单的限价越高，价格优先级越高。"},{"type":"choice","prompt":"连续竞价中，两笔普通限价卖单价格同为1020日元。A于10:01收到，B于10:02收到，通常哪笔优先？","options":["B。","无论任何情况都随机。","A。"],"answer":2,"explain":"同价时适用时间优先，通常更早被系统接受的A优先。"},{"type":"choice","prompt":"关于本课简化排序，哪一项正确？","options":["可以不加区别地套用于所有开盘、收盘和复牌集合竞价。","主要说明连续竞价；集合竞价有额外规则和时间优先的例外。","市价委托保证按上一笔成交价成交。"],"answer":1,"explain":"板寄せ与ザラバ的撮合方法不同，不能把简化场景当成所有时段的完整交易规则。"},{"type":"text","prompt":"「約定」的平假名读音是什么？","answers":["やくじょう"],"explain":"证券交易中的約定读作やくじょう，表示成交。"}],"writing":{"prompt":"用「なら」写一句同价限价订单的时间优先规则，并写明ザラバ场景。","reference":"ザラバで{同|おな}じ{価格|かかく}なら、{通常|つうじょう}は{早|はや}く{受|う}け{付|つ}けた{注文|ちゅうもん}が{優先|ゆうせん}されます。","zh":"连续竞价中价格相同时，通常较早接受的订单优先。","checks":["是否表达了“同价”这个条件？","是否注明适用于ザラバ，而非笼统说所有交易？"]},"notes":["练习只模拟连续竞价中普通限价委托的相对排序，省略价格限制、特殊报价、部分成交等细节；排序本身不保证成交。","东证还有板寄せ方式。开盘、复牌等情形存在同价订单视为同时发出的例外，收盘集合竞价也有专门优先规则。现行补充来源见「教材页码」中的 JPX「売買成立の方法」。","限价与市价是为应用本章规则增加的基础词汇；本课不提供证券账户操作指引或实际下单建议。"],"coverage":["第5章：计算机交易系统与规则（PDF 16）","第5章：价格优先——买价高者、卖价低者优先（PDF 16）","第5章：时间优先——同价订单的接受先后（PDF 17）","教学补充：指値、成行、ザラバ与板寄せ，说明基础排序的适用边界"]},{"id":"abc-05","module":"股票与交易","title":"市场背后的工作：披露、监督与交收","titleJa":"市場を支える仕事","summary":"认识交易所市场的监督、上市公司支持、参与者检查、系统与清算交收，练习“是否”与目的表达。","minutes":22,"sources":[{"key":"abc","pages":[18,19],"label":"第6章 証券取引所の主な仕事"}],"objectives":["能区分实时交易监视、事后审查和及时披露。","能描述参与者检查与可靠交易系统的作用。","能区分成交、清算与交收三个环节。"],"sentences":[{"jp":"{市場|しじょう}を{監視|かんし}する{担当者|たんとうしゃ}は、{注文|ちゅうもん}に{不自然|ふしぜん}な{点|てん}がないか{調|しら}べ、{必要|ひつよう}に{応|おう}じて{詳|くわ}しい{審査|しんさ}につなげます。","zh":"市场监督人员会检查订单是否存在异常，并在需要时转入更详细的审查。","note":"「～がないか」表示检查是否存在问题；异常只是调查线索，并不直接等于违法。","page":18,"kind":"学习例句","sourceKey":"abc"},{"jp":"{重要|じゅうよう}な{情報|じょうほう}を{投資者|とうししゃ}が{知|し}ることができるように、{上場会社|じょうじょうがいしゃ}の{適時開示|てきじかいじ}を{支|ささ}える{仕事|しごと}があります。","zh":"为使投资者能够获取重要信息，市场中有支持上市公司及时披露的工作。","note":"「できるように」说明希望实现的状态；公开信息有助于投资者作判断，不保证判断一定正确。","page":18,"kind":"学习例句","sourceKey":"abc"},{"jp":"{取引参加者|とりひきさんかしゃ}の{検査|けんさ}では、ルールを{守|まも}っているかどうかや、{財産|ざいさん}の{状況|じょうきょう}などを{確認|かくにん}します。","zh":"对交易参与者进行检查时，会确认其是否遵守规则，以及财产状况等。","note":"「かどうか」将“是否……”整体作为确认的内容。交易参与者通常指获准直接参加市场交易的证券公司等机构。","page":19,"kind":"学习例句","sourceKey":"abc"},{"jp":"{売買|ばいばい}システムが{安定|あんてい}して{動|うご}くように、{開発|かいはつ}、{品質管理|ひんしつかんり}、{運用|うんよう}の{担当者|たんとうしゃ}が{協力|きょうりょく}します。","zh":"为使交易系统稳定运行，开发、质量管理和运行维护人员协同工作。","note":"这里「運用」是系统运行维护，并非资产投资；同一个词需根据上下文理解。","page":19,"kind":"学习例句","sourceKey":"abc"},{"jp":"{売買|ばいばい}が{成立|せいりつ}した{後|あと}も、{清算|せいさん}で{受渡|うけわたし}の{義務|ぎむ}を{整理|せいり}し、{決済|けっさい}で{株式|かぶしき}と{代金|だいきん}を{受|う}け{渡|わた}す{仕組|しく}みが{必要|ひつよう}です。","zh":"交易成交后，还需要通过清算整理交付义务，再通过交收完成股票和价款的交付。","note":"成交不等于交收已经全部结束。清算与交收在证券市场中由相应专业机构和参与者分工完成。","page":19,"kind":"学习例句","sourceKey":"abc"}],"grammar":[{"pattern":"～かどうか","explain":"把一个“是或否”的问题嵌入句子，译为“是否……”。","example":"{情報|じょうほう}が{正確|せいかく}かどうかを{確認|かくにん}します。","zh":"确认信息是否准确。"},{"pattern":"～ように","explain":"表达期望实现的状态或目的，常接可能形或表示状态的动词。","example":"{安心|あんしん}して{取引|とりひき}できるように、ルールを{整|ととの}えます。","zh":"为使人们能够安心交易而完善规则。"}],"terms":[{"ja":"市場","kana":"しじょう","zh":"市场；在证券语境读しじょう，不读いちば。"},{"ja":"監視","kana":"かんし","zh":"监视、持续监督。"},{"ja":"売買審査","kana":"ばいばいしんさ","zh":"交易审查，对可疑交易等进行核查。"},{"ja":"公正性","kana":"こうせいせい","zh":"公正性，市场参与者按公平规则交易的性质。"},{"ja":"適時開示","kana":"てきじかいじ","zh":"及时披露，按规则公开可能影响投资判断的重要公司信息。"},{"ja":"取引参加者","kana":"とりひきさんかしゃ","zh":"获准直接参加交易所市场交易的证券公司等机构。"},{"ja":"考査","kana":"こうさ","zh":"检查、考查，此处指对交易参与者等的业务检查。"},{"ja":"清算","kana":"せいさん","zh":"清算，对成交后的债权债务和交付义务作整理等处理。"},{"ja":"決済","kana":"けっさい","zh":"交收、结算，此处指实际交付证券与资金。"},{"ja":"受渡","kana":"うけわたし","zh":"交付、交割。"},{"ja":"品質管理","kana":"ひんしつかんり","zh":"质量管理。"},{"ja":"運用","kana":"うんよう","zh":"运用；在本课指系统运行与维护。"}],"questions":[{"type":"choice","prompt":"系统发现某笔订单“不自然”，最恰当的理解是什么？","options":["必定是违法交易，不必调查。","这是需要进一步检查的线索。","说明股票一定会下跌。"],"answer":1,"explain":"监视和审查用于发现及核实问题，异常本身不是已经认定违法。"},{"type":"choice","prompt":"哪一组顺序最符合本课的基本概念？","options":["成交成立 → 清算整理义务 → 交收证券与资金。","交收完成 → 才可能产生任何订单。","及时披露 → 自动保证所有投资者获利。"],"answer":0,"explain":"交易合同成立与之后的清算、交收是不同环节。"},{"type":"text","prompt":"证券语境中的「市場」用平假名怎么读？","answers":["しじょう"],"explain":"证券市场读しじょう；不要误用集市的いちば。"},{"type":"text","prompt":"填空：ルールを守っている＿＿＿を確認します。填入“是否”的句型。","answers":["かどうか"],"explain":"「～かどうか」将是否遵守规则作为确认内容。"}],"writing":{"prompt":"用「かどうか」写一句在市场监督、信息披露或系统检查中需要确认的事情。","reference":"{重要|じゅうよう}な{情報|じょうほう}が{公表|こうひょう}されているかどうかを{確認|かくにん}します。","zh":"确认重要信息是否已经公开。","checks":["是否使用普通形＋かどうか？","是否写出了具体需要检查的事项？"]},"notes":["教材第6章还提到上市咨询、上市制度整备、上市费用、退市处理，以及对希望成为交易参与者的机构进行审查。","教材所列年审查件数和每天交易笔数属于该版的背景数字；本课不将它们作为当前数据。","“交易所市场的基础设施”涵盖多个专业机构的分工，不应据此认为每一步清算交收都由东京证券交易所自身直接完成。"],"coverage":["第6章：市场实时监视、交易信息整理分析、异常交易审查（PDF 18）","第6章：上市公司支持、及时披露、上市制度与退市处理（PDF 18）","第6章：交易系统企划、开发、质量管理和运行（PDF 19）","第6章：交易参与者检查、新参与者资格审查、清算与交收（PDF 19）"]},{"id":"abc-06","module":"股票与交易","title":"股价为何变化：企业、利率与世界","titleJa":"株価を動かす要因","summary":"把公司业绩、预期、利率、汇率和外部事件连起来，练习带条件地解释股价变化。","minutes":25,"sources":[{"key":"abc","pages":[20,21,22,23,24,25,26],"label":"第7章 株価はなぜ動くの／影响因素"}],"objectives":["能用供需与预期解释股价变化，而不是只看一条新闻。","能区分円高与円安，并讨论进出口企业的差异。","能列举利率、政策、国际情势、天气与灾害的影响路径。"],"sentences":[{"jp":"{株価|かぶか}は{売|う}りたい{人|ひと}と{買|か}いたい{人|ひと}の{注文|ちゅうもん}で{動|うご}き、{会社|かいしゃ}の{業績|ぎょうせき}だけでなく、{将来|しょうらい}への{予想|よそう}や{人気|にんき}にも{影響|えいきょう}されます。","zh":"股价会随着买卖双方的委托而变动，不仅受公司业绩影响，也受未来预期和市场关注度影响。","note":"「だけでなく～にも」表示不仅……也……。成交的买入总股数与卖出总股数相等；供需压力说的是各价位的买卖意愿，不是成交买家比卖家多。","page":21,"kind":"学习例句","sourceKey":"abc"},{"jp":"{金利|きんり}が{上|あ}がると、{借入|かりいれ}の{費用|ひよう}が{増|ふ}えたり、{株式|かぶしき}と{預金|よきん}の{魅力|みりょく}を{比|くら}べ{直|なお}したりするため、{株価|かぶか}に{影響|えいきょう}が{出|で}ることがあります。","zh":"利率上升可能增加借款成本，也会使投资者重新比较股票与存款的吸引力，因此可能影响股价。","note":"「～たり～たりする」列举不止一种影响渠道。利率与股价并不是任何时候都机械地反向变化。","page":22,"kind":"学习例句","sourceKey":"abc"},{"jp":"1ドルが100{円|えん}から80{円|えん}になる{円高|えんだか}では、ほかの{条件|じょうけん}が{同|おな}じなら、ドルで{払|はら}う{輸入代金|ゆにゅうだいきん}は{円|えん}に{直|なお}すと{少|すく}なくなります。","zh":"1美元从100日元变为80日元属于日元升值；其他条件相同时，以美元支付的进口款换算成日元后会减少。","note":"美元兑换的日元数减少，表示日元更强。例子假设美元价格、数量等不变。","page":23,"kind":"学习例句","sourceKey":"abc"},{"jp":"{反対|はんたい}に、{円安|えんやす}でドルの{売上|うりあげ}を{円|えん}に{換|か}えた{額|がく}が{増|ふ}えても、{輸入|ゆにゅう}する{材料|ざいりょう}の{費用|ひよう}まで{増|ふ}える{場合|ばあい}があります。","zh":"相反，日元贬值即使提高了美元销售收入换算成日元的金额，也可能同时推高进口原材料费用。","note":"用同一家公司的收入和成本说明汇率影响不能只看“出口”标签；还可能受套期保值等因素影响。","page":24,"kind":"学习例句","sourceKey":"abc"},{"jp":"{政策|せいさく}や{国際情勢|こくさいじょうせい}、{災害|さいがい}や{天候|てんこう}のニュースを{読|よ}むときは、どの{会社|かいしゃ}の{売上|うりあげ}や{費用|ひよう}に、どう{影響|えいきょう}するかを{考|かんが}えます。","zh":"阅读政策、国际局势、灾害或天气新闻时，要思考它们会如何影响哪些公司的收入或费用。","note":"「どの～に、どう～か」分别追问对象和路径；同一事件对不同企业可能有不同影响。","page":25,"kind":"学习例句","sourceKey":"abc"}],"grammar":[{"pattern":"～だけでなく、～も","explain":"把影响因素从一项扩展到另一项，译为“不仅……也……”。","example":"{売上|うりあげ}だけでなく、{費用|ひよう}も{調|しら}べます。","zh":"不仅查看销售收入，也查看费用。"},{"pattern":"～場合があります","explain":"表示存在某种可能，避免把因果关系写成保证。","example":"{円安|えんやす}で{材料費|ざいりょうひ}が{上|あ}がる{場合|ばあい}があります。","zh":"日元贬值可能导致材料费用上升。"}],"terms":[{"ja":"需要","kana":"じゅよう","zh":"需求，愿意在各个价格购买的意愿与数量。"},{"ja":"供給","kana":"きょうきゅう","zh":"供给，愿意在各个价格出售的意愿与数量。"},{"ja":"業績","kana":"ぎょうせき","zh":"经营业绩，如销售收入、利润等。"},{"ja":"予想","kana":"よそう","zh":"预期、预测；可能已反映在价格中。"},{"ja":"金利","kana":"きんり","zh":"利率，资金借贷或存款利息的比例。"},{"ja":"外国為替相場","kana":"がいこくかわせそうば","zh":"外汇汇率，不同货币之间的兑换价格。"},{"ja":"円高","kana":"えんだか","zh":"日元升值，同一日元能兑换更多外国货币。"},{"ja":"円安","kana":"えんやす","zh":"日元贬值，同一日元能兑换更少外国货币。"},{"ja":"輸入","kana":"ゆにゅう","zh":"进口，从国外购入商品等。"},{"ja":"輸出","kana":"ゆしゅつ","zh":"出口，向国外销售商品等。"},{"ja":"財政政策","kana":"ざいせいせいさく","zh":"财政政策，政府支出、税收等政策。"},{"ja":"国際情勢","kana":"こくさいじょうせい","zh":"国际局势、国际政治经济环境。"}],"questions":[{"type":"choice","prompt":"1美元从100日元变为80日元，应称为什么？","options":["円安，因为数字变小。","円高，因为购买1美元所需日元更少。","与汇率无关。"],"answer":1,"explain":"日元购买力相对于美元增强，称为円高。"},{"type":"choice","prompt":"一家公司公布利润增长后股价却下跌，哪种解释合理？","options":["股票不可能出现这种情况。","只要利润增长，股价就保证上涨。","市场之前可能预期更高增长，或出现了其他不利信息。"],"answer":2,"explain":"股价受到预期与多种因素影响，实际增长仍可能低于此前预期。"},{"type":"choice","prompt":"美元货价固定为10美元，不考虑其他成本，汇率从每美元100日元变为80日元，进口付款如何变化？","options":["从1000日元降至800日元。","从800日元升至1000日元。","仍为1000日元。"],"answer":0,"explain":"10×100＝1000，10×80＝800；这是条件明确的换算示例，不等于公司利润保证增加200日元。"},{"type":"text","prompt":"「業績」的平假名读音是什么？","answers":["ぎょうせき"],"explain":"業績读作ぎょうせき，指经营表现。"}],"writing":{"prompt":"选择利率、汇率、政策或天气，用「場合があります」写一句可能的影响，并指出收入或费用渠道。","reference":"{暑|あつ}い{日|ひ}が{続|つづ}くと、{冷|つめ}たい{飲|の}み{物|もの}の{売上|うりあげ}が{増|ふ}える{場合|ばあい}があります。","zh":"炎热天气持续时，冷饮销售收入可能增加。","checks":["是否说明影响的是收入、费用或其他具体渠道？","是否使用可能性表达，避免断言股价必涨或必跌？"]},"notes":["教材用企业业绩与市场人气说明个股因素，并介绍凯恩斯有关“猜测他人偏好”的比喻。本课以“预期可能已反映在价格中”练习同类概念，未复制该引文。","政治主题包括选举、预算、政府支出、税收和政策言论；国际主题包括1987年市场暴跌、2001年恐怖袭击、2008年金融危机、2020年疫情等历史例子。它们是原教材的历史材料，不是未来行情模板。","自然灾害可能损伤生产、改变修复需求；天气可能影响饮料、空调等需求。不能据此保证相关股票一定朝某个方向变化。","汇率例子采用固定美元单价、数量和其他条件。现实还需考虑进口成本、海外生产、套期保值及市场已计入的预期。"],"coverage":["第7章：需求、供给与股价形成；企业因素与全市场因素（PDF 20）","第7章：业绩、增长预期、人气及对他人预期的判断（PDF 21）","第7章：利率经由企业借款和个人资金选择影响股价（PDF 22）","第7章：外国汇率、円高/円安、进口与出口企业的差异（PDF 23–24）","第7章：政治、财政政策、国际情势与历史冲击（PDF 25）","第7章：自然灾害、天气、新闻阅读与身边企业观察（PDF 26）"]},{"id":"abc-07","module":"股票与交易","title":"读行情与逛东证：指数、历史和展示","titleJa":"株式欄から東証アローズへ","summary":"读懂行情表与股价指数，再通过教材中的Arrows展区和历史年表，把股票交易放回真实场景。","minutes":25,"sources":[{"key":"abc","pages":[27,30,31],"label":"第7章末 行情表／指数补充与书末资源"},{"key":"abc","pages":[4,5],"label":"第1章 東証アローズについて"},{"key":"abc","pages":[28,29,30],"label":"第8章 東京証券取引所の歴史／兜町补充"},{"key":"topix","pages":[],"label":"JPX：TOPIX 指数说明（现行口径补充）","url":"https://www.jpx.co.jp/markets/indices/topix/index.html"},{"key":"nikkei","pages":[],"label":"日经指数官方：日经平均股价","url":"https://indexes.nikkei.co.jp/nkave/index/profile?idx=nk225"}],"objectives":["能读出始值、高值、低值、收盘价、前日比与成交量。","能区分单只股票的价格与股票指数。","能用日语介绍教材中的东证展区，并按历史顺序描述交易方式的变化。"],"sentences":[{"jp":"{株式欄|かぶしきらん}では、{銘柄|めいがら}ごとに{始値|はじめね}、{高値|たかね}、{安値|やすね}、{終値|おわりね}を{読|よ}み、{前日比|ぜんじつひ}と{出来高|できだか}の{単位|たんい}も{確認|かくにん}します。","zh":"阅读股票行情栏时，按证券名称查看开盘价、最高价、最低价和收盘价，同时确认前日涨跌及成交量的单位。","note":"四个价格对应同一交易日的不同信息。原教材表格使用「売買高」；与这里的「出来高」均用于表示成交量。","page":27,"kind":"学习例句","sourceKey":"abc"},{"jp":"{TOPIX|トピックス}や{日経平均株価|にっけいへいきんかぶか}は、{一社|いっしゃ}の{株価|かぶか}ではなく、{複数|ふくすう}の{銘柄|めいがら}の{動|うご}きをまとめて{見|み}るための{指数|しすう}です。","zh":"TOPIX和日经平均股价不是一家公司的股价，而是用来综合观察多只证券走势的指数。","note":"指数选样和计算方法不同，所以两种指数可能出现不同涨跌幅。不要把指数上涨理解为每只股票都上涨。","page":30,"kind":"学习例句","sourceKey":"abc"},{"jp":"{教材|きょうざい}の{東証|とうしょう}アローズ{案内|あんない}には、{投資|とうし}{体験|たいけん}コーナー、マーケットセンター、チッカー、{上場|じょうじょう}の{鐘|かね}、{大|おお}きなスクリーン、ビデオ{上映室|じょうえいしつ}が{登場|とうじょう}します。","zh":"教材的东证Arrows介绍中，有投资体验区、市场中心、滚动行情显示屏、上市钟、大屏幕和视频放映室。","note":"用「教材の案内には」标明这是该版教材介绍的设施；本课不把它作为当前开放或预约信息。","page":5,"kind":"学习例句","sourceKey":"abc"},{"jp":"1878{年|ねん}に{東京株式取引所|とうきょうかぶしきとりひきじょ}が{兜町|かぶとちょう}にでき、{震災|しんさい}や{戦争|せんそう}を{経|へ}て、1949{年|ねん}には{新|あら}たな{証券取引所|しょうけんとりひきじょ}が{設立|せつりつ}されました。","zh":"1878年东京股票交易所在兜町成立；历经震灾与战争后，1949年设立了新的证券交易所。","note":"「～を経て」表示经过。这里压缩历史线索，不把1878年的组织与1949年后的组织当作未经变动的同一法人。","page":28,"kind":"学习例句","sourceKey":"abc"},{"jp":"{黒板|こくばん}や{手|て}サインを{使|つか}った{時代|じだい}の{後|あと}、{取引|とりひき}は{電子化|でんしか}が{進|すす}み、2000{年|ねん}にはアローズが{開設|かいせつ}され、2013{年|ねん}には{JPX|ジェイピーエックス}が{誕生|たんじょう}しました。","zh":"在使用黑板和手势的年代之后，交易逐步电子化；2000年Arrows开设，2013年JPX成立。","note":"「～の後」组织时间顺序。这里没有把Arrows开设日期当作所有电子化交易首次启动的日期。","page":29,"kind":"学习例句","sourceKey":"abc"}],"grammar":[{"pattern":"～ごとに","explain":"表示以某个单位逐一处理，译为“每……”。","example":"{銘柄|めいがら}ごとに、{終値|おわりね}と{出来高|できだか}を{記録|きろく}します。","zh":"按每只证券记录收盘价和成交量。"},{"pattern":"～を経て","explain":"表示经过某个阶段、过程或事件。","example":"{長|なが}い{歴史|れきし}を{経|へ}て、{取引|とりひき}の{方法|ほうほう}は{変|か}わってきました。","zh":"经过漫长的历史，交易方式不断发生变化。"}],"terms":[{"ja":"銘柄","kana":"めいがら","zh":"证券品种、证券名称，此处指某只股票。"},{"ja":"始値","kana":"はじめね","zh":"开盘价，该交易日第一笔成交价格。"},{"ja":"高値","kana":"たかね","zh":"最高价，该交易日成交价格中的最高值。"},{"ja":"安値","kana":"やすね","zh":"最低价，该交易日成交价格中的最低值。"},{"ja":"終値","kana":"おわりね","zh":"收盘价，该交易日最后的成交价格。"},{"ja":"前日比","kana":"ぜんじつひ","zh":"较前一交易日的变化；行情表中通常比较收盘价。"},{"ja":"出来高","kana":"できだか","zh":"成交量；股票常按成交股数表示，须查看显示单位。"},{"ja":"株価指数","kana":"かぶかしすう","zh":"股票价格指数，将一组股票的走势按规则汇总为数值。"},{"ja":"時価総額","kana":"じかそうがく","zh":"市值；公司的基本计算为股价乘相应股份数，指数使用的口径可能另有调整。"},{"ja":"上場の鐘","kana":"じょうじょうのかね","zh":"上市钟，教材介绍的上市仪式等活动中的钟。"},{"ja":"立会場","kana":"たちあいじょう","zh":"交易大厅，历史上集中进行交易的场所。"},{"ja":"兜町","kana":"かぶとちょう","zh":"兜町，东京的金融历史街区名称。"},{"ja":"TOPIX","kana":"トピックス","zh":"东证股价指数，依照浮动股市值等规则加权。"},{"ja":"日経平均株価","kana":"にっけいへいきんかぶか","zh":"日经平均股价，又称日经225；采用按规则调整的价格加权方法。"}],"questions":[{"type":"choice","prompt":"原创行情示例：始値100、高値110、安値98、終値106；前一交易日收盘价104。前日比是多少？","options":["+6。","+2。","−4。"],"answer":1,"explain":"前日比比较106与104，结果为+2；不是当天收盘价减开盘价。"},{"type":"choice","prompt":"某股价指数今天上涨，能够据此推出什么？","options":["该指数按其规则汇总后的数值上涨。","全部股票都上涨。","该指数明天还会继续上涨。"],"answer":0,"explain":"指数是汇总指标，并不保证每个成分股上涨，也不保证未来表现。"},{"type":"text","prompt":"「出来高」的平假名读音是什么？","answers":["できだか"],"explain":"出来高读作できだか；教材中的売買高读作ばいばいだか。"},{"type":"text","prompt":"本课时间线中，教材记载JPX成立于哪一年？请填4位数字。","answers":["2013"],"explain":"2013年，东京证券交易所与大阪证券交易所经营整合，形成日本交易所集团。"}],"writing":{"prompt":"用「ごとに」写一句阅读行情表时的学习习惯，或用「を経て」写一句交易方式的历史变化。","reference":"{銘柄|めいがら}ごとに{終値|おわりね}を{調|しら}べ、{前日|ぜんじつ}の{終値|おわりね}と{比|くら}べます。","zh":"按每只证券查收盘价，并与前一交易日收盘价比较。","checks":["是否正确使用「ごとに」或「を経て」？","如比较行情，是否明确比较对象、日期和单位？"]},"notes":["行情阅读：原教材通过互联网和报纸查股价。其示例表的△与▲表示涨跌，成交量单位为百股；其他页面的符号、单位和更新时间可能不同，应逐一确认。教材中的数值不是实时行情。","指数补充：TOPIX采用浮动股市值加权；日经平均股价（日经225）是由225只选定股票构成、按其规则调整计算的股价平均型指数。旧版教材关于TOPIX与原东证第一部的表述有历史背景，不当作当前固定成分规则。两种指数的官方说明均见「教材页码」。","教材参观主题：投资体验区使用虚构证券模拟交易；市场中心展示监督工作；チッカー呈现证券名称、成交价格和前日比较；大屏幕展示交易量、交易金额、上市公司数、市值和指数；上市钟用于典礼等活动，视频室用于介绍东证。参观图还标出证券史料展厅、历史照片与旧交易大厅浮雕。","历史补充：教材介绍涩泽荣一等人参与1878年交易所创立、1923年关东大地震及1927/1931年重建建筑、1949年战后交易所设立、1960年前后的黑板报价，以及1985–1999年的手势交易大厅。1999年大厅关闭后，2000年Arrows在原址开设；2013年形成JPX。","兜町补充：教材将街区名称与兜塚、兜神社相关传说联系起来，并明确列有多种说法；同时介绍1873年的第一国立银行与1871年的早期邮政设施，帮助理解该地的近代金融与通信背景。","阅读延伸：书末介绍东证学生学习网站、投资历史模拟工具与读者反馈入口（PDF 31）；它们是延伸资源，不是新增教材章节。本课未核实参观开放时间、模拟工具或反馈服务当前可用性。"],"coverage":["第7章末：网络和报纸查价；行情栏、始/高/低/终值、前日比、売買高（PDF 27）","补充栏目：TOPIX、日经平均股价与指数用途，区分旧版和现行口径（PDF 30）","第1章：Arrows平面导览、投资体验、市场中心、チッカー、上市钟、大屏幕和视频室（PDF 4–5）","第8章：1878创立、地震重建、1949重设、手势交易、电子化、Arrows和2013 JPX（PDF 28–29）","历史补充：兜町地名传说、第一国立银行与邮政起点（PDF 30）","书末延伸：学生网站、历史投资模拟与反馈入口（PDF 31）"]},{"id":"role-01","module":"交易所机制","title":"资金怎样从储蓄者流向企业","titleJa":"資金の流れと取引所の役割","summary":"用一家虚构文具公司的融资计划，区分股票、债券、发行市场与流通市场，再认识 JPX 的分工与收入。","minutes":25,"sources":[{"key":"role","pages":[3,4,5,6,7],"label":"Ⅰ JPX；Ⅱ 证券、融资、流通市场与资金配置"},{"key":"role","pages":[58,63],"label":"参考2：证券市场历史与历史照片"}],"objectives":["区分企业发行新证券与投资者转让已有证券","用日语说明股权、债权、直接金融与间接金融","认识 JPX 各业务的分工、收入来源与发展脉络"],"sentences":[{"jp":"{新しい|あたらしい}{工場|こうじょう}を{建てる|たてる}ために、ある{文具会社|ぶんぐがいしゃ}は{株式|かぶしき}の{発行|はっこう}と{銀行|ぎんこう}からの{借入れ|かりいれ}を{比べています|くらべています}。","zh":"为了建造新工厂，一家文具公司正在比较发行股票和向银行借款两种办法。","kind":"学习例句","note":"～ために表示目的。发行股票与银行贷款的资金性质、还款义务不同。","sourceKey":"role","page":5},{"jp":"{新株|しんかぶ}の{購入代金|こうにゅうだいきん}は{会社|かいしゃ}に{入ります|はいります}が、{投資家同士|とうしかどうし}の{売買代金|ばいばいだいきん}は{売った|うった}{人|ひと}に{渡ります|わたります}。","zh":"认购新股的款项进入公司，而投资者之间买卖已有股票的款项交给卖出者。","kind":"学习例句","note":"～が连接对比。这句话限定为新股认购与已有股票转让，不把 IPO 的老股出售误算成公司融资。","sourceKey":"role","page":6},{"jp":"{株主|かぶぬし}は{会社|かいしゃ}の{所有者|しょゆうしゃ}の{一人|ひとり}になる{一方|いっぽう}で、{社債|しゃさい}の{保有者|ほゆうしゃ}は{会社|かいしゃ}に{資金|しきん}を{貸す|かす}{立場|たちば}になります。","zh":"股东成为公司的所有者之一，而公司债持有人处于向公司提供借款的立场。","kind":"学习例句","note":"～一方で用于并列对比。股票分红与债券利息不是同一种权利。","sourceKey":"role","page":5},{"jp":"{東京証券取引所|とうきょうしょうけんとりひきじょ}が{現物市場|げんぶつしじょう}を{運営し|うんえいし}、{大阪取引所|おおさかとりひきじょ}がデリバティブ{市場|しじょう}を{運営する|うんえいする}という{分担|ぶんたん}があります。","zh":"存在这样的业务分工：东京证券交易所运营现货市场，大阪交易所运营衍生品市场。","kind":"学习例句","note":"～という分担概括分工；这里按教材所述的组织分工学习，不是全部 JPX 业务清单。","sourceKey":"role","page":3},{"jp":"{取引|とりひき}に{関する|かんする}{料金|りょうきん}や{上場料|じょうじょうりょう}、{情報料|じょうほうりょう}は、{市場|しじょう}のシステムを{維持する|いじする}{費用|ひよう}などに{充てられます|あてられます}。","zh":"与交易有关的费用、上市费、信息费等收入，被用于市场系统维护等开支。","kind":"学习例句","note":"充てる＝用于某项用途；充てられる是被动形式。公共性较高的市场服务仍需要收入支持运营。","sourceKey":"role","page":4}],"grammar":[{"pattern":"动词原形＋ために","explain":"表示有意实施某项行动的目的，译为“为了……”。","example":"{資金|しきん}を{集める|あつめる}ために、{会社|かいしゃ}は{社債|しゃさい}を{発行します|はっこうします}。","zh":"为了筹集资金，公司发行公司债。"},{"pattern":"～一方で、～","explain":"并列两个方面，可表示差异，不一定表达好坏判断。","example":"{株価|かぶか}には{上がる|あがる}{可能性|かのうせい}がある{一方|いっぽう}で、{下がる|さがる}{可能性|かのうせい}もあります。","zh":"股价有上涨的可能，也有下跌的可能。"}],"terms":[{"ja":"資金調達","kana":"しきんちょうたつ","zh":"筹集经营或投资所需资金。"},{"ja":"直接金融","kana":"ちょくせつきんゆう","zh":"投资者通过购买股票、债券等向融资方提供资金。"},{"ja":"間接金融","kana":"かんせつきんゆう","zh":"以银行等金融机构为中介的融资。"},{"ja":"自己資本","kana":"じこしほん","zh":"股东投入及留存收益等形成的权益资本。"},{"ja":"社債","kana":"しゃさい","zh":"公司发行的债券；与股票不同，属于债权。"},{"ja":"発行市場","kana":"はっこうしじょう","zh":"新证券发行并募集资金的市场。"},{"ja":"流通市場","kana":"りゅうつうしじょう","zh":"已发行证券在投资者之间转让的市场。"},{"ja":"有限責任","kana":"ゆうげんせきにん","zh":"通常股东对公司的责任以出资额为限；另行借款的还款义务并不会消失。"},{"ja":"公募増資","kana":"こうぼぞうし","zh":"面向不特定投资者募集新股资金。"},{"ja":"売出し","kana":"うりだし","zh":"已有股东向投资者出售已发行证券；款项通常归出售股东。"},{"ja":"株式分割","kana":"かぶしきぶんかつ","zh":"把每股拆成更多股，拆分本身不创造企业价值。"},{"ja":"上場料","kana":"じょうじょうりょう","zh":"上市公司向交易所支付的相关费用。"},{"ja":"JPX","kana":"ジェイピーエックス","zh":"日本交易所集团；旗下机构承担现货、衍生品、清算、数据及自律监管等不同职能。"}],"questions":[{"type":"choice","prompt":"投资者甲从投资者乙手中买入已有股票，价款通常首先归谁？","options":["该公司的工厂","卖出股票的投资者乙","所有股东平均分配"],"answer":1,"explain":"流通市场交易转移已发行证券，款项归卖方；这笔交易本身并未向公司注入新股资本。"},{"type":"choice","prompt":"哪一个属于直接金融的典型例子？","options":["企业发行公司债供投资者认购","居民把钱存入银行活期账户","企业向银行借款"],"answer":0,"explain":"投资者认购公司债，直接成为发行企业的债权人。"},{"type":"text","prompt":"写出「流通市場」的平假名读音。","answers":["りゅうつうしじょう"],"explain":"流通＝りゅうつう，市場在金融语境中读しじょう。"},{"type":"choice","prompt":"一次 1 拆 2 的股票拆分，单凭拆分动作可以推出什么？","options":["股东财富一定翻倍","股数会增加，但不能据此断定持股总价值增加","公司银行存款一定翻倍"],"answer":1,"explain":"股数变化与创造价值是两回事；拆分本身通常伴随每股价格的相应调整。"}],"writing":{"prompt":"用「～ために」写一句日语，说明一家虚构公司为什么发行股票或债券。","reference":"{配送設備|はいそうせつび}を{増やす|ふやす}ために、この{会社|かいしゃ}は{社債|しゃさい}を{発行します|はっこうします}。","zh":"为了增加配送设备，这家公司发行公司债。","checks":["目的是否写在ために前面？","是否区分公司融资与股东出售老股？"]},"notes":["组织地图按教材的 2026 年 3 月版理解：东京证券交易所负责股票等现货市场；大阪交易所及东京商品交易所承担不同衍生品市场；JPX 总研提供数据、指数等服务；JPX-R 负责自律监管；JSCC 负责清算。不要把所有机构都称作证券公司。","发行方式再区分：新股可面向公众、原股东或特定第三方募集；IPO 可含新股募集与老股出售。簿记建档（ブックビルディング）通过申购需求帮助确定发行价格，竞价也是定价方式。无偿配股与拆股不等于取得新增现金。","股票将企业所有权划为较小单位，通常允许转让并附带参与股东大会的权利。普通现货股票的有限责任，不覆盖投资者为买股自行借款所产生的债务。","流通市场的买卖便利性，使投资者不必只在发行时买入；价格又会影响资金流向。但价格发现并不保证每个时刻的价格都等于企业价值，流动性也可能下降。","市场参与者包括个人、养老金和保险公司等机构，以及海外投资者。跨境研究、推广与技术合作是交易所国际业务的组成部分；本课不记忆会变化的驻外办事处数量。","历史定位：1878 年东京与大阪的股票交易所建立，1949 年战后交易所重新设立；TOPIX 于 1969 年开始公布，1999 年传统股票交易大厅关闭，2013 年 JPX 成立，随后现货与衍生品业务整合。年表还呈现商品市场、夜盘、电子系统及 2022 年市场分区的发展，重点理解业务逐步电子化与集中分工。","历史照片中的交易大厅展示当时的人工交易环境，不代表今日下单必须在大厅现场进行。渋沢栄一（しぶさわえいいち）与五代友厚（ごだいともあつ）分别参与东京、大阪早期交易所的建立。"],"coverage":["Ⅰ-1 JPX的成立与集团分工","Ⅰ-2 市场基础设施、海外研究与国际合作","Ⅰ-3 收入来源与运营成本","Ⅱ-1 股票债券、直接间接金融、发行方式、股票特点","Ⅱ-2 流通市场与个人/机构/海外投资者","Ⅱ-3 价格机制与资金配置","参考2 证券市场年表；历史照片及创立人物"]},{"id":"role-02","module":"交易所机制","title":"从上市审核到公司治理","titleJa":"上場・情報開示・ガバナンス","summary":"练习读懂“上市意味着什么”，查找企业披露，并解释上市维持、退市与公司治理的联系。","minutes":25,"sources":[{"key":"role","pages":[8,9,10,11],"label":"Ⅲ 上市审核、上市益处、披露、上市管理"},{"key":"role","pages":[46,47],"label":"Ⅹ-1 公司治理与原则实施或解释"}],"objectives":["区分上市资格与投资回报保证","分辨 EDINET 法定披露和 TDnet 适时披露","理解上市后管理、退市以及公司治理中的解释义务"],"sentences":[{"jp":"{上場|じょうじょう}を{目指す|めざす}{会社|かいしゃ}は、{財務|ざいむ}だけでなく、{情報|じょうほう}を{正しく|ただしく}{伝える|つたえる}{体制|たいせい}も{整えます|ととのえます}。","zh":"准备上市的公司不仅要处理财务方面的问题，也要建立正确传达信息的机制。","kind":"学习例句","note":"～だけでなく、～も＝不仅……也……。审核涉及财务、流通性和公司组织等方面。","sourceKey":"role","page":8},{"jp":"{新しい|あたらしい}{設備|せつび}の{事故|じこ}が{業績|ぎょうせき}に{大きく|おおきく}{影響する|えいきょうする}{場合|ばあい}、{会社|かいしゃ}は{必要な|ひつような}{情報|じょうほう}を{適時|てきじ}に{開示します|かいじします}。","zh":"如果新设备的事故对业绩产生重大影响，公司应及时披露必要信息。","kind":"学习例句","note":"～場合说明条件。是否触发具体披露义务需按实际信息和规则判断，本句是概念练习。","sourceKey":"role","page":9},{"jp":"{有価証券報告書|ゆうかしょうけんほうこくしょ}は{EDINET|エディネット}で{調べ|しらべ}、{適時開示|てきじかいじ}の{資料|しりょう}は{TDnet|ティーディーネット}で{確認する|かくにんする}ことにしました。","zh":"我决定在 EDINET 查有价证券报告书，在 TDnet 核对适时披露资料。","kind":"学习例句","note":"～ことにしました表示作出决定。两个系统用途不同，不能把定期报告和临时重大事项混为一谈。","sourceKey":"role","page":10},{"jp":"{上場廃止|じょうじょうはいし}になる{理由|りゆう}は{一つ|ひとつ}ではないので、{会社|かいしゃ}の{発表|はっぴょう}を{読んで|よんで}{事情|じじょう}を{確かめます|たしかめます}。","zh":"导致退市的原因不止一种，因此要阅读公司公告来确认具体情况。","kind":"学习例句","note":"～ので表达原因。收购导致的私有化与违规退市，含义不能等同。","sourceKey":"role","page":11},{"jp":"{原則|げんそく}を{実施しない|じっししない}{場合|ばあい}は、{自社|じしゃ}の{事情|じじょう}とその{理由|りゆう}を{投資家|とうしか}に{説明する|せつめいする}ことが{求められます|もとめられます}。","zh":"对于未实施的原则，公司需要向投资者解释自身情况和理由。","kind":"学习例句","note":"～ことが求められる＝被要求……。此处指治理守则“实施或解释”的适用原则，不表示法律可随意不遵守。","sourceKey":"role","page":47}],"grammar":[{"pattern":"～だけでなく、～も","explain":"强调条件或范围不止一个，金融文章常用来列举评价维度。","example":"{利益|りえき}だけでなく、{情報開示|じょうほうかいじ}の{質|しつ}も{見ます|みます}。","zh":"不仅看利润，也看信息披露的质量。"},{"pattern":"～かどうか","explain":"把“是否……”变成句子中的判断对象。","example":"{予想|よそう}が{修正された|しゅうせいされた}かどうか、{発表資料|はっぴょうしりょう}で{確認します|かくにんします}。","zh":"我在公告材料中确认预测是否经过修订。"}],"terms":[{"ja":"上場審査","kana":"じょうじょうしんさ","zh":"交易所对上市申请是否满足条件的审查。"},{"ja":"財務の健全性","kana":"ざいむのけんぜんせい","zh":"财务状况稳健程度；属于审核及分析维度。"},{"ja":"情報開示","kana":"じょうほうかいじ","zh":"向投资者公开企业信息。"},{"ja":"法定開示","kana":"ほうていかいじ","zh":"法律要求的披露，如有价证券报告书。"},{"ja":"適時開示","kana":"てきじかいじ","zh":"根据交易所规则及时公开影响投资判断的重要信息。"},{"ja":"決算短信","kana":"けっさんたんしん","zh":"业绩快报，提供决算的概要信息。"},{"ja":"有価証券報告書","kana":"ゆうかしょうけんほうこくしょ","zh":"有价证券报告书，包含业务、财务及风险等信息。"},{"ja":"業績予想","kana":"ぎょうせきよそう","zh":"公司对未来经营业绩的预测，不是保证。"},{"ja":"上場管理","kana":"じょうじょうかんり","zh":"上市后检查企业是否持续遵守相关规则。"},{"ja":"上場廃止","kana":"じょうじょうはいし","zh":"取消上市，停止在该交易所市场交易。"},{"ja":"取締役会","kana":"とりしまりやくかい","zh":"董事会；承担经营决策和监督等职责。"},{"ja":"原則","kana":"げんそく","zh":"原则；治理守则中强调其目的与实质，而不只是形式。"},{"ja":"EDINET","kana":"エディネット","zh":"日本金融厅的电子披露系统，可查询有价证券报告书等法定披露。"},{"ja":"TDnet","kana":"ティーディーネット","zh":"适时披露信息传达系统，可查询上市公司发布的重要事项等资料。"}],"questions":[{"type":"choice","prompt":"通过上市审核最合理的理解是什么？","options":["交易所保证股价不会下跌","公司满足了相应上市条件，投资结果仍有不确定性","公司未来每年都必须增加分红"],"answer":1,"explain":"上市审核涉及上市条件与公司体制，不是对股价和回报的担保。"},{"type":"choice","prompt":"查询法定的「有価証券報告書」，本课建议先使用哪一个系统？","options":["EDINET","订单簿","气象预报系统"],"answer":0,"explain":"EDINET 是法定披露的重要查阅入口；TDnet 主要用于交易所适时披露。"},{"type":"text","prompt":"写出「適時開示」的平假名读音。","answers":["てきじかいじ"],"explain":"適時＝てきじ，開示＝かいじ。"},{"type":"choice","prompt":"“Comply or Explain”的意思是？","options":["所有法律都可以不遵守","适用的治理原则应实施；不实施时解释理由","只需要提交股价预测"],"answer":1,"explain":"它针对治理守则原则的实施与解释，不能替代法律或其他强制规则。"}],"writing":{"prompt":"用「～かどうか」写一句日语，说明你准备从公告中核实什么。","reference":"{配当予想|はいとうよそう}が{変わった|かわった}かどうか、{最新の|さいしんの}{開示資料|かいじしりょう}で{確認します|かくにんします}。","zh":"我将在最新披露资料中确认分红预测是否发生变化。","checks":["かどうか前面是否是完整判断？","是否把预测与已经确定的实际结果区分开？"]},"notes":["上市可提高公司知名度、股票流动性和融资便利性，也带来持续披露及治理义务。教材介绍 Prime、Standard、Growth 和 TOKYO PRO Market 的不同定位；具体门槛应按适用市场的现行规则查询，不把某一个市场的数字套用到全部企业。","定期决算通常经历报表编制、审计、董事会程序、业绩公布和股东大会等环节；不同文件承担不同披露职责。分析时应对齐报告期间、发布日期、预测口径与后续更正。","适时披露既可能来自公司作出的决定，也可能来自发生的事件、决算及业绩或分红预测修正。符合条件的子公司事项也可能影响母公司的披露。","上市管理可要求改善报告、采取公开措施或适用其他规则处置；最终退市并不是所有问题的唯一处理方式。監理銘柄（かんりめいがら）提示可能退市的状态，整理銘柄（せいりめいがら）与已决定退市后的交易安排有关；具体期限按当时公告查看。","公司治理既关注防止不当行为，也关注合理决策与长期价值。五个基本维度可记为：股东权利及平等、其他利益相关者、透明披露、董事会职责、与股东对话。","原则导向要求公司解释为什么某种做法符合其实际情况；“实施或解释”不等于任意省略规则。不同市场适用范围可能不同。"],"coverage":["Ⅲ-1 上市审核、不同市场与财务/流动性要求","Ⅲ-2 上市的融资与知名度益处","Ⅲ-3 法定与适时披露、EDINET、TDnet、决算流程","Ⅲ-4 上市管理、改善措施、监理/整理与退市","Ⅹ-1 公司治理、五项基本原则、原则导向、实施或解释"]},{"id":"role-03","module":"交易所机制","title":"一张买单怎样进入市场","titleJa":"注文・売買ルール・取引システム","summary":"从价格优先与时间优先，读到集合竞价、涨跌幅限制，以及订单背后的网络和交易系统。","minutes":25,"sources":[{"key":"role","pages":[12,13,14],"label":"Ⅳ 下单、传递、交易规则与行情"},{"key":"role","pages":[26,27,28],"label":"Ⅵ arrownet、arrowhead、ToSTNeT与J-GATE"}],"objectives":["准确区分限价单、市价单以及券商和交易所","理解连续交易、集合竞价和涨跌幅限制","识别市场网络、撮合系统、行情与风险检查的不同功能"],"sentences":[{"jp":"{練習用|れんしゅうよう}の{注文画面|ちゅうもんがめん}で、ある{銘柄|めいがら}を950{円以下|えんいか}で{買う|かう}{指値注文|さしねちゅうもん}を{入力しました|にゅうりょくしました}。","zh":"我在练习用的下单界面输入了一张限价买单，要以每股不高于 950 日元的价格买入某只股票。","kind":"学习例句","note":"以下包含本数。限价买单规定最高可接受价，并不保证成交。","sourceKey":"role","page":12},{"jp":"{証券会社|しょうけんがいしゃ}が{顧客|こきゃく}の{注文|ちゅうもん}を{取引所|とりひきじょ}へ{送り|おくり}、{取引所|とりひきじょ}は{売り|うり}と{買い|かい}の{条件|じょうけん}を{照合します|しょうごうします}。","zh":"证券公司将客户订单发送给交易所，交易所匹配卖单与买单的条件。","kind":"学习例句","note":"送り连接后一个动作；“券商接单”与“交易所撮合”是不同环节。","sourceKey":"role","page":13},{"jp":"{ザラバ中|ざらばちゅう}の{同じ|おなじ}{値段|ねだん}の{指値注文|さしねちゅうもん}では、{原則|げんそく}として、{先に|さきに}{出された|だされた}{注文|ちゅうもん}が{優先されます|ゆうせんされます}。","zh":"连续交易期间，相同价格的限价订单原则上优先处理先提交的订单。","kind":"学习例句","note":"～として＝作为、按……。限定ザラバ，避免把开盘集合竞价中的同时订单也按普通时间优先解释。","sourceKey":"role","page":13},{"jp":"{板寄せ|いたよせ}では{注文|ちゅうもん}を{集めて|あつめて}{一つ|ひとつ}の{約定価格|やくじょうかかく}を{決め|きめ}、{ザラバ|ざらば}では{条件|じょうけん}の{合う|あう}{注文|ちゅうもん}を{順に|じゅんに}{約定させます|やくじょうさせます}。","zh":"集合竞价汇集订单后确定一个成交价；连续交易则依次撮合条件相符的订单。","kind":"学习例句","note":"～では提示不同场景。約定する读やくじょうする，不读やくてい。","sourceKey":"role","page":14},{"jp":"{注文|ちゅうもん}を{運ぶ|はこぶ}ネットワークと、{売買|ばいばい}を{成立させる|せいりつさせる}システムは、{異なる|ことなる}{役割|やくわり}を{持っています|もっています}。","zh":"传送订单的网络和使交易成交的系统，承担不同职责。","kind":"学习例句","note":"～を持っている说明具备某种功能。网速、撮合、清算和交收不能混成同一个过程。","sourceKey":"role","page":26}],"grammar":[{"pattern":"～以下／～以上","explain":"以下是不高于，以上是不低于，均包含临界值。股票限价常用。","example":"{一株|ひとかぶ}を950{円以下|えんいか}で{買いたい|かいたい}です。","zh":"我想以每股不高于 950 日元的价格买入。"},{"pattern":"～に基づいて","explain":"表示依据规则、数据或材料开展动作。","example":"{決められた|きめられた}ルールに{基づいて|もとづいて}、{注文|ちゅうもん}を{処理します|しょりします}。","zh":"根据既定规则处理订单。"}],"terms":[{"ja":"指値注文","kana":"さしねちゅうもん","zh":"限价单：买单设最高可接受价，卖单设最低可接受价。"},{"ja":"成行注文","kana":"なりゆきちゅうもん","zh":"市价单：不指定价格，成交价存在不确定性。"},{"ja":"銘柄","kana":"めいがら","zh":"某个具体证券或交易品种。"},{"ja":"約定","kana":"やくじょう","zh":"订单成交、交易契约成立。"},{"ja":"価格優先","kana":"かかくゆうせん","zh":"更高的买价、更低的卖价原则上优先。"},{"ja":"時間優先","kana":"じかんゆうせん","zh":"条件相同时原则上优先较早的订单；存在集合竞价等例外。"},{"ja":"板寄せ","kana":"いたよせ","zh":"汇集订单，以一个价格集中成交的方式。"},{"ja":"ザラバ","kana":"ざらば","zh":"开盘与收盘之间的连续撮合交易。"},{"ja":"制限値幅","kana":"せいげんねはば","zh":"按规则设置的单日价格波动范围。"},{"ja":"気配","kana":"けはい","zh":"买卖报价等行情信息，并非已经成交的价格。"},{"ja":"売買高","kana":"ばいばいだか","zh":"成交数量；不要与成交金额混淆。"},{"ja":"売買代金","kana":"ばいばいだいきん","zh":"成交金额，即价格与成交数量相乘后汇总。"}],"questions":[{"type":"choice","prompt":"每股 950 日元的限价买单意味着什么？","options":["必须以高于 950 日元成交","最高接受 950 日元，但可能不成交","一定立刻以 950 日元成交"],"answer":1,"explain":"买入限价是价格上限，实际是否成交还取决于对手订单和市场状态。"},{"type":"choice","prompt":"普通连续交易中，950 日元和 960 日元两张买入限价单，哪一个价格优先？","options":["950 日元","两者永远同时","960 日元"],"answer":2,"explain":"更高买价对卖方更有利，因此在价格优先原则下 960 日元买单优先。"},{"type":"text","prompt":"写出「約定」的平假名读音。","answers":["やくじょう"],"explain":"金融交易里的約定读やくじょう，表示成交。"},{"type":"choice","prompt":"下列哪一项最符合 arrownet 的作用？","options":["连接市场参与者与相关系统的网络","保证每笔交易盈利的基金","上市公司的利润表"],"answer":0,"explain":"arrownet 是网络；arrowhead、ToSTNeT 和 J-GATE 分担不同交易系统功能。"}],"writing":{"prompt":"用一句日语说明你在模拟交易中选择哪种订单，以及你理解的一项限制。","reference":"{価格|かかく}を{決めたい|きめたい}ので{指値注文|さしねちゅうもん}を{使います|つかいます}が、{約定|やくじょう}しない{可能性|かのうせい}もあります。","zh":"因为想设定价格，我使用限价单，但它也可能不成交。","checks":["是否准确写出指値与成行的区别？","是否避免把限价单写成必定成交？"]},"notes":["下单要明确品种、买卖方向、数量、价格条件和有效时间。教材还讲前場（ぜんば）、後場（ごば）、寄付（よりつき）与引け（ひけ）；交易时段、交易单位与具体收盘安排属于会更新的规则，实际下单前应查官方当日规则。","附条件订单的概念：寄付条件指定开盘执行，引条件指定收盘执行；不成（ふなり）订单在规定条件下由未成交限价转成收盘市价；IOC 要求即时执行可成交部分并取消剩余量。是否可用及细节取决于市场和券商。","价格优先通常先看最有利的买卖价，再在适用时比较时间。开盘、恢复交易等集合竞价可将此前订单视作同时提交，因此不能机械套用连续交易的时间次序。","制限値幅限制价格范围，却不保证能在希望的价格卖出。触及限制时仍可能存在大量未成交订单，行情中的买卖报价也不等于成交。","成交信息经过行情系统和信息供应商传到终端。常见字段包括报价、成交价、开高低收、成交量和成交额；阅读新闻时应核对是实时值、延迟值还是收盘数据。","按本教材版本：arrownet 提供连接；arrowhead 用于现货竞价；ToSTNeT 用于立会外交易；J-GATE 用于衍生品。备份中心、冗余、容量扩展和订单风险检查服务于业务连续性，不能被理解为系统绝不会出故障。","系统可提供订单受理、撮合、结果通知、行情发布及风险监控。较近的服务器连接可以减少通信延迟，但通信距离、撮合规则与投资表现是不同问题。"],"coverage":["Ⅳ-1 下单项目、限价/市价、附条件订单、数量与时段","Ⅳ-2 券商至交易所的订单流","Ⅳ-3 价格/时间优先、同时报价、集合竞价/连续交易、价格限制","Ⅳ-4 行情传递","Ⅵ-1 arrownet与市场连接、冗余及业务连续性","Ⅵ-2 arrowhead、ToSTNeT、J-GATE、撮合/行情/风险管理"]},{"id":"role-04","module":"交易所机制","title":"期货：约定、保证金与风险转移","titleJa":"先物・証拠金・ヘッジ","summary":"用虚构原料采购场景理解期货，分清合约义务、平仓、最终交收、杠杆、套保、投机与套利。","minutes":30,"sources":[{"key":"role","pages":[15,16,17,18,19,20],"label":"Ⅴ-1 期货的历史、标的、期限、交收、保证金与用途"}],"objectives":["区别期货合约义务与期权买方的选择权","说明未平仓合约、到期与反向交易的关系","理解保证金不等于最大亏损，套保不等于消除所有风险"],"sentences":[{"jp":"ある{食品会社|しょくひんがいしゃ}は、{原料価格|げんりょうかかく}の{上昇|じょうしょう}に{備える|そなえる}ため、{先物|さきもの}を{買う|かう}{方法|ほうほう}を{検討しています|けんとうしています}。","zh":"一家食品公司为应对原料涨价，正在研究买入期货的办法。","kind":"学习例句","note":"～に備える＝为某种可能情况作准备。采购方关心原料上涨风险，生产者则可能关心售价下跌风险。","sourceKey":"role","page":19},{"jp":"{先物|さきもの}の{契約|けいやく}は、{相場|そうば}が{不利|ふり}になったという{理由|りゆう}だけでは{放棄できません|ほうきできません}。","zh":"期货合约不能仅因行情变得不利就任意放弃。","kind":"学习例句","note":"～だけでは＝仅凭……不能。可按市场规则反向交易平仓，但亏损和义务不会因此被自动免除。","sourceKey":"role","page":17},{"jp":"{買い建てた|かいたてた}{先物|さきもの}を{同じ|おなじ}{銘柄|めいがら}の{売り|うり}で{決済する|けっさいする}ことを、{反対売買|はんたいばいばい}といいます。","zh":"用同一合约品种的卖出交易了结买入的期货头寸，叫作反向交易。","kind":"学习例句","note":"～ことを～といいます用于定义。同一品种还须匹配合约规格、到期月份及数量，不能拿别的合约替代。","sourceKey":"role","page":17},{"jp":"{株価指数|かぶかしすう}そのものは{受け渡せない|うけわたせない}ため、{指数先物|しすうさきもの}では{金額|きんがく}の{差|さ}を{決済します|けっさいします}。","zh":"由于股价指数本身无法交付，指数期货通过结算金额差额完成交收。","kind":"学习例句","note":"～ため在这里表示原因。商品期货与国债期货的最终交收方式需分别看合约。","sourceKey":"role","page":18},{"jp":"{少ない|すくない}{証拠金|しょうこきん}で{大きな|おおきな}{取引|とりひき}をしても、{損失|そんしつ}がその{証拠金|しょうこきん}までに{限られる|かぎられる}わけではありません。","zh":"即使以较少保证金进行较大规模交易，亏损也并不因此以保证金为上限。","kind":"学习例句","note":"～わけではありません否定错误推论。投入保证金与合约名义金额是不同数字。","sourceKey":"role","page":18}],"grammar":[{"pattern":"～に備えるために","explain":"表示为应对某项风险或需求而采取行动。","example":"{価格変動|かかくへんどう}に{備える|そなえる}ために、{契約条件|けいやくじょうけん}を{確認します|かくにんします}。","zh":"为应对价格波动，我先核对合约条件。"},{"pattern":"～わけではない","explain":"否定由前文推导出的必然关系，适合纠正金融概念误解。","example":"{証拠金|しょうこきん}が{少ない|すくない}からといって、リスクが{小さい|ちいさい}わけではありません。","zh":"保证金较少，并不意味着风险较小。"}],"terms":[{"ja":"先物取引","kana":"さきものとりひき","zh":"按约定条件买卖未来交收的合约，可依规则在到期前平仓。"},{"ja":"原資産","kana":"げんしさん","zh":"衍生品对应的基础资产或指标，如商品、债券或指数。"},{"ja":"限月","kana":"げんげつ","zh":"合约到期或最终交收所属月份。"},{"ja":"建玉","kana":"たてぎょく","zh":"尚未了结的合约头寸。"},{"ja":"買い建て","kana":"かいたて","zh":"建立买入方向的头寸。"},{"ja":"売り建て","kana":"うりたて","zh":"建立卖出方向的头寸。"},{"ja":"反対売買","kana":"はんたいばいばい","zh":"通过相反方向的交易了结原有头寸。"},{"ja":"差金決済","kana":"さきんけっさい","zh":"通过支付差额，而非交付标的实物完成结算。"},{"ja":"証拠金","kana":"しょうこきん","zh":"为履行合约义务交付的保证金，不是亏损上限。"},{"ja":"想定元本","kana":"そうていがんぽん","zh":"名义本金，用于描述合约经济规模。"},{"ja":"投機取引","kana":"とうきとりひき","zh":"主动承担价格风险，试图从行情变化中获利。"},{"ja":"裁定取引","kana":"さいていとりひき","zh":"利用相关价格偏离进行成组交易；实际仍有成本、执行等风险。"},{"ja":"VaR","kana":"バリュー・アット・リスク","zh":"风险价值：在一定期间和置信水平下估计的损失指标，不是最大可能损失的保证。"}],"questions":[{"type":"choice","prompt":"期货价格走势不利，持仓者能否像期权买方那样直接放弃合约？","options":["可以，亏损会自动消失","不可以任意放弃，但可依规则平仓并承担盈亏","只要不登录账户就不再有义务"],"answer":1,"explain":"期货产生双方义务；反向平仓是了结方法，不是单方面免除已经发生的损失。"},{"type":"choice","prompt":"某教学合约保证金为 2 万元，实际合约亏损为 3 万元。哪种理解正确？","options":["超过保证金的 1 万元自动免除","亏损必定最多 2 万元","保证金不是亏损上限，可能仍需补足"],"answer":2,"explain":"保证金为履约提供担保，不把损失封顶。这里仅用假设数字解释概念。"},{"type":"text","prompt":"写出「限月」的平假名读音。","answers":["げんげつ"],"explain":"限月读げんげつ，指合约期限所属月份。"},{"type":"choice","prompt":"未来必须购买某种原料，担心它涨价，概念上更接近哪一种套保方向？","options":["买入相关期货","卖出无关股票","只看过去价格并假定不再上涨"],"answer":0,"explain":"买入与采购风险相关的期货可能抵消部分价格上涨影响；相关性、数量和期限匹配仍然重要。"}],"writing":{"prompt":"用「～わけではない」写一句日语，纠正“保证金少，所以风险一定小”的误解。","reference":"{必要な|ひつような}{証拠金|しょうこきん}が{少なくても|すくなくても}、{損失|そんしつ}が{小さくなる|ちいさくなる}わけではありません。","zh":"即使所需保证金少，也不意味着亏损会变小。","checks":["是否使用了否定推论的わけではない？","是否把保证金与最大亏损区分开？"]},"notes":["衍生品的基础标的可包括股票指数、债券、外汇、贵金属、农产品或能源。期货市场的历史可从大阪堂岛米市的有组织交易理解，再联系后来的商品期货与金融期货发展，不必背下各品种所有上线年份。","合约期限、交易终止日与最终交收日不是同一概念。指数期货以特别清算数值 SQ 等规定指标完成最终差额结算；国债期货可能交付合格券，商品期货则可能实物交割或现金结算。须看具体合约规格。","套保（ヘッジ）将原有经营或持仓风险与衍生品头寸组合起来；卖出套保常用于已有资产的下跌风险，买入套保常用于未来采购的上涨风险。标的、期限和数量不匹配会留下基差等风险，也可能减少有利行情带来的收益。","投机以承担方向性风险获取收益为目的；套利比较相互关联的价格，而不只是猜涨跌。跨市场、跨到期月份、现货与期货之间均可能出现价格偏离；手续费、融资、交收和执行风险可能侵蚀理论收益。","股指期货的理论价格与现货、融资成本、期间股息及剩余期限有关，所以期货比现货高并不自动等于高估。简单模型只帮助理解关系，不替代真实交易成本与合约细节。","保证金会随风险和规则调整；价格不利变动可能产生追加要求。VaR 类方法估计特定期限和置信范围内的潜在损失，模型结果不等于最坏情况保证。","互换（スワップ）是另一类衍生品，可交换固定与浮动利息，或不同货币、商品价格所对应的现金流。它与交易所期货的标准合约、交易及清算安排不能一概而论。"],"coverage":["Ⅴ-1 衍生品与原资产、商品/金融期货及历史","Ⅴ-1 标准合约、限月、建玉、反向交易、最终结算","Ⅴ-1 SQ、指数现金结算、国债/商品交收","Ⅴ-1 保证金、名义本金、杠杆与追加保证金","Ⅴ-1 套保、投机、套利、现货期货理论价格","Ⅴ-1 补充专栏：利率/货币/商品互换"]},{"id":"role-05","module":"交易所机制","title":"期权：买方的权利与卖方的义务","titleJa":"オプションの権利と損益","summary":"用原创小数字算例理解看涨和看跌期权，认识四种头寸、权利金、行权时间与基础组合。","minutes":30,"sources":[{"key":"role","pages":[21,22,23,24,25],"label":"Ⅴ-2 期权机制、四种头寸、权利金、行权、历史及用途"}],"objectives":["分清买入看涨、卖出看涨、买入看跌、卖出看跌","在简单到期算例中扣除权利金计算净盈亏","理解期限、波动率与期权价格，以及保护性看跌和备兑看涨的取舍"],"sentences":[{"jp":"{美咲|みさき}さんは、ある{株式|かぶしき}を1,200{円|えん}で{買える|かえる}コールの{権利|けんり}に、60{円|えん}のプレミアムを{支払いました|しはらいました}。","zh":"美咲为一份可按 1,200 日元买入某股票的看涨期权，支付了 60 日元权利金。","kind":"学习例句","note":"这是按一股标的规模简化的原创算例，不代表交易所真实合约单位；后续计算暂不计费用。","sourceKey":"role","page":21},{"jp":"{満期|まんき}の{株価|かぶか}が1,300{円|えん}なら、コールの{価値|かち}は100{円|えん}で、プレミアムを{引いた|ひいた}{利益|りえき}は40{円|えん}です。","zh":"若到期股价为 1,300 日元，看涨期权的到期价值为 100 日元，扣除权利金后的利润为 40 日元
